# Discover ServiceMonitors only from namespaces owned by the monitoring stack,
# the Foretoken platform, or accelerator adapters. An empty object selects
# every ServiceMonitor inside this namespace allowlist, including the monitors
# created by kube-prometheus-stack itself.
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - monitoring
            - foretoken-platform
            - accelerator-monitoring
