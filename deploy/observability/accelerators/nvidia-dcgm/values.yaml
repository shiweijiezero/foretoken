# NVIDIA DCGM Exporter adapter for Foretoken accelerator observability.
# Validated with chart 4.8.2, whose AppVersion pins image
# 4.5.3-4.8.2-distroless. Keep the chart version fixed in install commands.

# Hardware samples are node-scoped. Disable Kubernetes Pod attribution and
# avoid polling the kubelet pod-resources socket.
arguments:
  - -f
  - /etc/dcgm-exporter/default-counters.csv
  - --kubernetes=false

# Hardware monitoring must not preempt inference Pods.
priorityClassName: ""

# These target labels are the Foretoken accelerator adapter contract. Raw DCGM
# metric names, units, and device labels remain unchanged.
serviceMonitor:
  enabled: true
  relabelings:
    - targetLabel: foretoken_observability_source
      replacement: accelerator
    - targetLabel: foretoken_accelerator_vendor
      replacement: nvidia
    - targetLabel: foretoken_accelerator_exporter
      replacement: dcgm

# Base hardware telemetry does not require DCGM profiling privileges.
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    add: []
    drop:
      - ALL

# This is one adapter-owned collector definition, not a set of user-facing
# parameters. It replaces the upstream list because that list enables profiling
# fields that require SYS_ADMIN. Unsupported fields may be absent at runtime.
customMetrics: |
  DCGM_FI_DEV_SM_CLOCK, gauge, SM clock frequency in MHz.
  DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock frequency in MHz.
  DCGM_FI_DEV_MEMORY_TEMP, gauge, Memory temperature in C.
  DCGM_FI_DEV_GPU_TEMP, gauge, GPU temperature in C.
  DCGM_FI_DEV_POWER_USAGE, gauge, Power draw in W.
  DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Total energy consumption since boot in mJ.
  DCGM_FI_DEV_PCIE_REPLAY_COUNTER, counter, Total number of PCIe retries.
  DCGM_FI_DEV_GPU_UTIL, gauge, GPU utilization in percent.
  DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory copy utilization in percent.
  DCGM_FI_DEV_ENC_UTIL, gauge, Encoder utilization in percent.
  DCGM_FI_DEV_DEC_UTIL, gauge, Decoder utilization in percent.
  DCGM_FI_DEV_XID_ERRORS, gauge, Last XID error encountered.
  DCGM_FI_DEV_POWER_VIOLATION, counter, Throttling duration due to power constraints in ns.
  DCGM_FI_DEV_THERMAL_VIOLATION, counter, Throttling duration due to thermal constraints in ns.
  DCGM_FI_DEV_SYNC_BOOST_VIOLATION, counter, Throttling duration due to sync boost constraints in ns.
  DCGM_FI_DEV_BOARD_LIMIT_VIOLATION, counter, Throttling duration due to board limits in ns.
  DCGM_FI_DEV_LOW_UTIL_VIOLATION, counter, Throttling duration due to low utilization in ns.
  DCGM_FI_DEV_RELIABILITY_VIOLATION, counter, Throttling duration due to reliability constraints in ns.
  DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free in MiB.
  DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used in MiB.
  DCGM_FI_DEV_ECC_SBE_VOL_TOTAL, counter, Volatile single bit ECC errors.
  DCGM_FI_DEV_ECC_DBE_VOL_TOTAL, counter, Volatile double bit ECC errors.
  DCGM_FI_DEV_ECC_SBE_AGG_TOTAL, counter, Persistent single bit ECC errors.
  DCGM_FI_DEV_ECC_DBE_AGG_TOTAL, counter, Persistent double bit ECC errors.
  DCGM_FI_DEV_RETIRED_SBE, counter, Pages retired due to single bit errors.
  DCGM_FI_DEV_RETIRED_DBE, counter, Pages retired due to double bit errors.
  DCGM_FI_DEV_RETIRED_PENDING, counter, Pages pending retirement.
  DCGM_FI_DEV_NVLINK_CRC_FLIT_ERROR_COUNT_TOTAL, counter, NVLink flow control CRC errors.
  DCGM_FI_DEV_NVLINK_CRC_DATA_ERROR_COUNT_TOTAL, counter, NVLink data CRC errors.
  DCGM_FI_DEV_NVLINK_REPLAY_ERROR_COUNT_TOTAL, counter, NVLink retries.
  DCGM_FI_DEV_NVLINK_RECOVERY_ERROR_COUNT_TOTAL, counter, NVLink recovery errors.
  DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL, counter, NVLink bandwidth counter for all lanes.
  DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS, counter, Remapped rows for uncorrectable errors.
  DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS, counter, Remapped rows for correctable errors.
  DCGM_FI_DEV_ROW_REMAP_FAILURE, gauge, Whether row remapping has failed.
