# Copy this file and replace the image, Gateway, and GPU values with settings
# that exist in your cluster. The registry must be reachable by workload nodes.
image:
  repository: registry.example.com/foretoken/control-plane
  tag: dev

frontend:
  enabled: true
  image: registry.example.com/foretoken/frontend:dev
  gateway:
    name: inference-gateway
    namespace: gateway-system
    sectionName: https

runtime:
  vllm:
    image: registry.example.com/foretoken/model-server:dev
    accelerator:
      type: nvidia-h100-80gb
      resourceName: nvidia.com/gpu
      # Set this when the cluster exposes GPUs through a RuntimeClass.
      runtimeClassName: nvidia
      nodeSelector:
        key: nvidia.com/gpu.product
        value: NVIDIA-H100-80GB-HBM3
