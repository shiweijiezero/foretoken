# Copy this file and replace the image, Gateway, and GPU values with settings
# that exist in your cluster. The registry must be reachable by workload nodes.
image:
  repository: registry.example.com/foretoken/control-plane
  tag: dev

frontend:
  enabled: true
  image: registry.example.com/foretoken/frontend:dev
  gateway:
    name: inference-gateway
    namespace: gateway-system
    sectionName: https

# Foretoken connects to the platform's existing Prometheus Operator.
observability:
  serviceMonitor:
    # Enable only when the cluster already provides the Prometheus Operator CRDs.
    enabled: false
    additionalLabels:
      # Match the platform Prometheus serviceMonitorSelector.
      release: kube-prometheus
  prometheusRule:
    # Enable with serviceMonitor after the platform Prometheus selects this namespace.
    enabled: false
    additionalLabels:
      # Match the platform Prometheus ruleSelector.
      release: kube-prometheus
  alertingRule:
    # Enable after reviewing the initial warning thresholds and runbooks.
    enabled: false
    additionalLabels:
      # Match the platform Prometheus ruleSelector.
      release: kube-prometheus
  grafanaDashboard:
    # Enable after the platform Grafana sidecar watches this namespace.
    enabled: false
    additionalLabels:
      # Match the kube-prometheus-stack Grafana dashboard sidecar selector.
      grafana_dashboard: "1"
  prometheus:
    namespace: monitoring

runtime:
  vllm:
    image: registry.example.com/foretoken/model-server:dev
    accelerator:
      type: nvidia-h100-80gb
      resourceName: nvidia.com/gpu
      # Set this when the cluster exposes GPUs through a RuntimeClass.
      runtimeClassName: nvidia
      nodeSelector:
        key: nvidia.com/gpu.product
        value: NVIDIA-H100-80GB-HBM3
