# Frontend replicas share one ephemeral API cache, separate from the durable admission ledger.
{{- if and (eq .Values.scope "platform") (eq (include "foretoken.responseStoreManaged" .) "true") }}
{{- $name := include "foretoken.responseStoreName" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: foretoken-response-store
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: foretoken-response-store
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: foretoken-response-store
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  # Never route replicas to two independent caches during an update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: foretoken-response-store
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foretoken-response-store
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ include "foretoken.imageWithRegistry" (dict "registry" .Values.global.imageRegistry "image" .Values.admissionStore.image) | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - valkey-server
            # Frontend Pods connect through the Service; NetworkPolicy restricts ingress.
            - --protected-mode
            - "no"
            - --dir
            - /data
            - --appendonly
            - "no"
            - --save
            - ""
            - --maxmemory-policy
            - noeviction
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: [valkey-cli, -e, ping]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: cache
              mountPath: /data
      volumes:
        - name: cache
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: foretoken-response-store
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: foretoken-response-store
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: inference.foretoken.io/frontend-service
                operator: Exists
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
