{{/* Exposes controller-runtime metrics to the Prometheus Operator. */}}
{{- if and (eq .Values.scope "deployment") (eq (include "foretoken.observabilityEnabled" .) "true") }}
{{- $ports := include "foretoken.controllerPorts" . | fromJson }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "foretoken.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "foretoken.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ int $ports.metrics }}
      targetPort: metrics
      protocol: TCP
{{- end }}
