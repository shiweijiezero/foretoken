{{/* Exposes controller-runtime metrics to the Prometheus Operator. */}}
{{- if eq (include "foretoken.observabilityEnabled" .) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "foretoken.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "foretoken.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
{{- end }}
