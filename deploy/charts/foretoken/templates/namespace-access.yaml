{{- define "foretoken.cacheDirectoryBindings" -}}
{{- $bindings := dict -}}
{{- range $claim, $directory := .Values.namespaceAccess.directories -}}
{{- if hasKey $bindings $directory.directory -}}
{{- fail (printf "directory %s has more than one claim binding" $directory.directory) -}}
{{- end -}}
{{- $_ := set $bindings $directory.directory $claim -}}
{{- end -}}
{{- $bindings | toJson -}}
{{- end -}}

{{- if and (eq .Values.scope "deployment") .Values.namespaceAccess.enabled }}
{{- $controller := include "foretoken.fullname" . }}
{{- $operation := include "foretoken.compactName" (printf "%s-operation" $controller) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "foretoken.compactName" (printf "%s-operator" $controller) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ $controller | quote }}, {{ $operation | quote }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ $operation | quote }}]
    verbs: [patch]
  - apiGroups: [inference.foretoken.io]
    resources: [modelservices, frontendservices, runtimecaches, kvservices, profileruns, videotasks]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [inference.foretoken.io]
    resources: [modelpools, modelgroups, kvpools, kvgroups]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, services, persistentvolumeclaims, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [leaderworkerset.x-k8s.io]
    resources: [leaderworkersets]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [inference.foretoken.io]
    verbs: [get]
{{- range $claim, $directory := .Values.namespaceAccess.directories }}
{{- if not $directory.existingClaim }}
{{- $volume := printf "foretoken.%s.%s" $.Release.Namespace $claim }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $volume }}
  labels:
    {{- include "foretoken.labels" $ | nindent 4 }}
spec:
  capacity:
    storage: {{ required "directory requires capacity" $directory.capacity | quote }}
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: {{ $.Release.Namespace }}
    name: {{ $claim }}
  {{- if $directory.hostPath }}
  hostPath:
    path: {{ $directory.hostPath | quote }}
    type: Directory
  {{- else }}
  nfs:
    server: {{ required "directory requires an NFS server" $directory.server | quote }}
    path: {{ required "directory requires an NFS path" $directory.path | quote }}
  {{- with $directory.mountOptions }}
  mountOptions:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- with $directory.nodeAffinity }}
  nodeAffinity:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  {{- with $directory.hostnames }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                {{- toYaml . | nindent 16 }}
  {{- end }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "foretoken.labels" $ | nindent 4 }}
  annotations:
    inference.foretoken.io/runtime-cache-directory: {{ $directory.directory | quote }}
    {{- with $directory.directoryOwner }}
    inference.foretoken.io/directory-owner: {{ . | quote }}
    {{- end }}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: {{ $volume }}
  resources:
    requests:
      storage: {{ $directory.capacity | quote }}
{{- end }}
{{- end }}
{{- end }}
