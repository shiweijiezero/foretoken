{{/* Makes the English and Chinese Foretoken system dashboards discoverable by Grafana sidecars. */}}

{{- if eq (include "foretoken.observabilityEnabled" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "foretoken.compactName" (printf "%s-system-dashboard" (include "foretoken.fullname" .)) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  foretoken-system-overview.json: |-
{{ .Files.Get "files/grafana/foretoken-system-overview.json" | nindent 4 }}
  foretoken-system-overview-zh.json: |-
{{ .Files.Get "files/grafana/foretoken-system-overview-zh.json" | nindent 4 }}
{{- end }}
