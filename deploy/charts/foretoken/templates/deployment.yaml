{{/* Compile the serving-controller workload for platform-owned deployment instances. */}}
{{- define "foretoken.deploymentController" }}
{{- include "foretoken.validateValues" . }}
{{- $sourceMode := .Values.development.enabled }}
{{- $ports := include "foretoken.controllerPorts" . | fromJson }}
{{- $applications := include "foretoken.applications" . | fromJson }}
{{- $application := index $applications "control-plane" }}
{{- $frontendApplication := index $applications "frontend" }}
{{- $modelApplication := index $applications "model-server" }}
{{- $applicationMount := include "foretoken.applicationMount" . }}
{{- $applicationClient := include "foretoken.imageWithRegistry" (dict "registry" .Values.global.imageRegistry "image" .Values.applicationFiles.clientImage) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foretoken.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    foretoken.io/install-source: {{ ternary "source" "release" $sourceMode | quote }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "foretoken.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        inference.foretoken.io/chart-version: {{ .Chart.Version | quote }}
        {{- with $application }}
        inference.foretoken.io/application-url: {{ . | quote }}
        {{- end }}
      labels:
        {{- include "foretoken.labels" . | nindent 8 }}
        {{- if $application }}
        foretoken.io/application-files: consumer
        {{- end }}
    spec:
      serviceAccountName: {{ include "foretoken.fullname" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- if $application }}
      initContainers:
        - name: application-files
          image: {{ $applicationClient | quote }}
          command:
            - python
            - -c
            - {{ .Files.Get "files/application-download.py" | quote }}
            - {{ $application | quote }}
            - {{ $applicationMount | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: application
              mountPath: {{ $applicationMount }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "foretoken.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - {{ ternary (printf "%s/current/bin/manager" $applicationMount) "/manager" (not (empty $application)) }}
          volumeMounts:
            - name: controller-configuration
              mountPath: /etc/foretoken/controller
              readOnly: true
            {{- if $application }}
            - name: application
              mountPath: {{ $applicationMount }}
              readOnly: true
            {{- end }}
          args:
            - {{ printf "--application-files=%s" (dict "origin" (include "foretoken.applicationFilesOrigin" .) "image" $applicationClient "mountPath" $applicationMount "script" (.Files.Get "files/application-download.py") | toJson) | quote }}
            {{- with $application }}
            - {{ printf "--video-worker-application-url=%s" . | quote }}
            {{- end }}
            {{- with $frontendApplication }}
            - {{ printf "--frontend-application-url=%s" . | quote }}
            {{- end }}
            {{- with $modelApplication }}
            - {{ printf "--model-server-application-url=%s" . | quote }}
            {{- end }}
            {{- with .Values.runtime.preparationImage }}
            - {{ printf "--model-preparation-image=%s" (include "foretoken.imageWithRegistry" (dict "registry" $.Values.global.imageRegistry "image" .)) | quote }}
            {{- end }}
            - --leader-elect=true
            - {{ printf "--source-mode=%t" $sourceMode | quote }}
            - --autoscaling-telemetry-config=/etc/foretoken/controller/autoscaling-telemetry.json
            {{- if eq (include "foretoken.observabilityEnabled" .) "true" }}
            - {{ printf "--metrics-bind-address=:%d" (int $ports.metrics) | quote }}
            - {{ printf "--observability-prometheus=%s" .Values.observability.prometheus | quote }}
            - {{ printf "--observability-labels=%s" (include "foretoken.observabilityLabels" . | fromYaml | toJson) | quote }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            {{- with .Values.admissionStore.externalURLSecret.name }}
            - {{ printf "--admission-store-url-secret-name=%s" . | quote }}
            - {{ printf "--admission-store-url-secret-key=%s" $.Values.admissionStore.externalURLSecret.key | quote }}
            {{- end }}
            - {{ printf "--health-probe-bind-address=:%d" (int $ports.health) | quote }}
            - {{ printf "--video-worker-image=%s" (include "foretoken.image" .) | quote }}
            {{- range .Values.workload.imagePullSecrets }}
            - {{ printf "--workload-image-pull-secret=%s" .name | quote }}
            {{- end }}
            {{- with .Values.workload.leaderWorkerScheduling }}
            - {{ printf "--leader-worker-scheduling=%s" (toJson .) | quote }}
            {{- end }}
            {{- with .Values.workload.cache.claimName }}
            - {{ printf "--cache-claim=%s" . | quote }}
            {{- end }}
            - {{ printf "--cache-mount-path=%s" .Values.workload.cache.mountPath | quote }}
            - {{ printf "--cache-directory-bindings=%s" (include "foretoken.cacheDirectoryBindings" .) | quote }}
            {{- with .Values.modelDistribution.proxyURL }}
            - {{ printf "--model-distribution-download-proxy=%s" . | quote }}
            {{- end }}
            {{- with .Values.runtime.vllm.modelSource.endpoint }}
            - {{ printf "--model-source-endpoint=%s" . | quote }}
            {{- end }}
            {{- with .Values.runtime.vllm.modelSource.tokenSecret.name }}
            - {{ printf "--model-source-token-secret-name=%s" . | quote }}
            - {{ printf "--model-source-token-secret-key=%s" $.Values.runtime.vllm.modelSource.tokenSecret.key | quote }}
            {{- end }}
            - {{ printf "--frontend-port=%d" (int .Values.frontend.port) | quote }}
            {{- if .Values.frontend.enabled }}
            - --frontend-enabled=true
            - {{ printf "--frontend-mode=%s" .Values.frontend.mode | quote }}
            - {{ printf "--frontend-image=%s" (include "foretoken.imageWithRegistry" (dict "registry" .Values.global.imageRegistry "image" .Values.frontend.image)) | quote }}
            {{- with .Values.responseStore.externalURLSecret.name }}
            - {{ printf "--response-store-url-secret-name=%s" . | quote }}
            - {{ printf "--response-store-url-secret-key=%s" $.Values.responseStore.externalURLSecret.key | quote }}
            {{- end }}
            - {{ printf "--response-retention=%s" .Values.responseStore.retention | quote }}
            - {{ printf "--response-replay-retention=%s" .Values.responseStore.replayRetention | quote }}
            {{- if eq .Values.frontend.mode "gateway" }}
            - {{ printf "--frontend-gateway-name=%s" (include "foretoken.frontendGatewayName" .) | quote }}
            - {{ printf "--frontend-gateway-namespace=%s" (include "foretoken.frontendGatewayNamespace" .) | quote }}
            - {{ printf "--frontend-gateway-section-name=%s" (include "foretoken.frontendGatewaySectionName" .) | quote }}
            {{- end }}
            {{- end }}
            {{- with (include "foretoken.runtimeVllmImage" .) }}
            - {{ printf "--inference-engine-image=%s" (include "foretoken.imageWithRegistry" (dict "registry" $.Values.global.imageRegistry "image" .)) | quote }}
            {{- with $.Values.runtime.vllmOmni.image }}
            - {{ printf "--omni-inference-engine-image=%s" (include "foretoken.imageWithRegistry" (dict "registry" $.Values.global.imageRegistry "image" .)) | quote }}
            {{- end }}
            {{- with $.Values.runtime.vllm.nsightImage }}
            - {{ printf "--nsight-image=%s" (include "foretoken.imageWithRegistry" (dict "registry" $.Values.global.imageRegistry "image" .)) | quote }}
            {{- end }}
            - {{ printf "--model-server-port=%d" (int $.Values.runtime.vllm.modelServerPort) | quote }}
            - {{ printf "--gpu-resource-name=%s" $.Values.runtime.vllm.gpu.resourceName | quote }}
            {{- with $.Values.runtime.vllm.gpu.runtimeClassName }}
            - {{ printf "--runtime-class-name=%s" . | quote }}
            {{- end }}
            {{- with $.Values.runtime.vllm.gpu.nodeSelector.key }}
            - {{ printf "--gpu-node-selector-key=%s" . | quote }}
            - {{ printf "--gpu-node-selector-value=%s" $.Values.runtime.vllm.gpu.nodeSelector.value | quote }}
            {{- end }}
            {{- if or $.Values.runtime.vllm.ec.profileName $.Values.runtime.vllm.ec.sharedStorageClaim }}
            - {{ printf "--vllm-ec-profile-name=%s" ($.Values.runtime.vllm.ec.profileName | default "shared-storage") | quote }}
            - {{ printf "--vllm-ec-profile-revision=%s" ($.Values.runtime.vllm.ec.profileRevision | default $.Values.runtime.vllm.profileRevision) | quote }}
            - {{ printf "--vllm-ec-connector=%s" $.Values.runtime.vllm.ec.connector | quote }}
            - {{ printf "--vllm-ec-shared-storage-claim=%s" $.Values.runtime.vllm.ec.sharedStorageClaim | quote }}
            - {{ printf "--vllm-ec-shared-storage-path=%s" $.Values.runtime.vllm.ec.sharedStoragePath | quote }}
            {{- end }}
            {{- $bindings := $.Values.rdma.preparedBindings }}
            {{- if kindIs "slice" $.Values.rdma.bindings }}
            {{- $bindings = $.Values.rdma.bindings }}
            {{- end }}
            {{- if or $bindings (kindIs "slice" $.Values.rdma.bindings) }}
            - {{ printf "--rdma-bindings=%s" ($bindings | toJson) | quote }}
            {{- else if (include "foretoken.rdmaResourceName" $) }}
            - {{ printf "--rdma-resource-name=%s" (include "foretoken.rdmaResourceName" $) | quote }}
            - {{ printf "--rdma-resource-count=%d" (int $.Values.rdma.resourceCount) | quote }}
            {{- $networks := $.Values.rdma.preparedNetworks }}
            {{- if kindIs "slice" $.Values.rdma.networks }}
            {{- $networks = $.Values.rdma.networks }}
            {{- end }}
            {{- range $networks }}
            {{- if or (not (hasKey . "active")) .active }}
            - {{ printf "--rdma-network=%s/%s" (default $.Release.Namespace .namespace) .name | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $.Values.runtime.vllm.mooncakeStore.profileName }}
            - {{ printf "--vllm-mooncake-store-profile-name=%s" $.Values.runtime.vllm.mooncakeStore.profileName | quote }}
            - {{ printf "--vllm-mooncake-store-profile-revision=%s" $.Values.runtime.vllm.mooncakeStore.profileRevision | quote }}
            - {{ printf "--vllm-mooncake-store-config-map-name=%s" $.Values.runtime.vllm.mooncakeStore.configMapName | quote }}
            - {{ printf "--vllm-mooncake-store-config-map-key=%s" $.Values.runtime.vllm.mooncakeStore.configMapKey | quote }}
            - {{ printf "--vllm-mooncake-store-python-hash-seed=%s" $.Values.runtime.vllm.mooncakeStore.pythonHashSeed | quote }}
            {{- end }}
            {{- end }}
          env:
            {{- if not .Values.admissionStore.externalURLSecret.name }}
            - name: FORETOKEN_ADMISSION_STORE_URL
              value: {{ include "foretoken.admissionStoreURL" . | quote }}
            {{- end }}
            {{- if and .Values.frontend.enabled (not .Values.responseStore.externalURLSecret.name) }}
            - name: FORETOKEN_RESPONSE_STORE_URL
              value: {{ include "foretoken.responseStoreURL" . | quote }}
            {{- end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            {{- if eq (include "foretoken.observabilityEnabled" .) "true" }}
            - name: metrics
              containerPort: {{ int $ports.metrics }}
              protocol: TCP
            {{- end }}
            - name: healthz
              containerPort: {{ int $ports.health }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            periodSeconds: 2
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: controller-configuration
          configMap:
            name: {{ include "foretoken.fullname" . }}
        {{- if $application }}
        - name: application
          emptyDir: {}
        {{- end }}
      terminationGracePeriodSeconds: 10
{{- end }}
