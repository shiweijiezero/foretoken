#
# Grants the control-plane service account and required RBAC permissions.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "foretoken.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
---
# RBAC cannot restrict create by resource name; the bootstrapper validates packaged CRD manifests.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "foretoken.clusterName" . }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - create
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    resourceNames:
      - frontendservices.inference.foretoken.io
      - modelservices.inference.foretoken.io
      - modelpools.inference.foretoken.io
      - modelgroups.inference.foretoken.io
    verbs:
      - get
      - patch
  - apiGroups:
      - inference.foretoken.io
    resources:
      - modelservices
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - inference.foretoken.io
    resources:
      - modelservices/status
    verbs:
      - get
      - patch
  - apiGroups:
      - inference.foretoken.io
    resources:
      - modelpools
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "foretoken.clusterName" . }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "foretoken.clusterName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "foretoken.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "foretoken.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "foretoken.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "foretoken.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "foretoken.fullname" . }}
    namespace: {{ .Release.Namespace }}
