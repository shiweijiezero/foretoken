# Grants the control-plane service account and required RBAC permissions.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "foretoken.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
---
# RBAC cannot restrict create by resource name; the bootstrapper validates packaged CRD manifests.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "foretoken.clusterName" . }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - create
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    resourceNames:
      - frontendservices.inference.foretoken.io
      - kvservices.inference.foretoken.io
      - kvpools.inference.foretoken.io
      - kvgroups.inference.foretoken.io
      - modelservices.inference.foretoken.io
      - modelpools.inference.foretoken.io
      - modelgroups.inference.foretoken.io
    verbs:
      - get
      - patch
  - apiGroups:
      - inference.foretoken.io
    resources:
      - frontendservices
    verbs:
      - get
      - list
      - watch
  {{- if .Values.frontend.enabled }}
  - apiGroups:
      - inference.foretoken.io
    resources:
      - frontendservices/status
    verbs:
      - get
      - patch
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
  {{- end }}
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Kubernetes cannot name-restrict create; reconciliation creates only foretoken-kv-indexer.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - foretoken-kv-indexer
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - inference.foretoken.io
    resources:
      - kvservices
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - inference.foretoken.io
    resources:
      - kvservices/status
    verbs:
      - get
      - patch
  - apiGroups:
      - inference.foretoken.io
    resources:
      - kvpools
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - inference.foretoken.io
    resources:
      - kvpools/status
    verbs:
      - get
      - patch
  - apiGroups:
      - inference.foretoken.io
    resources:
      - kvgroups
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - inference.foretoken.io
    resources:
      - kvgroups/status
    verbs:
      - get
      - patch
  - apiGroups:
      - inference.foretoken.io
    resources:
      - modelservices
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - inference.foretoken.io
    resources:
      - modelservices/status
    verbs:
      - get
      - patch
  - apiGroups:
      - inference.foretoken.io
    resources:
      - modelpools
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - inference.foretoken.io
    resources:
      - modelpools/status
    verbs:
      - get
      - patch
  - apiGroups:
      - inference.foretoken.io
    resources:
      - modelgroups
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
  - apiGroups:
      - inference.foretoken.io
    resources:
      - modelgroups/status
    verbs:
      - get
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "foretoken.clusterName" . }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "foretoken.clusterName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "foretoken.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "foretoken.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "foretoken.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "foretoken.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "foretoken.fullname" . }}
    namespace: {{ .Release.Namespace }}
