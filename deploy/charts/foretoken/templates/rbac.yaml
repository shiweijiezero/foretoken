{{/* Bootstrap and its delegated namespace Role consume this single permission definition. */}}
{{- define "foretoken.deploymentRules" }}
- apiGroups: [inference.foretoken.io]
  resources: [frontendservices, frontendservices/status, frontendservices/finalizers, modelservices, modelservices/status, modelservices/finalizers, runtimecaches, runtimecaches/status, runtimecaches/finalizers, kvservices, kvservices/status, kvservices/finalizers]
  verbs: [get, list, watch, update, patch]
- apiGroups: [inference.foretoken.io]
  resources: [modelpools, modelpools/status, modelpools/finalizers, modelgroups, modelgroups/status, modelgroups/finalizers, kvpools, kvpools/status, kvpools/finalizers, kvgroups, kvgroups/status, kvgroups/finalizers, profileruns, profileruns/status, profileruns/finalizers, videotasks, videotasks/status, videotasks/finalizers]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [configmaps, serviceaccounts, persistentvolumeclaims, services]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch, patch, delete]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
- apiGroups: [""]
  resources: [secrets]
  verbs: [create]
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [foretoken-kv-indexer]
  verbs: [get, update, patch]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [roles, rolebindings]
  verbs: [get, list, watch, create, patch, delete]
- apiGroups: [apps]
  resources: [deployments, statefulsets]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [apps]
  resources: [replicasets]
  verbs: [get]
- apiGroups: [batch]
  resources: [jobs]
  verbs: [get, list, watch, create, patch, delete]
- apiGroups: [leaderworkerset.x-k8s.io]
  resources: [leaderworkersets]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [gateway.networking.k8s.io]
  resources: [httproutes]
  verbs: [get, list, watch, create, patch, delete]
- apiGroups: [monitoring.coreos.com]
  resources: [prometheusrules]
  verbs: [get, list, watch, create, patch, delete]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch]
{{- end }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "foretoken.platformName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "foretoken.clusterName" . }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
rules:
  # CRD bootstrap alone owns cluster API installation and upgrades.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [create]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames:
      - inferencedeployments.inference.foretoken.io
      - frontendservices.inference.foretoken.io
      - kvservices.inference.foretoken.io
      - kvpools.inference.foretoken.io
      - kvgroups.inference.foretoken.io
      - modelservices.inference.foretoken.io
      - runtimecaches.inference.foretoken.io
      - modelpools.inference.foretoken.io
      - modelgroups.inference.foretoken.io
      - profileruns.inference.foretoken.io
      - videotasks.inference.foretoken.io
    verbs: [get, patch]
  {{- if and .Values.observability.logs.managedStatefulSet .Values.observability.logs.maxSize }}
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "foretoken.clusterName" . }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "foretoken.clusterName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "foretoken.platformName" . }}
    namespace: {{ .Release.Namespace }}
