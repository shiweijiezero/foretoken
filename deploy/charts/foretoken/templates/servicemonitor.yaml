{{- if eq (include "foretoken.observabilityEnabled" .) "true" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "foretoken.compactName" (printf "%s-control-plane" (include "foretoken.fullname" .)) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.observabilityLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: foretoken-control-plane
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      {{- with $.Values.observability.interval }}
      interval: {{ . | quote }}
      {{- end }}
      {{- with $.Values.observability.scrapeTimeout }}
      scrapeTimeout: {{ . | quote }}
      {{- end }}
---
{{- if .Values.frontend.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "foretoken.compactName" (printf "%s-frontend" (include "foretoken.fullname" .)) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.observabilityLabels" . | nindent 4 }}
spec:
  namespaceSelector:
    any: true
  selector:
    matchExpressions:
      - key: inference.foretoken.io/frontend-service
        operator: Exists
  endpoints:
    - port: http
      path: /metrics
      {{- with $.Values.observability.interval }}
      interval: {{ . | quote }}
      {{- end }}
      {{- with $.Values.observability.scrapeTimeout }}
      scrapeTimeout: {{ . | quote }}
      {{- end }}
  targetLabels:
    - inference.foretoken.io/frontend-service
---
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "foretoken.compactName" (printf "%s-model-server" (include "foretoken.fullname" .)) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.observabilityLabels" . | nindent 4 }}
spec:
  namespaceSelector:
    any: true
  selector:
    matchExpressions:
      - key: inference.foretoken.io/model-group
        operator: Exists
  endpoints:
    - port: model-server
      path: /metrics
      {{- with $.Values.observability.interval }}
      interval: {{ . | quote }}
      {{- end }}
      {{- with $.Values.observability.scrapeTimeout }}
      scrapeTimeout: {{ . | quote }}
      {{- end }}
  targetLabels:
    - inference.foretoken.io/model-group
    - inference.foretoken.io/model-role
    - inference.foretoken.io/pd-pipeline-scope
{{- end }}
