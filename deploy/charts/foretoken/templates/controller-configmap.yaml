# Project deployment collection settings without changing the controller workload.
{{- if eq .Values.scope "deployment" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "foretoken.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
data:
  autoscaling-telemetry.json: {{ .Values.controller.autoscalingTelemetry | toJson | quote }}
  {{- if .Values.namespaceAccess.enabled }}
  namespace-access.json: {{ dict "cacheClaim" .Values.workload.cache.claimName "cacheAccessMode" .Values.namespaceAccess.cacheAccessMode "gateway" .Values.namespaceAccess.gateway | toJson | quote }}
  {{- end }}
{{- end }}
