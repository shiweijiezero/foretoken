{{/* Compile namespace-local controller settings; bootstrap publishes instance access separately. */}}
{{- define "foretoken.deploymentConfiguration" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "foretoken.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
data:
  autoscaling-telemetry.json: {{ .Values.controller.autoscalingTelemetry | toJson | quote }}
{{- end }}
