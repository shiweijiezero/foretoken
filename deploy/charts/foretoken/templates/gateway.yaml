# Creates an optional HTTP Gateway for frontend routes when a GatewayClass already exists.

{{- if and .Values.frontend.enabled (eq .Values.frontend.mode "gateway") .Values.frontend.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "foretoken.frontendGatewayName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ include "foretoken.frontendGatewayClassName" . }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
