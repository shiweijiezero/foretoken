# Existing applications retain their store when the default connection changes.
{{- $name := include "foretoken.admissionStoreName" . }}
{{- $existing := lookup "apps/v1" "StatefulSet" .Release.Namespace $name }}
{{- $metadata := get $existing "metadata" | default dict }}
{{- $annotations := get $metadata "annotations" | default dict }}
{{- $labels := get $metadata "labels" | default dict }}
{{- $owned := and (eq (get $labels "app.kubernetes.io/managed-by") .Release.Service) (eq (get $annotations "meta.helm.sh/release-name") .Release.Name) (eq (get $annotations "meta.helm.sh/release-namespace") .Release.Namespace) }}
{{- if or $owned (not (or .Values.admissionStore.externalURL .Values.admissionStore.externalURLSecret.name)) }}
{{- range $resource := list (dict "api" "v1" "kind" "Service") (dict "api" "apps/v1" "kind" "StatefulSet") (dict "api" "networking.k8s.io/v1" "kind" "NetworkPolicy") }}
{{- with lookup $resource.api $resource.kind $.Release.Namespace $name }}
{{- $meta := .metadata }}
{{- $ann := get $meta "annotations" | default dict }}
{{- $lab := get $meta "labels" | default dict }}
{{- if not (and (eq (get $lab "app.kubernetes.io/managed-by") $.Release.Service) (eq (get $ann "meta.helm.sh/release-name") $.Release.Name) (eq (get $ann "meta.helm.sh/release-namespace") $.Release.Namespace)) }}
{{- fail (printf "%s/%s is not owned by this Helm release" $resource.kind $name) }}
{{- end }}
{{- end }}
{{- end }}
{{- with lookup "v1" "PersistentVolumeClaim" .Release.Namespace (printf "ledger-%s-0" $name) }}
{{- $labels := get .metadata "labels" | default dict }}
{{- if not (and $owned (eq (get $labels "app.kubernetes.io/name") "foretoken-admission-store") (eq (get $labels "app.kubernetes.io/instance") $.Release.Name)) }}
{{- fail (printf "PersistentVolumeClaim/%s already exists without a managed admission store" .metadata.name) }}
{{- end }}
{{- $annotations := get .metadata "annotations" | default dict }}
{{- if or (and (hasKey $labels "app.kubernetes.io/managed-by") (ne (get $labels "app.kubernetes.io/managed-by") $.Release.Service)) (and (hasKey $annotations "meta.helm.sh/release-name") (ne (get $annotations "meta.helm.sh/release-name") $.Release.Name)) (and (hasKey $annotations "meta.helm.sh/release-namespace") (ne (get $annotations "meta.helm.sh/release-namespace") $.Release.Namespace)) }}
{{- fail (printf "PersistentVolumeClaim/%s belongs to another release" .metadata.name) }}
{{- end }}
{{- range .metadata.ownerReferences }}
{{- if ne .uid $metadata.uid }}
{{- fail (printf "admission store claim has another owner: %s/%s" .kind .name) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: foretoken-admission-store
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: foretoken-admission-store
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: foretoken-admission-store
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: foretoken-admission-store
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foretoken-admission-store
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ include "foretoken.imageWithRegistry" (dict "registry" .Values.global.imageRegistry "image" .Values.admissionStore.image) | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - valkey-server
            - --dir
            - /data
            - --appendonly
            - "yes"
            - --appendfsync
            - always
            - --no-appendfsync-on-rewrite
            - "no"
            - --maxmemory-policy
            - noeviction
            - --save
            - ""
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: [valkey-cli, -e, ping]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: ledger
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: ledger
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.admissionStore.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.admissionStore.storageSize | quote }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: foretoken-admission-store
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: foretoken-admission-store
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: inference.foretoken.io/frontend-service
                operator: Exists
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: inference.foretoken.io/model-group
                operator: Exists
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
