# Provides default settings for the Foretoken control-plane chart.

global:
  # Replaces the registry host for release images. Source-image installs set explicit images instead.
  imageRegistry: ""

image:
  repository: ghcr.io/shiweijiezero/foretoken/control-plane
  tag: "" # Defaults to Chart.appVersion.
  digest: "" # Overrides tag when an immutable digest is provided.
  pullPolicy: IfNotPresent

imagePullSecrets: []

controller:
  replicas: 1
  autoscalingTelemetry:
    collectionTimeout: 3s
    requestTimeout: 1s
    concurrency: 8

# Each named Secret must exist in the namespace of the FrontendService or ModelService workload.
workload:
  imagePullSecrets: []
  # Set claimName to override namespace RuntimeCache discovery with an existing PVC.
  cache:
    claimName: ""
    mountPath: /var/cache/foretoken

# Unused node-network IP addresses for services when the cluster assigns none.
# Consumed by foretoken install, which then manages MetalLB in Layer 2 mode.
loadBalancer:
  managedAddresses: []

# foretoken install automatically reuses or prepares shared RDMA device allocation.
# These values also support direct Helm installation.
rdma:
  # External shared allocation; empty lets foretoken install discover or prepare one.
  resourceName: ""
  resourceCount: 1
  managed: false
  image: ghcr.io/mellanox/k8s-rdma-shared-dev-plugin:v1.5.4
  # Selected GPU nodes, populated by foretoken install.
  nodeNames: []

# Local mode uses a LoadBalancer Service. Gateway mode attaches an HTTPRoute to a Gateway.
frontend:
  enabled: false
  mode: local
  image: ghcr.io/shiweijiezero/foretoken/frontend:0.0.3
  port: 8080
  gateway:
    # When enabled, the Chart creates an isolated GatewayClass and HTTP Gateway.
    create: false
    controllerName: gateway.envoyproxy.io/gatewayclass-controller
    name: ""
    namespace: ""
    sectionName: ""

# Native viewers start only when a report is opened through foretoken profile view.
profiling:
  nsightViewerImage: nvcr.io/nvidia/devtools/nsight-streamer-nsys:2026.3.1
  viewerProxyImage: docker.io/nginxinc/nginx-unprivileged:1.28-alpine

# Integrates Foretoken metric endpoints with an existing Prometheus Operator.
observability:
  # auto discovers the required APIs during installation; enabled supports offline rendering and GitOps.
  mode: auto
  additionalLabels: {}
  interval: 5s
  scrapeTimeout: 4s
  # Prometheus NAMESPACE/NAME; foretoken install resolves the selected instance.
  prometheus: ""
  # foretoken install manages Grafana access; omit anonymousAccess to retain its current setting.
  grafana: {}
  notifications:
    # Alertmanager namespace; empty uses the Foretoken release namespace.
    namespace: ""
    # Match the configuration selector of a reused Alertmanager when required.
    additionalLabels: {}
    slack:
      # A non-empty name enables Slack. The Secret must exist in the notification namespace.
      webhookSecret:
        name: ""
        key: url

# The runtime image must contain Foretoken model-server, its Python launcher, and a compatible vLLM runtime.
runtime:
  vllm:
    image: auto # Selects the release image for the configured GPU resource.
    # Optional source-built diagnostic image with Nsight Systems; used only by opted-in models.
    nsightImage: ""
    profileRevision: default # Mooncake P/D compatibility revision.
    modelServerPort: 9000
    # Optional Hugging Face-compatible endpoint and credential.
    modelSource:
      endpoint: ""
      tokenSecret:
        name: ""
        key: token
    gpu:
      resourceName: nvidia.com/gpu
      runtimeClassName: ""
      nodeSelector:
        key: ""
        value: ""
    # A sharedStorageClaim enables encoder transfer; the RWX PVC must exist in each model namespace.
    ec:
      profileName: "" # Defaults to shared-storage when enabled.
      profileRevision: "" # Inherits runtime.vllm.profileRevision.
      connector: "ECExampleConnector"
      sharedStorageClaim: ""
      sharedStoragePath: "/var/lib/foretoken/ec"
    # Connector settings; RDMA device allocation is shared with distributed execution.
    pd:
      protocol: rdma
      # Empty lets Mooncake select from the Pod's allocated devices by topology.
      rdmaDeviceName: ""
      bootstrapPort: 8998
      abortRequestTimeoutSeconds: 600
    # Set every field to enable the platform-owned external Mooncake Store profile.
    mooncakeStore:
      profileName: ""
      profileRevision: ""
      configMapName: ""
      configMapKey: ""
      pythonHashSeed: ""

# Resource sizing is workload- and cluster-dependent; measure before setting it.
resources: {}
