# Provides default settings for the Foretoken control-plane chart.

image:
  repository: ghcr.io/shiweijiezero/foretoken/control-plane
  tag: "" # Defaults to Chart.appVersion.
  digest: "" # Overrides tag when an immutable digest is provided.
  pullPolicy: IfNotPresent

imagePullSecrets: []

controller:
  replicas: 1
  autoscalingTelemetry:
    collectionTimeout: 3s
    requestTimeout: 1s
    concurrency: 8

# Each named Secret must exist in the namespace of the FrontendService or ModelService workload.
workload:
  imagePullSecrets: []

# Local mode uses a LoadBalancer Service. Gateway mode attaches an HTTPRoute to a Gateway.
frontend:
  enabled: false
  mode: local
  image: ghcr.io/shiweijiezero/foretoken/frontend:0.0.1
  port: 8080
  gateway:
    # When enabled, the Chart creates an isolated GatewayClass and HTTP Gateway.
    create: false
    controllerName: gateway.envoyproxy.io/gatewayclass-controller
    name: ""
    namespace: ""
    sectionName: ""

# Integrates Foretoken metric endpoints with an existing Prometheus Operator.
observability:
  serviceMonitor:
    enabled: false
    interval: ""
    scrapeTimeout: ""

# The runtime image must contain Foretoken model-server, its Python launcher, and a compatible vLLM runtime.
runtime:
  vllm:
    image: ghcr.io/shiweijiezero/foretoken/model-server:0.0.1
    profileRevision: default
    modelServerPort: 9000
    gpu:
      resourceName: nvidia.com/gpu
      runtimeClassName: ""
      nodeSelector:
        key: ""
        value: ""
    # Set every field to enable the local vLLM build source's ECExampleConnector over an existing RWX PVC.
    ec:
      profileName: ""
      profileRevision: ""
      connector: "ECExampleConnector"
      sharedStorageClaim: ""
      sharedStoragePath: "/var/lib/foretoken/ec"
    # Set every field to enable the platform-owned Mooncake P/D profile.
    pd:
      profileName: ""
      profileRevision: ""
      protocol: ""
      bootstrapPort: 0
      abortRequestTimeoutSeconds: 0
      rdmaDeviceName: ""
      rdmaResourceName: ""
      rdmaResourceCount: 0
    # Set every field to enable the platform-owned external Mooncake Store profile.
    mooncakeStore:
      profileName: ""
      profileRevision: ""
      configMapName: ""
      configMapKey: ""
      pythonHashSeed: ""

# Resource sizing is workload- and cluster-dependent; measure before setting it.
resources: {}
