# Provides default settings for the Foretoken control-plane chart.

# Required until release artifacts provide a published default.
image:
  repository: ""
  tag: ""
  digest: "" # Overrides tag when an immutable digest is provided.
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Frontend execution requires Gateway API v1 HTTPRoute CRDs and a platform-managed Gateway.
frontend:
  enabled: false
  image: ""
  port: 8080
  gateway:
    name: ""
    namespace: ""
    sectionName: ""

# Integrates Foretoken metric endpoints with an existing Prometheus Operator.
observability:
  serviceMonitor:
    enabled: false
    additionalLabels: {}
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: false
    additionalLabels: {}
  grafanaDashboard:
    enabled: false
    additionalLabels:
      grafana_dashboard: "1"
  prometheus:
    # Namespace containing the Prometheus server Pods.
    namespace: ""

# The runtime image must contain Foretoken model-server, its Python launcher, and a compatible vLLM runtime.
runtime:
  vllm:
    image: ""
    modelServerPort: 9000
    accelerator:
      type: ""
      resourceName: ""
      runtimeClassName: ""
      nodeSelector:
        key: ""
        value: ""
    # Set every field to enable the local vLLM build source's ECExampleConnector over an existing RWX PVC.
    ec:
      profileName: ""
      profileRevision: ""
      connector: "ECExampleConnector"
      sharedStorageClaim: ""
      sharedStoragePath: "/var/lib/foretoken/ec"
    # Set every field to enable the platform-owned Mooncake P/D profile.
    pd:
      profileName: ""
      profileRevision: ""
      protocol: ""
      bootstrapPort: 0
      abortRequestTimeoutSeconds: 0
      rdmaDeviceName: ""
      rdmaResourceName: ""
      rdmaResourceCount: 0
    # Set every field to enable the platform-owned external Mooncake Store profile.
    mooncakeStore:
      profileName: ""
      profileRevision: ""
      configMapName: ""
      configMapKey: ""
      pythonHashSeed: ""

# Resource sizing is workload- and cluster-dependent; measure before setting it.
resources: {}
