#
# Defines the stable, low-cardinality Prometheus query layer for Foretoken.

groups:
  - name: foretoken.recording
    rules:
      - record: foretoken:frontend_http_response_starts:rate5m
        expr: |
          sum by (namespace, frontend_service, method, handler, status) (
            label_replace(
              rate(http_requests_total{
                endpoint="http",
                inference_foretoken_io_frontend_service!=""
              }[5m]),
              "frontend_service", "$1",
              "inference_foretoken_io_frontend_service", "(.+)"
            )
          )

      # This is the HTTP response-start 5xx ratio, not an inference failure ratio.
      - record: foretoken:frontend_http_response_start_5xx_ratio:rate5m
        expr: |
          (
            sum by (namespace, frontend_service) (
              foretoken:frontend_http_response_starts:rate5m{status="5xx"}
            )
            or
            0 * sum by (namespace, frontend_service) (
              foretoken:frontend_http_response_starts:rate5m
            )
          )
          /
          sum by (namespace, frontend_service) (
            foretoken:frontend_http_response_starts:rate5m
          )
          and
          sum by (namespace, frontend_service) (
            foretoken:frontend_http_response_starts:rate5m
          ) > 0

      - record: foretoken:model_server_prompt_tokens:rate5m
        expr: |
          sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name) (
            label_replace(
              label_replace(
                label_replace(
                  rate(vllm:prompt_tokens_total{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  }[5m]),
                  "model_group", "$1",
                  "inference_foretoken_io_model_group", "(.+)"
                ),
                "model_role", "$1",
                "inference_foretoken_io_model_role", "(.+)"
              ),
              "pd_pipeline_scope", "$1",
              "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      - record: foretoken:model_server_generation_tokens:rate5m
        expr: |
          sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name) (
            label_replace(
              label_replace(
                label_replace(
                  rate(vllm:generation_tokens_total{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  }[5m]),
                  "model_group", "$1",
                  "inference_foretoken_io_model_group", "(.+)"
                ),
                "model_role", "$1",
                "inference_foretoken_io_model_role", "(.+)"
              ),
              "pd_pipeline_scope", "$1",
              "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      - record: foretoken:model_server_requests_running:sum
        expr: |
          sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name) (
            label_replace(
              label_replace(
                label_replace(
                  vllm:num_requests_running{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  },
                  "model_group", "$1",
                  "inference_foretoken_io_model_group", "(.+)"
                ),
                "model_role", "$1",
                "inference_foretoken_io_model_role", "(.+)"
              ),
              "pd_pipeline_scope", "$1",
              "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      - record: foretoken:model_server_requests_waiting:sum
        expr: |
          sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name) (
            label_replace(
              label_replace(
                label_replace(
                  vllm:num_requests_waiting{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  },
                  "model_group", "$1",
                  "inference_foretoken_io_model_group", "(.+)"
                ),
                "model_role", "$1",
                "inference_foretoken_io_model_role", "(.+)"
              ),
              "pd_pipeline_scope", "$1",
              "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      - record: foretoken:model_server_kv_cache_usage_ratio:max
        expr: |
          max by (namespace, model_group, model_role, pd_pipeline_scope, model_name) (
            label_replace(
              label_replace(
                label_replace(
                  vllm:kv_cache_usage_perc{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  },
                  "model_group", "$1",
                  "inference_foretoken_io_model_group", "(.+)"
                ),
                "model_role", "$1",
                "inference_foretoken_io_model_role", "(.+)"
              ),
              "pd_pipeline_scope", "$1",
              "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      - record: foretoken:frontend_up:sum
        expr: |
          sum by (namespace, frontend_service) (
            label_replace(
              up{
                endpoint="http",
                inference_foretoken_io_frontend_service!=""
              },
              "frontend_service", "$1",
              "inference_foretoken_io_frontend_service", "(.+)"
            )
          )

      - record: foretoken:model_server_up:sum
        expr: |
          sum by (namespace, model_group, model_role, pd_pipeline_scope) (
            label_replace(
              label_replace(
                label_replace(
                  up{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  },
                  "model_group", "$1",
                  "inference_foretoken_io_model_group", "(.+)"
                ),
                "model_role", "$1",
                "inference_foretoken_io_model_role", "(.+)"
              ),
              "pd_pipeline_scope", "$1",
              "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      # The frontend middleware observes this histogram when the handler returns. For SSE, it is response-start latency.
      - record: foretoken:frontend_http_response_start_latency_seconds:quantile5m
        expr: |
          label_replace(
            histogram_quantile(
              0.50,
              sum by (namespace, frontend_service, handler, le) (
                label_replace(
                  rate(http_request_duration_seconds_bucket{
                    endpoint="http",
                    inference_foretoken_io_frontend_service!=""
                  }[5m]),
                  "frontend_service", "$1",
                  "inference_foretoken_io_frontend_service", "(.+)"
                )
              )
            ),
            "quantile", "p50", "__name__", ".*"
          )
          or
          label_replace(
            histogram_quantile(
              0.90,
              sum by (namespace, frontend_service, handler, le) (
                label_replace(
                  rate(http_request_duration_seconds_bucket{
                    endpoint="http",
                    inference_foretoken_io_frontend_service!=""
                  }[5m]),
                  "frontend_service", "$1",
                  "inference_foretoken_io_frontend_service", "(.+)"
                )
              )
            ),
            "quantile", "p90", "__name__", ".*"
          )
          or
          label_replace(
            histogram_quantile(
              0.99,
              sum by (namespace, frontend_service, handler, le) (
                label_replace(
                  rate(http_request_duration_seconds_bucket{
                    endpoint="http",
                    inference_foretoken_io_frontend_service!=""
                  }[5m]),
                  "frontend_service", "$1",
                  "inference_foretoken_io_frontend_service", "(.+)"
                )
              )
            ),
            "quantile", "p99", "__name__", ".*"
          )

      - record: foretoken:frontend_upstream_queued_requests:sum
        expr: |
          sum by (namespace, frontend_service, target_kind, target_id) (
            label_replace(
              foretoken_upstream_queued_requests{
                endpoint="http",
                inference_foretoken_io_frontend_service!=""
              },
              "frontend_service", "$1",
              "inference_foretoken_io_frontend_service", "(.+)"
            )
          )

      - record: foretoken:frontend_kv_index_source_health_ratio:min
        expr: |
          min by (namespace, frontend_service) (
            label_replace(
              (
                foretoken_kv_index_sources_healthy{
                  endpoint="http",
                  inference_foretoken_io_frontend_service!=""
                }
                /
                clamp_min(
                  foretoken_kv_index_sources_total{
                    endpoint="http",
                    inference_foretoken_io_frontend_service!=""
                  },
                  1
                )
              )
              *
              foretoken_kv_index_enabled{
                endpoint="http",
                inference_foretoken_io_frontend_service!=""
              },
              "frontend_service", "$1",
              "inference_foretoken_io_frontend_service", "(.+)"
            )
          )

      - record: foretoken:model_server_completed_requests:rate5m
        expr: |
          sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, finished_reason) (
            label_replace(
              label_replace(
                label_replace(
                  rate(vllm:request_success_total{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  }[5m]),
                  "model_group", "$1",
                  "inference_foretoken_io_model_group", "(.+)"
                ),
                "model_role", "$1",
                "inference_foretoken_io_model_role", "(.+)"
              ),
              "pd_pipeline_scope", "$1",
              "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      - record: foretoken:model_server_e2e_request_latency_seconds:quantile5m
        expr: |
          label_replace(
            histogram_quantile(
              0.50,
              sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, le) (
                label_replace(label_replace(label_replace(
                  rate(vllm:e2e_request_latency_seconds_bucket{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  }[5m]),
                  "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
                ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
                ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
                )
              )
            ),
            "quantile", "p50", "__name__", ".*"
          )
          or
          label_replace(
            histogram_quantile(
              0.90,
              sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, le) (
                label_replace(label_replace(label_replace(
                  rate(vllm:e2e_request_latency_seconds_bucket{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  }[5m]),
                  "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
                ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
                ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
                )
              )
            ),
            "quantile", "p90", "__name__", ".*"
          )
          or
          label_replace(
            histogram_quantile(
              0.99,
              sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, le) (
                label_replace(label_replace(label_replace(
                  rate(vllm:e2e_request_latency_seconds_bucket{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  }[5m]),
                  "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
                ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
                ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
                )
              )
            ),
            "quantile", "p99", "__name__", ".*"
          )

      - record: foretoken:model_server_time_to_first_token_seconds:quantile5m
        expr: |
          label_replace(
            histogram_quantile(
              0.50,
              sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, le) (
                label_replace(label_replace(label_replace(
                  rate(vllm:time_to_first_token_seconds_bucket{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  }[5m]),
                  "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
                ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
                ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
                )
              )
            ),
            "quantile", "p50", "__name__", ".*"
          )
          or
          label_replace(
            histogram_quantile(
              0.90,
              sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, le) (
                label_replace(label_replace(label_replace(
                  rate(vllm:time_to_first_token_seconds_bucket{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  }[5m]),
                  "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
                ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
                ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
                )
              )
            ),
            "quantile", "p90", "__name__", ".*"
          )
          or
          label_replace(
            histogram_quantile(
              0.99,
              sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, le) (
                label_replace(label_replace(label_replace(
                  rate(vllm:time_to_first_token_seconds_bucket{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  }[5m]),
                  "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
                ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
                ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
                )
              )
            ),
            "quantile", "p99", "__name__", ".*"
          )

      - record: foretoken:model_server_time_per_output_token_seconds:quantile5m
        expr: |
          label_replace(
            histogram_quantile(
              0.50,
              sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, le) (
                label_replace(label_replace(label_replace(
                  rate(vllm:request_time_per_output_token_seconds_bucket{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  }[5m]),
                  "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
                ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
                ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
                )
              )
            ),
            "quantile", "p50", "__name__", ".*"
          )
          or
          label_replace(
            histogram_quantile(
              0.90,
              sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, le) (
                label_replace(label_replace(label_replace(
                  rate(vllm:request_time_per_output_token_seconds_bucket{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  }[5m]),
                  "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
                ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
                ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
                )
              )
            ),
            "quantile", "p90", "__name__", ".*"
          )
          or
          label_replace(
            histogram_quantile(
              0.99,
              sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, le) (
                label_replace(label_replace(label_replace(
                  rate(vllm:request_time_per_output_token_seconds_bucket{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  }[5m]),
                  "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
                ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
                ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
                )
              )
            ),
            "quantile", "p99", "__name__", ".*"
          )

      # Time a request spends waiting, in prefill, and in decode, as normalized histogram
      # buckets. The quantile rule below derives from these buckets.
      - record: foretoken:model_server_request_stage_time_seconds_bucket:rate5m
        expr: |
          sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, stage, le) (
            label_replace(
              label_replace(label_replace(label_replace(
                rate(vllm:request_queue_time_seconds_bucket{
                  endpoint="model-server",
                  inference_foretoken_io_model_group!="",
                  inference_foretoken_io_model_role!=""
                }[5m]),
                "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
              ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
              ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
              ),
              "stage", "queue", "__name__", ".*"
            )
            or
            label_replace(
              label_replace(label_replace(label_replace(
                rate(vllm:request_prefill_time_seconds_bucket{
                  endpoint="model-server",
                  inference_foretoken_io_model_group!="",
                  inference_foretoken_io_model_role!=""
                }[5m]),
                "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
              ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
              ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
              ),
              "stage", "prefill", "__name__", ".*"
            )
            or
            label_replace(
              label_replace(label_replace(label_replace(
                rate(vllm:request_decode_time_seconds_bucket{
                  endpoint="model-server",
                  inference_foretoken_io_model_group!="",
                  inference_foretoken_io_model_role!=""
                }[5m]),
                "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
              ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
              ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
              ),
              "stage", "decode", "__name__", ".*"
            )
          )

      - record: foretoken:model_server_request_stage_time_seconds:quantile5m
        expr: |
          label_replace(
            histogram_quantile(0.50, sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, stage, le) (
              foretoken:model_server_request_stage_time_seconds_bucket:rate5m
            )),
            "quantile", "p50", "__name__", ".*"
          )
          or
          label_replace(
            histogram_quantile(0.90, sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, stage, le) (
              foretoken:model_server_request_stage_time_seconds_bucket:rate5m
            )),
            "quantile", "p90", "__name__", ".*"
          )
          or
          label_replace(
            histogram_quantile(0.99, sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, stage, le) (
              foretoken:model_server_request_stage_time_seconds_bucket:rate5m
            )),
            "quantile", "p99", "__name__", ".*"
          )

      - record: foretoken:model_server_inter_token_latency_seconds_bucket:rate5m
        expr: |
          sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, le) (
            label_replace(label_replace(label_replace(
              rate(vllm:inter_token_latency_seconds_bucket{
                endpoint="model-server",
                inference_foretoken_io_model_group!="",
                inference_foretoken_io_model_role!=""
              }[5m]),
              "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
            ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
            ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      - record: foretoken:model_server_inter_token_latency_seconds:quantile5m
        expr: |
          label_replace(
            histogram_quantile(0.50, sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, le) (
              foretoken:model_server_inter_token_latency_seconds_bucket:rate5m
            )),
            "quantile", "p50", "__name__", ".*"
          )
          or
          label_replace(
            histogram_quantile(0.90, sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, le) (
              foretoken:model_server_inter_token_latency_seconds_bucket:rate5m
            )),
            "quantile", "p90", "__name__", ".*"
          )
          or
          label_replace(
            histogram_quantile(0.99, sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, le) (
              foretoken:model_server_inter_token_latency_seconds_bucket:rate5m
            )),
            "quantile", "p99", "__name__", ".*"
          )

      - record: foretoken:model_server_preemptions:rate5m
        expr: |
          sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name) (
            label_replace(label_replace(label_replace(
              rate(vllm:num_preemptions_total{
                endpoint="model-server",
                inference_foretoken_io_model_group!="",
                inference_foretoken_io_model_role!=""
              }[5m]),
              "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
            ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
            ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      # Request length distributions keep the histogram buckets for heatmap panels.
      - record: foretoken:model_server_request_prompt_tokens_bucket:rate5m
        expr: |
          sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, le) (
            label_replace(label_replace(label_replace(
              rate(vllm:request_prompt_tokens_bucket{
                endpoint="model-server",
                inference_foretoken_io_model_group!="",
                inference_foretoken_io_model_role!=""
              }[5m]),
              "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
            ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
            ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      - record: foretoken:model_server_request_generation_tokens_bucket:rate5m
        expr: |
          sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name, le) (
            label_replace(label_replace(label_replace(
              rate(vllm:request_generation_tokens_bucket{
                endpoint="model-server",
                inference_foretoken_io_model_group!="",
                inference_foretoken_io_model_role!=""
              }[5m]),
              "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
            ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
            ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      - record: foretoken:model_server_prefix_cache_hit_ratio:rate5m
        expr: |
          label_replace(
            sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name) (
              label_replace(label_replace(label_replace(
                rate(vllm:prefix_cache_hits_total{
                  endpoint="model-server",
