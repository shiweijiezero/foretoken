#
# Defines the stable, low-cardinality Prometheus query layer for Foretoken.

groups:
  - name: foretoken.recording
    rules:
      - record: foretoken:frontend_http_response_starts:rate5m
        expr: |
          sum by (namespace, frontend_service, method, handler, status) (
            label_replace(
              rate(http_requests_total{
                endpoint="http",
                inference_foretoken_io_frontend_service!=""
              }[5m]),
              "frontend_service", "$1",
              "inference_foretoken_io_frontend_service", "(.+)"
            )
          )

      # This is the HTTP response-start 5xx ratio, not an inference failure ratio.
      - record: foretoken:frontend_http_response_start_5xx_ratio:rate5m
        expr: |
          (
            sum by (namespace, frontend_service) (
              foretoken:frontend_http_response_starts:rate5m{status="5xx"}
            )
            or
            0 * sum by (namespace, frontend_service) (
              foretoken:frontend_http_response_starts:rate5m
            )
          )
          /
          sum by (namespace, frontend_service) (
            foretoken:frontend_http_response_starts:rate5m
          )
          and
          sum by (namespace, frontend_service) (
            foretoken:frontend_http_response_starts:rate5m
          ) > 0

      # Service-owned identity remains available even when the engine scrape fails.
      - record: foretoken:model_instance_info
        expr: |
          max by (namespace, model_group, model_name, modelservice, model_pool, model_instance, model_instance_created_at) (
            label_replace(
              label_replace(
                0 * up{endpoint="model-server", inference_foretoken_io_model_group!="", modelservice!="", served_model!=""} + 1,
                "model_name", "$1", "served_model", "(.+)"
              ),
              "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
            )
          )

      - record: foretoken:model_server_prompt_tokens:rate5m
        expr: |
          sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name) (
            label_replace(
              label_replace(
                label_replace(
                  rate(vllm:prompt_tokens_total{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  }[5m]),
                  "model_group", "$1",
                  "inference_foretoken_io_model_group", "(.+)"
                ),
                "model_role", "$1",
                "inference_foretoken_io_model_role", "(.+)"
              ),
              "pd_pipeline_scope", "$1",
              "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      - record: foretoken:model_server_generation_tokens:rate5m
        expr: |
          sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name) (
            label_replace(
              label_replace(
                label_replace(
                  rate(vllm:generation_tokens_total{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  }[5m]),
                  "model_group", "$1",
                  "inference_foretoken_io_model_group", "(.+)"
                ),
                "model_role", "$1",
                "inference_foretoken_io_model_role", "(.+)"
              ),
              "pd_pipeline_scope", "$1",
              "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      - record: foretoken:model_server_requests_running:sum
        expr: |
          sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name) (
            label_replace(
              label_replace(
                label_replace(
                  vllm:num_requests_running{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  },
                  "model_group", "$1",
                  "inference_foretoken_io_model_group", "(.+)"
                ),
                "model_role", "$1",
                "inference_foretoken_io_model_role", "(.+)"
              ),
              "pd_pipeline_scope", "$1",
              "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      - record: foretoken:model_server_requests_waiting:sum
        expr: |
          sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name) (
            label_replace(
              label_replace(
                label_replace(
                  vllm:num_requests_waiting{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  },
                  "model_group", "$1",
                  "inference_foretoken_io_model_group", "(.+)"
                ),
                "model_role", "$1",
                "inference_foretoken_io_model_role", "(.+)"
              ),
              "pd_pipeline_scope", "$1",
              "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      - record: foretoken:model_server_kv_cache_usage_ratio:max
        expr: |
          max by (namespace, model_group, model_role, pd_pipeline_scope, model_name) (
            label_replace(
              label_replace(
                label_replace(
                  vllm:kv_cache_usage_perc{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  },
                  "model_group", "$1",
                  "inference_foretoken_io_model_group", "(.+)"
                ),
                "model_role", "$1",
                "inference_foretoken_io_model_role", "(.+)"
              ),
              "pd_pipeline_scope", "$1",
              "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      # These are sums of paired GPU stage observations, not elapsed wall time.
      - record: foretoken:model_server_spec_decode_draft_seconds:rate5m
        expr: |
          sum by (namespace, modelservice, model_group, model_role, model_name, engine) (
            label_replace(
              label_replace(
                rate(vllm:spec_decode_draft_duration_seconds_sum{
                  endpoint="model-server",
                  inference_foretoken_io_model_group!="",
                  inference_foretoken_io_model_role=~"aggregate|decode"
                }[5m]),
                "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
              ),
              "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
            )
          )

      - record: foretoken:model_server_spec_decode_target_forward_seconds:rate5m
        expr: |
          sum by (namespace, modelservice, model_group, model_role, model_name, engine) (
            label_replace(
              label_replace(
                rate(vllm:spec_decode_target_forward_duration_seconds_sum{
                  endpoint="model-server",
                  inference_foretoken_io_model_group!="",
                  inference_foretoken_io_model_role=~"aggregate|decode"
                }[5m]),
                "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
              ),
              "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
            )
          )

      - record: foretoken:frontend_up:sum
        expr: |
          sum by (namespace, frontend_service) (
            label_replace(
              up{
                endpoint="http",
                inference_foretoken_io_frontend_service!=""
              },
              "frontend_service", "$1",
              "inference_foretoken_io_frontend_service", "(.+)"
            )
          )

      - record: foretoken:model_server_up:sum
        expr: |
          sum by (namespace, model_group, model_role, pd_pipeline_scope) (
            label_replace(
              label_replace(
                label_replace(
                  up{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  },
                  "model_group", "$1",
                  "inference_foretoken_io_model_group", "(.+)"
                ),
                "model_role", "$1",
                "inference_foretoken_io_model_role", "(.+)"
              ),
              "pd_pipeline_scope", "$1",
              "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      - record: foretoken:frontend_upstream_queued_requests:sum
        expr: |
          sum by (namespace, frontend_service, target_kind, target_id) (
            label_replace(
              foretoken_upstream_queued_requests{
                endpoint="http",
                inference_foretoken_io_frontend_service!=""
              },
              "frontend_service", "$1",
              "inference_foretoken_io_frontend_service", "(.+)"
            )
          )

      - record: foretoken:frontend_kv_index_source_health_ratio:min
        expr: |
          min by (namespace, frontend_service) (
            label_replace(
              (
                foretoken_kv_index_sources_healthy{
                  endpoint="http",
                  inference_foretoken_io_frontend_service!=""
                }
                /
                (
                  foretoken_kv_index_sources_total{
                    endpoint="http",
                    inference_foretoken_io_frontend_service!=""
                  } > 0
                )
              )
              and
              (foretoken_kv_index_enabled{
                endpoint="http",
                inference_foretoken_io_frontend_service!=""
              } == 1),
              "frontend_service", "$1",
              "inference_foretoken_io_frontend_service", "(.+)"
            )
          )

      - record: foretoken:model_server_prefix_cache_hit_ratio:rate5m
        expr: |
          label_replace(
            sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name) (
              label_replace(label_replace(label_replace(
                rate(vllm:prefix_cache_hits_total{
                  endpoint="model-server",
                  inference_foretoken_io_model_group!="",
                  inference_foretoken_io_model_role!=""
                }[5m]),
                "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
              ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
              ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
              )
            )
            /
            (
              sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name) (
                label_replace(label_replace(label_replace(
                  rate(vllm:prefix_cache_queries_total{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  }[5m]),
                  "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
                ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
                ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
                )
              ) > 0
            ),
            "cache", "local", "__name__", ".*"
          )
          or
          label_replace(
            sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name) (
              label_replace(label_replace(label_replace(
                rate(vllm:external_prefix_cache_hits_total{
                  endpoint="model-server",
                  inference_foretoken_io_model_group!="",
                  inference_foretoken_io_model_role!=""
                }[5m]),
                "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
              ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
              ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
              )
            )
            /
            (
              sum by (namespace, model_group, model_role, pd_pipeline_scope, model_name) (
                label_replace(label_replace(label_replace(
                  rate(vllm:external_prefix_cache_queries_total{
                    endpoint="model-server",
                    inference_foretoken_io_model_group!="",
                    inference_foretoken_io_model_role!=""
                  }[5m]),
                  "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
                ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
                ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
                )
              ) > 0
            ),
            "cache", "external", "__name__", ".*"
          )

      - record: foretoken:model_server_runtime_cache_available_bytes:min
        expr: |
          min by (namespace, model_group, model_role, pd_pipeline_scope) (
            label_replace(label_replace(label_replace(
              foretoken_runtime_cache_available_bytes{
                endpoint="model-server",
                inference_foretoken_io_model_group!="",
                inference_foretoken_io_model_role!=""
              },
              "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
            ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
            ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      - record: foretoken:model_server_runtime_cache_usage_ratio:max
        expr: |
          max by (namespace, model_group, model_role, pd_pipeline_scope) (
            label_replace(label_replace(label_replace(
              1 - (
                foretoken_runtime_cache_available_bytes{
                  endpoint="model-server",
                  inference_foretoken_io_model_group!="",
                  inference_foretoken_io_model_role!=""
                }
                /
                foretoken_runtime_cache_capacity_bytes{
                  endpoint="model-server",
                  inference_foretoken_io_model_group!="",
                  inference_foretoken_io_model_role!=""
                }
              ),
              "model_group", "$1", "inference_foretoken_io_model_group", "(.+)"
            ), "model_role", "$1", "inference_foretoken_io_model_role", "(.+)"
            ), "pd_pipeline_scope", "$1", "inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

  - name: foretoken.accelerator-recording
    interval: 5s
    rules:
      # kube-state-metrics is the source of Foretoken workload identity. Exporters
      # report only the Pod allocated to each physical device. Aggregate duplicate
      # KSM replicas by UID and select the most recently observed same-name Pod.
      - record: foretoken:accelerator_workload_labels
        expr: |
          max by (namespace, pod, uid, model_group, model_role, pd_pipeline_scope, node) (
            label_replace(label_replace(label_replace(
              max by (
                namespace,
                pod,
                uid,
                label_inference_foretoken_io_model_group,
                label_inference_foretoken_io_model_role,
                label_inference_foretoken_io_pd_pipeline_scope
              ) (
                kube_pod_labels{
                  label_inference_foretoken_io_model_group!="",
                  label_inference_foretoken_io_model_role!=""
                }
              )
              * on (namespace, pod, uid) group_left(node)
                (
                  topk by (namespace, pod) (
                    1,
                    max by (namespace, pod, uid, node) (
                      timestamp(kube_pod_info)
                    )
                  ) >= bool 0
                ),
              "model_group", "$1", "label_inference_foretoken_io_model_group", "(.+)"
            ), "model_role", "$1", "label_inference_foretoken_io_model_role", "(.+)"
            ), "pd_pipeline_scope", "$1", "label_inference_foretoken_io_pd_pipeline_scope", "(.+)"
            )
          )

      # Prometheus preserves conflicting workload labels as exported_*; with
      # honorLabels they remain plain. label_replace supports both before the join.
      - record: foretoken:accelerator_gpu_utilization_ratio
        expr: |
          max by (namespace, pod, container, model_group, model_role, pd_pipeline_scope, vendor, node, device_id) (
            (
              label_replace(label_replace(label_replace(label_replace(label_replace(
                DCGM_FI_DEV_GPU_UTIL / 100,
                "namespace", "$1", "exported_namespace", "(.+)"
              ), "pod", "$1", "exported_pod", "(.+)"
              ), "container", "$1", "exported_container", "(.+)"
              ), "vendor", "nvidia", "__name__", ".*"
              ), "device_id", "$1", "UUID", "(.+)"
              )
              or
              label_replace(label_replace(label_replace(label_replace(label_replace(
                mx_gpu_usage / 100,
                "namespace", "$1", "exported_namespace", "(.+)"
              ), "pod", "$1", "exported_pod", "(.+)"
              ), "container", "$1", "exported_container", "(.+)"
              ), "vendor", "metax", "__name__", ".*"
              ), "device_id", "$1", "uuid", "(.+)"
              )
            )
            * on (namespace, pod)
              group_left(uid, model_group, model_role, pd_pipeline_scope, node)
              foretoken:accelerator_workload_labels
          )

      - record: foretoken:accelerator_gpu_memory_usage_ratio
        expr: |
          max by (namespace, pod, container, model_group, model_role, pd_pipeline_scope, vendor, node, device_id) (
            (
              label_replace(label_replace(label_replace(label_replace(label_replace(
                (
                  DCGM_FI_DEV_FB_USED
                  /
                  ((DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) > 0)
                ),
                "namespace", "$1", "exported_namespace", "(.+)"
              ), "pod", "$1", "exported_pod", "(.+)"
              ), "container", "$1", "exported_container", "(.+)"
              ), "vendor", "nvidia", "__name__", ".*"
              ), "device_id", "$1", "UUID", "(.+)"
              )
              or
              label_replace(label_replace(label_replace(label_replace(label_replace(
                mx_memory_usage{type="vram"} / 100,
                "namespace", "$1", "exported_namespace", "(.+)"
              ), "pod", "$1", "exported_pod", "(.+)"
              ), "container", "$1", "exported_container", "(.+)"
              ), "vendor", "metax", "__name__", ".*"
              ), "device_id", "$1", "uuid", "(.+)"
              )
            )
            * on (namespace, pod)
              group_left(uid, model_group, model_role, pd_pipeline_scope, node)
              foretoken:accelerator_workload_labels
          )

      # Normalize vendor-specific power and temperature metrics. MetaX board power is
      # exported in milliwatts; its hotspot temperature is reported in Celsius.
      - record: foretoken:accelerator_gpu_power_watts
        expr: |
          max by (namespace, pod, container, model_group, model_role, pd_pipeline_scope, vendor, node, device_id) (
            (
              label_replace(label_replace(label_replace(label_replace(label_replace(
                DCGM_FI_DEV_POWER_USAGE,
                "namespace", "$1", "exported_namespace", "(.+)"
              ), "pod", "$1", "exported_pod", "(.+)"
              ), "container", "$1", "exported_container", "(.+)"
              ), "vendor", "nvidia", "__name__", ".*"
              ), "device_id", "$1", "UUID", "(.+)"
              )
              or
              label_replace(label_replace(label_replace(label_replace(label_replace(
                mx_board_power / 1000,
                "namespace", "$1", "exported_namespace", "(.+)"
              ), "pod", "$1", "exported_pod", "(.+)"
              ), "container", "$1", "exported_container", "(.+)"
              ), "vendor", "metax", "__name__", ".*"
              ), "device_id", "$1", "uuid", "(.+)"
              )
            )
            * on (namespace, pod)
              group_left(uid, model_group, model_role, pd_pipeline_scope, node)
              foretoken:accelerator_workload_labels
          )

      - record: foretoken:accelerator_gpu_temperature_celsius
        expr: |
          max by (namespace, pod, container, model_group, model_role, pd_pipeline_scope, vendor, node, device_id) (
            (
              label_replace(label_replace(label_replace(label_replace(label_replace(
                DCGM_FI_DEV_GPU_TEMP,
                "namespace", "$1", "exported_namespace", "(.+)"
              ), "pod", "$1", "exported_pod", "(.+)"
              ), "container", "$1", "exported_container", "(.+)"
              ), "vendor", "nvidia", "__name__", ".*"
              ), "device_id", "$1", "UUID", "(.+)"
              )
              or
              label_replace(label_replace(label_replace(label_replace(label_replace(
                mx_chip_hotspot_temp,
                "namespace", "$1", "exported_namespace", "(.+)"
              ), "pod", "$1", "exported_pod", "(.+)"
              ), "container", "$1", "exported_container", "(.+)"
              ), "vendor", "metax", "__name__", ".*"
              ), "device_id", "$1", "uuid", "(.+)"
              )
            )
            * on (namespace, pod)
              group_left(uid, model_group, model_role, pd_pipeline_scope, node)
              foretoken:accelerator_workload_labels
          )
