[package]
name = "foretoken-model-server"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "Model-server process that executes tokenized requests (mock for now)"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
foretoken-model-protocol = { path = "../model-protocol" }
futures = "0.3"
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Make targets select a compatible repository-relative source or FORETOKEN_VLLM_SOURCE.
vllm-llm = { path = "../../third_party/vllm-rust/source/rust/src/llm" }
