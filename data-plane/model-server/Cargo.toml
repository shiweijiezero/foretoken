# Builds the group-local typed HTTP model server and its vLLM adapter.

[package]
name = "foretoken-model-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Group-local managed EngineCore and typed streaming API"

[features]
default = ["backend-vllm"]
backend-vllm = [
    "dep:vllm-engine-core-client",
    "dep:vllm-llm",
    "dep:vllm-managed-engine",
    "dep:vllm-metrics",
    "dep:vllm-tracing",
]
backend-sglang = ["dep:reqwest", "dep:tracing-subscriber"]

[dependencies]
async-stream.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
foretoken-model-protocol.workspace = true
futures.workspace = true
rmp-serde.workspace = true
rmpv.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
uuid.workspace = true
zeromq.workspace = true
vllm-engine-core-client = { workspace = true, optional = true }
vllm-llm = { workspace = true, optional = true }
vllm-managed-engine = { workspace = true, optional = true }
vllm-metrics = { workspace = true, optional = true }
vllm-tracing = { workspace = true, optional = true }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
