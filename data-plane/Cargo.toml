[workspace]
resolver = "3"
members = [
    "frontend/src/kv-indexer",
    "frontend/src/router",
    "model-protocol",
]
exclude = ["third_party/vllm"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
arc-swap = "1.9.0"
async-stream = "0.3.6"
async-trait = "0.1.89"
axum = "0.8.8"
foretoken-model-protocol = { path = "model-protocol" }
futures = "0.3.31"
hf-hub = { version = "0.5.0", default-features = false, features = ["tokio"] }
inventory = "0.3.20"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.18.1", features = ["v4"] }

vllm-chat = { path = "third_party/vllm/rust/src/chat" }
vllm-engine-core-client = { path = "third_party/vllm/rust/src/engine-core-client" }
vllm-llm = { path = "third_party/vllm/rust/src/llm" }
vllm-metrics = { path = "third_party/vllm/rust/src/metrics" }
vllm-parser = { path = "third_party/vllm/rust/src/parser" }
vllm-text = { path = "third_party/vllm/rust/src/text" }
vllm-tokenizer = { path = "third_party/vllm/rust/src/tokenizer" }
vllm-tracing = { path = "third_party/vllm/rust/src/tracing" }
