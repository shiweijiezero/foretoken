<text x="522" y="751" font-size="23" font-weight="600" fill="#253042" text-anchor="start">RegisteredTensor</text>
<text x="522" y="782" font-size="20" font-weight="400" fill="#647184" text-anchor="start">注册缓冲区池 · CUDA event</text>
<text x="522" y="810" font-size="20" font-weight="400" fill="#647184" text-anchor="start">读取完成 ACK · 消费完成后复用</text>
<rect x="502" y="862" width="402" height="91" rx="15" fill="#ffffff" stroke="#ced8e5" stroke-width="1.5"/>
<text x="522" y="895" font-size="22" font-weight="600" fill="#253042" text-anchor="start">Frontend 不搬运概率张量</text>
<text x="522" y="926" font-size="20" font-weight="400" fill="#647184" text-anchor="start">两边 KV 独立；当前不传输 KV</text>
