<text x="522" y="493" font-size="20" font-weight="400" fill="#647184" text-anchor="start">会话 / 轮次 · 候选 token IDs</text>
<text x="522" y="521" font-size="20" font-weight="400" fill="#647184" text-anchor="start">张量描述符 · 确认 delta / 取消</text>
