<text x="522" y="637" font-size="20" font-weight="400" fill="#647184" text-anchor="start">Worker ↔ Worker，跨机 RDMA</text>
<text x="522" y="665" font-size="20" font-weight="400" fill="#647184" text-anchor="start">实际载荷：GPU log(q) [K, V]</text>
