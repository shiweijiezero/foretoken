<text x="64" y="1028" font-size="25" font-weight="600" fill="#253042" text-anchor="start">交付边界：Foretoken DT 插件 + 独立 vLLM 引擎扩展版本</text>
<text x="64" y="1059" font-size="20" font-weight="400" fill="#647184" text-anchor="start">插件接入原生 worker_extension_cls；vLLM 扩展提供外部候选准入和 MRV2 GPU I/O，不在安装时打补丁。</text>
<path d="M1428 191 H1878" stroke="#bd151b" stroke-width="3"/>
<text x="1440" y="231" font-size="25" font-weight="700" fill="#253042" text-anchor="start">Frontend｜跨角色编排</text>
<text x="1440" y="267" font-size="21" font-weight="400" fill="#647184" text-anchor="start">为请求绑定一个 Draft 和一个 Target。</text>
<text x="1440" y="297" font-size="21" font-weight="400" fill="#647184" text-anchor="start">控制每轮先后关系与会话生命周期；</text>
<text x="1440" y="327" font-size="21" font-weight="400" fill="#647184" text-anchor="start">本地 batch 仍由各自引擎调度。</text>
<path d="M1428 387 H1878" stroke="#bd151b" stroke-width="3"/>
<text x="1440" y="427" font-size="25" font-weight="700" fill="#253042" text-anchor="start">Draft / Target｜各自运行模型</text>
<text x="1440" y="463" font-size="21" font-weight="400" fill="#647184" text-anchor="start">两边都有 Scheduler、Worker 和 KV。</text>
<text x="1440" y="493" font-size="21" font-weight="400" fill="#647184" text-anchor="start">Draft 产生候选及完整提议分布 q；</text>
<text x="1440" y="523" font-size="21" font-weight="400" fill="#647184" text-anchor="start">Target 验证并决定最终输出。</text>
<path d="M1428 583 H1878" stroke="#bd151b" stroke-width="3"/>
<text x="1440" y="623" font-size="25" font-weight="700" fill="#253042" text-anchor="start">Connector｜跨机数据通道</text>
<text x="1440" y="659" font-size="21" font-weight="400" fill="#647184" text-anchor="start">小消息经 HTTP；GPU 张量经 RDMA。</text>
<text x="1440" y="689" font-size="21" font-weight="400" fill="#647184" text-anchor="start">接收就绪后才让候选进入验证；</text>
<text x="1440" y="719" font-size="21" font-weight="400" fill="#647184" text-anchor="start">网络等待不阻塞其他就绪请求。</text>
<path d="M1428 779 H1878" stroke="#bd151b" stroke-width="3"/>
<text x="1440" y="819" font-size="25" font-weight="700" fill="#253042" text-anchor="start">vLLM 扩展｜通用引擎接口</text>
<text x="1440" y="855" font-size="21" font-weight="400" fill="#647184" text-anchor="start">EngineCore 管理调度执行循环；</text>
<text x="1440" y="885" font-size="21" font-weight="400" fill="#647184" text-anchor="start">MRV2 是 Worker 中的 ModelRunner。</text>
<text x="1440" y="915" font-size="21" font-weight="400" fill="#647184" text-anchor="start">两者属于不同层级，并非同一组件。</text>
<rect x="44" y="1151" width="28" height="24" rx="4" fill="#eaf3ff" stroke="#ced8e5" stroke-width="1.5"/>
<text x="86" y="1172" font-size="21" font-weight="400" fill="#253042" text-anchor="start">复用现有组件</text>
