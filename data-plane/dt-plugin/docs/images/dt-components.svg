<text x="406" y="1172" font-size="21" font-weight="400" fill="#253042" text-anchor="start">Foretoken 新增 DT 组件</text>
<rect x="790" y="1151" width="28" height="24" rx="4" fill="#fff4d9" stroke="#ced8e5" stroke-width="1.5"/>
<text x="832" y="1172" font-size="21" font-weight="400" fill="#253042" text-anchor="start">独立 vLLM 扩展 / 接入点</text>
<text x="1440" y="1153" font-size="19" font-weight="400" fill="#647184" text-anchor="start">范围：文本、线性候选、每角色单 Worker</text>
<text x="1440" y="1185" font-size="19" font-weight="400" fill="#647184" text-anchor="start">多 Draft 协作 / tree / PD 组合尚未实现</text>
