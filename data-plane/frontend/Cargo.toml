[workspace]
resolver = "3"
members = [
    "src/chat",
    "src/cmd",
    "src/server",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
axum = "0.8.8"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3.31"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"

# vLLM Rust crates resolved through the local source symlink
# (see scripts/select-vllm-source.sh and FORETOKEN_VLLM_SOURCE).
vllm-chat = { path = "../../third_party/vllm-rust/source/rust/src/chat" }
vllm-engine-core-client = { path = "../../third_party/vllm-rust/source/rust/src/engine-core-client" }
vllm-llm = { path = "../../third_party/vllm-rust/source/rust/src/llm" }
vllm-metrics = { path = "../../third_party/vllm-rust/source/rust/src/metrics" }
vllm-parser = { path = "../../third_party/vllm-rust/source/rust/src/parser" }
vllm-text = { path = "../../third_party/vllm-rust/source/rust/src/text" }
vllm-tokenizer = { path = "../../third_party/vllm-rust/source/rust/src/tokenizer" }
vllm-tracing = { path = "../../third_party/vllm-rust/source/rust/src/tracing" }
