[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foretoken-benchmarks"
version = "0.1.0"
description = "Foretoken evaluation: performance benchmarks, parameter sweeps, correctness, and SLO analysis"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Foretoken contributors" }]
keywords = ["llm", "benchmark", "inference", "openai", "foretoken"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiohttp>=3.9",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "tqdm>=4.65",
    "typer>=0.12",
]

[project.optional-dependencies]
evalscope = [
    "evalscope",
]
vllm = [
    "pandas>=2.0",
    "seaborn>=0.13",
    "vllm",
]
wandb = [
    "evalscope",
    "wandb",
]
all = [
    "foretoken-benchmarks[evalscope,vllm,wandb]",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
foretoken = "benchmarks.main:app"

[project.urls]
Homepage = "https://github.com/shiweijiezero/foretoken"
Repository = "https://github.com/shiweijiezero/foretoken"

[tool.setuptools]
packages = [
    "benchmarks",
    "benchmarks.analyzer",
    "benchmarks.client",
    "benchmarks.deps",
    "benchmarks.metrics",
    "benchmarks.modes",
    "benchmarks.report",
    "benchmarks.runner",
    "benchmarks.storage",
    "benchmarks.sweep",
    "benchmarks.workload",
]

[tool.setuptools.package-dir]
benchmarks = "."
