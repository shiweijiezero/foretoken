[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foretoken-benchmarks"
version = "0.1.0"
description = "Foretoken evaluation: performance benchmarks"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Foretoken contributors" }]
dependencies = [
    "httpx>=0.27",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "openai>=1.40",
    "tqdm>=4.65",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
foretoken = "benchmarks.main:main"

[tool.setuptools]
packages = [
    "benchmarks",
    "benchmarks.client",
    "benchmarks.metrics",
    "benchmarks.report",
    "benchmarks.runner",
    "benchmarks.storage",
    "benchmarks.workload",
]

[tool.setuptools.package-dir]
benchmarks = "."
