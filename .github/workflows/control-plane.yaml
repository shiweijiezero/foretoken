#
# Verifies the control plane, generated files, image, and Helm lifecycle.

name: Control plane

on:
  pull_request:
    paths:
      - control-plane/**
      - deploy/charts/foretoken/**
      - deploy/observability/**
      - observability/**
      - docs/accelerator-observability*.md
      - docs/accelerators/**
      - deploy/platform-values.example.yaml
      - .dockerignore
      - LICENSE
      - .github/workflows/control-plane.yaml
  push:
    branches:
      - main
    paths:
      - control-plane/**
      - deploy/charts/foretoken/**
      - deploy/observability/**
      - observability/**
      - docs/accelerator-observability*.md
      - docs/accelerators/**
      - deploy/platform-values.example.yaml
      - .dockerignore
      - LICENSE
      - .github/workflows/control-plane.yaml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Verify control plane
        run: make -C control-plane verify
      - name: Validate operator image
        run: docker build -f control-plane/Dockerfile -t foretoken-control-plane:test .
      - name: Create test cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          cluster_name: foretoken
      - name: Validate Helm chart
        run: |
          helm lint deploy/charts/foretoken --kube-version 1.36.3
          helm template foretoken deploy/charts/foretoken --kube-version 1.36.3 > /tmp/foretoken.yaml
          grep -q '^kind: Deployment' /tmp/foretoken.yaml
          grep -q '^kind: ClusterRole' /tmp/foretoken.yaml
          if grep -q '^kind: ServiceMonitor' /tmp/foretoken.yaml; then
            exit 1
          fi
          if grep -q '^kind: CustomResourceDefinition' /tmp/foretoken.yaml; then
            exit 1
          fi
          helm template foretoken deploy/charts/foretoken \
            --kube-version 1.36.3 \
            --set frontend.enabled=true \
            --set observability.serviceMonitor.enabled=true \
            --set observability.serviceMonitor.interval=30s \
            --set observability.serviceMonitor.scrapeTimeout=10s \
            > /tmp/foretoken-observability.yaml
          test "$(grep -c '^kind: ServiceMonitor' /tmp/foretoken-observability.yaml)" = "2"
          test "$(grep -c 'path: /metrics' /tmp/foretoken-observability.yaml)" = "2"
          test "$(grep -c 'interval: \"30s\"' /tmp/foretoken-observability.yaml)" = "2"
          test "$(grep -c 'scrapeTimeout: \"10s\"' /tmp/foretoken-observability.yaml)" = "2"
      - name: Validate observability assets
        run: |
          NVIDIA_ADAPTER=deploy/observability/accelerators/nvidia-dcgm
          NVIDIA_DASHBOARD="$NVIDIA_ADAPTER/grafana/dashboards/foretoken-nvidia-gpu-dashboard.json"
          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts
          helm repo add gpu-helm-charts \
            https://nvidia.github.io/dcgm-exporter/helm-charts
          helm repo update
          helm template kube-prometheus-stack \
            prometheus-community/kube-prometheus-stack \
            --version 88.5.4 \
            --namespace monitoring \
            --values deploy/observability/kube-prometheus-stack-values.yaml \
            --show-only templates/prometheus/prometheus.yaml \
            > /tmp/kube-prometheus-stack.yaml
          grep -q 'serviceMonitorSelector: {}' /tmp/kube-prometheus-stack.yaml
          grep -q -- '- monitoring' /tmp/kube-prometheus-stack.yaml
          grep -q -- '- foretoken-platform' /tmp/kube-prometheus-stack.yaml
          grep -q -- '- accelerator-monitoring' /tmp/kube-prometheus-stack.yaml
          test "$(grep -Ec '^[[:space:]]+- [a-z0-9-]+$' \
            deploy/observability/kube-prometheus-stack-values.yaml)" = "3"
          helm template dcgm-exporter \
            gpu-helm-charts/dcgm-exporter \
            --version 4.8.2 \
            --namespace accelerator-monitoring \
            --values "$NVIDIA_ADAPTER/values.yaml" \
            > /tmp/dcgm-exporter.yaml
          grep -q '^kind: DaemonSet' /tmp/dcgm-exporter.yaml
          grep -q '^kind: ServiceMonitor' /tmp/dcgm-exporter.yaml
          grep -q 'runAsNonRoot: true' /tmp/dcgm-exporter.yaml
          grep -q 'runAsUser: 1000' /tmp/dcgm-exporter.yaml
          grep -q 'allowPrivilegeEscalation: false' /tmp/dcgm-exporter.yaml
          grep -q 'drop:' /tmp/dcgm-exporter.yaml
          grep -q -- '- ALL' /tmp/dcgm-exporter.yaml
          grep -q 'targetLabel: foretoken_observability_source' \
            /tmp/dcgm-exporter.yaml
          grep -q 'replacement: accelerator' /tmp/dcgm-exporter.yaml
          grep -q 'targetLabel: foretoken_accelerator_vendor' \
            /tmp/dcgm-exporter.yaml
          grep -q 'replacement: nvidia' /tmp/dcgm-exporter.yaml
          grep -q 'targetLabel: foretoken_accelerator_exporter' \
            /tmp/dcgm-exporter.yaml
          grep -q 'replacement: dcgm' /tmp/dcgm-exporter.yaml
          grep -Fq 'nvcr.io/nvidia/k8s/dcgm-exporter:4.5.3-4.8.2-distroless' \
            /tmp/dcgm-exporter.yaml
          grep -q -- '- --kubernetes=false' /tmp/dcgm-exporter.yaml
          if grep -q 'priorityClassName:' /tmp/dcgm-exporter.yaml; then
            exit 1
          fi
          if grep -q 'runtimeClassName:' /tmp/dcgm-exporter.yaml; then
            exit 1
          fi
          if grep -q 'SYS_ADMIN' /tmp/dcgm-exporter.yaml; then
            exit 1
          fi
          if grep -q 'DCGM_FI_PROF_' /tmp/dcgm-exporter.yaml; then
            exit 1
          fi
          if grep -q 'nvidia.com/gpu' /tmp/dcgm-exporter.yaml; then
            exit 1
          fi
          helm template dcgm-exporter \
            gpu-helm-charts/dcgm-exporter \
            --version 4.8.2 \
            --namespace accelerator-monitoring \
            --values "$NVIDIA_ADAPTER/values.yaml" \
            --values "$NVIDIA_ADAPTER/k3d-values.example.yaml" \
            > /tmp/dcgm-exporter-k3d.yaml
          grep -q 'name: NVIDIA_VISIBLE_DEVICES' \
            /tmp/dcgm-exporter-k3d.yaml
          grep -q 'value: 6,7' /tmp/dcgm-exporter-k3d.yaml
          kubectl apply --dry-run=client \
            --filename "$NVIDIA_ADAPTER/network-policy.yaml"
          helm template dcgm-exporter \
            gpu-helm-charts/dcgm-exporter \
            --version 4.8.2 \
            --namespace accelerator-monitoring \
            --values "$NVIDIA_ADAPTER/values.yaml" \
            --show-only templates/daemonset.yaml \
            > /tmp/dcgm-exporter-daemonset.yaml
          kubectl create --dry-run=client \
            --filename /tmp/dcgm-exporter-daemonset.yaml \
            --output json \
            > /tmp/dcgm-exporter-daemonset.json
          kubectl create --dry-run=client \
            --filename "$NVIDIA_ADAPTER/network-policy.yaml" \
            --output json \
            > /tmp/dcgm-exporter-network-policy.json
          jq -e --slurpfile daemonset /tmp/dcgm-exporter-daemonset.json \
            '.spec.podSelector.matchLabels
              | to_entries
              | all(. as $entry
                | $daemonset[0].spec.template.metadata.labels[$entry.key]
                  == $entry.value)' \
            /tmp/dcgm-exporter-network-policy.json
          jq -e '
            .spec.ingress == [{
              "from": [{
                "namespaceSelector": {
                  "matchLabels": {
                    "inference.foretoken.io/metrics-scraper": "true"
                  }
                }
              }],
              "ports": [{"port": 9400, "protocol": "TCP"}]
            }]' \
            /tmp/dcgm-exporter-network-policy.json
          grep -q 'app.kubernetes.io/name: dcgm-exporter' \
            "$NVIDIA_ADAPTER/network-policy.yaml"
          grep -q 'app.kubernetes.io/component: dcgm-exporter' \
            "$NVIDIA_ADAPTER/network-policy.yaml"
          if grep -q 'app.kubernetes.io/instance:' \
            "$NVIDIA_ADAPTER/network-policy.yaml"; then
            exit 1
          fi
          grep -q 'port: 9400' \
            "$NVIDIA_ADAPTER/network-policy.yaml"
          jq empty "$NVIDIA_DASHBOARD"
          jq -e \
            '.templating.list | map(.name) == ["DS_PROMETHEUS", "instance", "gpu"]' \
            "$NVIDIA_DASHBOARD"
          jq -e '
            [.panels[]?.targets[]?.expr]
            | length > 0
              and all(
                contains("foretoken_observability_source=\"accelerator\"")
                and contains("foretoken_accelerator_vendor=\"nvidia\"")
                and contains("foretoken_accelerator_exporter=\"dcgm\"")
              )' "$NVIDIA_DASHBOARD"
          grep -oE 'DCGM_FI_[A-Z0-9_]+' "$NVIDIA_DASHBOARD" \
            | sort -u > /tmp/dcgm-dashboard-metrics.txt
          grep -oE 'DCGM_FI_[A-Z0-9_]+' "$NVIDIA_ADAPTER/values.yaml" \
            | sort -u > /tmp/dcgm-collector-metrics.txt
          test -z "$(comm -23 \
            /tmp/dcgm-dashboard-metrics.txt \
            /tmp/dcgm-collector-metrics.txt)"
          kubectl kustomize \
            "$NVIDIA_ADAPTER/grafana" \
            > /tmp/foretoken-gpu-dashboard.yaml
          grep -q '^kind: ConfigMap' /tmp/foretoken-gpu-dashboard.yaml
          grep -q 'grafana_dashboard: "1"' \
            /tmp/foretoken-gpu-dashboard.yaml
          grep -q 'Foretoken NVIDIA GPU 运行状态' \
            /tmp/foretoken-gpu-dashboard.yaml
      - name: Validate operator lifecycle
        run: |
          kind load docker-image foretoken-control-plane:test --name foretoken
          helm upgrade --install foretoken deploy/charts/foretoken \
            --namespace foretoken-platform \
            --create-namespace \
            --set image.repository=foretoken-control-plane \
            --set image.tag=test \
            --set image.pullPolicy=Never \
            --wait \
            --timeout=3m
          kubectl wait --for=condition=Established \
            crd/frontendservices.inference.foretoken.io \
            crd/modelservices.inference.foretoken.io \
            crd/modelpools.inference.foretoken.io \
            crd/modelgroups.inference.foretoken.io \
            --timeout=1m
          kubectl create namespace foretoken-demo
          kubectl apply --server-side --namespace foretoken-demo -k examples/quickstart
          kubectl wait --for=condition=PoolsMaterialized \
            modelservice/quickstart-qwen3-0.6b \
            --namespace foretoken-demo \
            --timeout=1m
          kubectl get modelpool/quickstart-qwen3-0.6b-default --namespace foretoken-demo
          test "$(kubectl get modelservice/quickstart-qwen3-0.6b \
            --namespace foretoken-demo \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')" = "False"
          helm upgrade foretoken deploy/charts/foretoken \
            --namespace foretoken-platform \
            --set image.repository=foretoken-control-plane \
            --set image.tag=test \
            --set image.pullPolicy=Never \
            --set resources.requests.cpu=21m \
            --wait \
            --timeout=3m
          helm uninstall foretoken --namespace foretoken-platform --wait
          kubectl get crd/frontendservices.inference.foretoken.io
          kubectl get crd/modelservices.inference.foretoken.io
          kubectl get crd/modelpools.inference.foretoken.io
          kubectl get crd/modelgroups.inference.foretoken.io
          ! kubectl get clusterrole/foretoken-platform-foretoken-control-plane
      - name: Check generated files
        run: git diff --exit-code
