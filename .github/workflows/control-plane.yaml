# Verifies the control plane, generated files, image, and Helm lifecycle.

name: Control plane

on:
  pull_request:
    paths:
      - control-plane/**
      - deploy/charts/foretoken/**
      - deploy/platform-values.example.yaml
      - observability/**
      - .dockerignore
      - LICENSE
      - .github/workflows/control-plane.yaml
  push:
    branches:
      - main
    paths:
      - control-plane/**
      - deploy/charts/foretoken/**
      - deploy/platform-values.example.yaml
      - observability/**
      - .dockerignore
      - LICENSE
      - .github/workflows/control-plane.yaml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Verify control plane
        run: make -C control-plane verify
      - name: Validate operator image
        run: docker build -f control-plane/Dockerfile -t foretoken-control-plane:test .
      - name: Validate Prometheus recording rules
        run: |
          docker run --rm \
            --volume "${PWD}:/workspace:ro" \
            --workdir /workspace \
            --entrypoint /bin/promtool \
            quay.io/prometheus/prometheus:v3.12.0-distroless@sha256:f39df5334dee301b885f77e0ff1159f5d8a43bf9db518f885544594799a1e3c2 \
            check rules deploy/charts/foretoken/files/recording-rules.yaml
          docker run --rm \
            --volume "${PWD}:/workspace:ro" \
            --workdir /workspace \
            --entrypoint /bin/promtool \
            quay.io/prometheus/prometheus:v3.12.0-distroless@sha256:f39df5334dee301b885f77e0ff1159f5d8a43bf9db518f885544594799a1e3c2 \
            test rules observability/tests/recording-rules.test.yaml
      - name: Validate Prometheus alerting rules
        run: |
          docker run --rm \
            --volume "${PWD}:/workspace:ro" \
            --workdir /workspace \
            --entrypoint /bin/promtool \
            quay.io/prometheus/prometheus:v3.12.0-distroless@sha256:f39df5334dee301b885f77e0ff1159f5d8a43bf9db518f885544594799a1e3c2 \
            check rules deploy/charts/foretoken/files/alerting-rules.yaml
          docker run --rm \
            --volume "${PWD}:/workspace:ro" \
            --workdir /workspace \
            --entrypoint /bin/promtool \
            quay.io/prometheus/prometheus:v3.12.0-distroless@sha256:f39df5334dee301b885f77e0ff1159f5d8a43bf9db518f885544594799a1e3c2 \
            test rules observability/tests/alerting-rules.test.yaml
      - name: Validate Grafana dashboard
        run: |
          observability/tests/validate-grafana-dashboard.sh
          jq -f observability/tests/grafana-dashboard-promql.jq \
            deploy/charts/foretoken/files/grafana/foretoken-overview.json \
            > /tmp/foretoken-grafana-promql.json
          test "$(jq '.groups[0].rules | length' /tmp/foretoken-grafana-promql.json)" = "13"
          docker run --rm \
            --volume "/tmp/foretoken-grafana-promql.json:/dashboard-rules.json:ro" \
            --entrypoint /bin/promtool \
            quay.io/prometheus/prometheus:v3.12.0-distroless@sha256:f39df5334dee301b885f77e0ff1159f5d8a43bf9db518f885544594799a1e3c2 \
            check rules /dashboard-rules.json
      - name: Create test cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          cluster_name: foretoken
      - name: Validate Helm chart
        run: |
          helm lint deploy/charts/foretoken \
            --kube-version 1.36.3 \
            --set image.repository=foretoken-control-plane \
            --set image.tag=test
          helm template foretoken deploy/charts/foretoken \
            --kube-version 1.36.3 \
            --set image.repository=foretoken-control-plane \
            --set image.tag=test > /tmp/foretoken.yaml
          grep -q '^kind: Deployment' /tmp/foretoken.yaml
          grep -q '^kind: ClusterRole' /tmp/foretoken.yaml
          if grep -q '^kind: ServiceMonitor' /tmp/foretoken.yaml; then
            exit 1
          fi
          if grep -q '^kind: PrometheusRule' /tmp/foretoken.yaml; then
            exit 1
          fi
          if grep -q 'grafana_dashboard:' /tmp/foretoken.yaml; then
            exit 1
          fi
          if grep -q -- '--metrics-scrape-namespace=' /tmp/foretoken.yaml; then
            exit 1
          fi
          if grep -q '^kind: CustomResourceDefinition' /tmp/foretoken.yaml; then
            exit 1
          fi
          helm template foretoken deploy/charts/foretoken \
            --kube-version 1.36.3 \
            --set image.repository=foretoken-control-plane \
            --set image.tag=test \
            --set frontend.enabled=true \
            --set frontend.image=foretoken-frontend:test \
            --set frontend.gateway.name=foretoken-gateway \
            --set frontend.gateway.namespace=foretoken-platform \
            --set frontend.gateway.sectionName=https > /tmp/foretoken-frontend.yaml
          grep -q -- '--frontend-enabled=true' /tmp/foretoken-frontend.yaml
          grep -q -- '--frontend-image=foretoken-frontend:test' /tmp/foretoken-frontend.yaml
          grep -q 'frontendservices/status' /tmp/foretoken-frontend.yaml
          grep -q 'httproutes' /tmp/foretoken-frontend.yaml
          helm lint deploy/charts/foretoken \
            --kube-version 1.36.3 \
            --values deploy/platform-values.example.yaml
          helm template foretoken deploy/charts/foretoken \
            --kube-version 1.36.3 \
            --values deploy/platform-values.example.yaml \
            --set observability.serviceMonitor.enabled=true \
            --set observability.prometheusRule.enabled=true \
            --set observability.alertingRule.enabled=true \
            --set observability.grafanaDashboard.enabled=true > /tmp/foretoken-observability.yaml
          test "$(grep -c '^kind: ServiceMonitor' /tmp/foretoken-observability.yaml)" = "2"
          test "$(grep -c '^kind: PrometheusRule' /tmp/foretoken-observability.yaml)" = "2"
          test "$(grep -c 'grafana_dashboard: "1"' /tmp/foretoken-observability.yaml)" = "1"
          grep -q 'port: http' /tmp/foretoken-observability.yaml
          grep -q 'port: model-server' /tmp/foretoken-observability.yaml
          grep -q 'inference.foretoken.io/frontend-service' /tmp/foretoken-observability.yaml
          grep -q 'inference.foretoken.io/model-group' /tmp/foretoken-observability.yaml
          test "$(grep -c 'path: /metrics' /tmp/foretoken-observability.yaml)" = "2"
          grep -q 'release: kube-prometheus' /tmp/foretoken-observability.yaml
          grep -q 'foretoken:frontend_http_response_starts:rate5m' /tmp/foretoken-observability.yaml
          grep -q 'foretoken:model_server_requests_waiting:sum' /tmp/foretoken-observability.yaml
          grep -q 'ForetokenMetricsTargetDown' /tmp/foretoken-observability.yaml
          grep -q 'ForetokenFrontendHTTPResponseStart5xxRatioHigh' /tmp/foretoken-observability.yaml
          grep -q 'ForetokenModelServerSchedulerBacklog' /tmp/foretoken-observability.yaml
          grep -q 'ForetokenModelServerKVCachePressureHigh' /tmp/foretoken-observability.yaml
          grep -q 'observability/runbooks/alerts.md' /tmp/foretoken-observability.yaml
          grep -q 'foretoken-overview.json: |-' /tmp/foretoken-observability.yaml
          grep -q '"uid": "foretoken-overview"' /tmp/foretoken-observability.yaml
          grep -q '"title": "Foretoken / Overview"' /tmp/foretoken-observability.yaml
          grep -q -- '--metrics-scrape-namespace=monitoring' /tmp/foretoken-observability.yaml
      - name: Validate operator materialization lifecycle
        run: |
          diagnostics() {
            kubectl get pods --all-namespaces --output=wide || true
            kubectl describe deployment/foretoken-control-plane --namespace foretoken-platform || true
            kubectl logs deployment/foretoken-control-plane --namespace foretoken-platform --container=crd-apply || true
            kubectl logs deployment/foretoken-control-plane --namespace foretoken-platform --container=manager || true
          }
          trap diagnostics ERR
          kind load docker-image foretoken-control-plane:test --name foretoken
          helm upgrade --install foretoken deploy/charts/foretoken \
            --namespace foretoken-platform \
            --create-namespace \
            --set image.repository=foretoken-control-plane \
            --set image.tag=test \
            --set image.pullPolicy=Never \
            --set-string runtime.vllm.image=vllm:test \
            --set runtime.vllm.accelerator.type=nvidia-h100-80gb \
            --set runtime.vllm.accelerator.resourceName=nvidia.com/gpu \
            --set runtime.vllm.accelerator.nodeSelector.key=nvidia.com/gpu.product \
            --set runtime.vllm.accelerator.nodeSelector.value=NVIDIA-H100-80GB-HBM3 \
            --wait \
            --timeout=3m
          kubectl wait --for=condition=Established \
            crd/frontendservices.inference.foretoken.io \
            crd/modelservices.inference.foretoken.io \
            crd/modelpools.inference.foretoken.io \
            crd/modelgroups.inference.foretoken.io \
            crd/kvservices.inference.foretoken.io \
            crd/kvpools.inference.foretoken.io \
            crd/kvgroups.inference.foretoken.io \
            --timeout=1m
          CONTROLLER_IDENTITY="system:serviceaccount:foretoken-platform:foretoken-control-plane"
          test "$(kubectl auth can-i patch modelgroups.inference.foretoken.io --as="${CONTROLLER_IDENTITY}")" = "yes"
          test "$(kubectl auth can-i patch networkpolicies.networking.k8s.io --as="${CONTROLLER_IDENTITY}")" = "yes"
          test "$(kubectl auth can-i list frontendservices.inference.foretoken.io --as="${CONTROLLER_IDENTITY}")" = "yes"
          kubectl create namespace foretoken-demo
          kubectl apply --server-side --namespace foretoken-demo -k examples/quickstart
          kubectl wait --for=condition=PoolsMaterialized \
            modelservice/quickstart-qwen3-0.6b \
            --namespace foretoken-demo \
            --timeout=1m
          kubectl get modelpool/quickstart-qwen3-0.6b-default --namespace foretoken-demo
          kubectl wait --for=condition=GroupsMaterialized \
            modelpool/quickstart-qwen3-0.6b-default \
            --namespace foretoken-demo \
            --timeout=1m
          test "$(kubectl get modelgroups \
            --namespace foretoken-demo \
            --output=jsonpath='{range .items[*]}x{end}')" = "x"
          GROUP_NAME="$(kubectl get modelgroups \
            --namespace foretoken-demo \
            --output=jsonpath='{.items[0].metadata.name}')"
          kubectl wait --for=condition=WorkloadMaterialized \
            "modelgroup/${GROUP_NAME}" \
            --namespace foretoken-demo \
            --timeout=1m
          kubectl get "deployment/${GROUP_NAME}" --namespace foretoken-demo
          kubectl get "service/${GROUP_NAME}" --namespace foretoken-demo
          kubectl get "networkpolicy/${GROUP_NAME}" --namespace foretoken-demo
          test "$(kubectl get "modelgroup/${GROUP_NAME}" \
            --namespace foretoken-demo \
            --output=jsonpath='{.status.conditions[?(@.type=="Ready")].status}')" = "False"
          test "$(kubectl get modelservice/quickstart-qwen3-0.6b \
            --namespace foretoken-demo \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')" = "False"
          cat <<'EOF' | kubectl apply --namespace foretoken-demo -f -
          apiVersion: inference.foretoken.io/v1alpha1
          kind: KVService
          metadata:
            name: ci-kv
          spec:
            backend: mooncakeStandaloneStore
            master:
              image: mooncake-master:test
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
            storagePools:
              - name: default
                replicas: 1
                client:
                  image: mooncake-client:test
                  protocol: rdma
                  resources:
                    requests:
                      cpu: 100m
                      memory: 256Mi
                  rdmaResourceName: rdma/ib
                  memoryCapacity: "134217728"
                  disk:
                    size: "1073741824"
            timeouts:
              startup: 10m
              drain: 2m
            requester:
              localBufferSize: "134217728"
          EOF
          kubectl wait --for=jsonpath='{.status.observedGeneration}'=1 \
            kvservice/ci-kv --namespace foretoken-demo --timeout=1m
          KVPOOL_NAME="$(kubectl get kvpools --namespace foretoken-demo \
            --output=jsonpath='{.items[0].metadata.name}')"
          kubectl wait --for=condition=GroupsMaterialized \
            "kvpool/${KVPOOL_NAME}" --namespace foretoken-demo --timeout=1m
          KVGROUP_NAME="$(kubectl get kvgroups --namespace foretoken-demo \
            --output=jsonpath='{.items[0].metadata.name}')"
          kubectl wait --for=jsonpath='{.status.observedGeneration}'=1 \
            "kvgroup/${KVGROUP_NAME}" --namespace foretoken-demo --timeout=1m
          kubectl get deployment,service,configmap \
            --namespace foretoken-demo \
            --selector=inference.foretoken.io/component=mooncake-master
          kubectl get deployment,service,networkpolicy,persistentvolumeclaim \
            --namespace foretoken-demo \
            --selector=inference.foretoken.io/kv-group
          kubectl delete kvservice/ci-kv --namespace foretoken-demo \
            --wait --timeout=1m
          helm upgrade foretoken deploy/charts/foretoken \
            --namespace foretoken-platform \
            --set image.repository=foretoken-control-plane \
            --set image.tag=test \
            --set image.pullPolicy=Never \
            --set resources.requests.cpu=21m \
            --wait \
            --timeout=3m
          helm uninstall foretoken --namespace foretoken-platform --wait
          kubectl get crd/frontendservices.inference.foretoken.io
          kubectl get crd/modelservices.inference.foretoken.io
          kubectl get crd/modelpools.inference.foretoken.io
          kubectl get crd/modelgroups.inference.foretoken.io
          kubectl get crd/kvservices.inference.foretoken.io
          kubectl get crd/kvpools.inference.foretoken.io
          kubectl get crd/kvgroups.inference.foretoken.io
          ! kubectl get clusterrole/foretoken-platform-foretoken-control-plane
      - name: Check generated files
        run: git diff --exit-code
