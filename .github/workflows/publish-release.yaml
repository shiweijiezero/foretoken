#
# Publishes release OCI images and the Helm chart for a GitHub release tag.

name: Publish release artifacts

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-plane
            file: control-plane/Dockerfile
            image: control-plane
          - name: frontend
            file: data-plane/frontend/Dockerfile
            image: frontend
          - name: model-server
            file: data-plane/model-server/Dockerfile
            image: model-server
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/foretoken/${{ matrix.image }}:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/foretoken/${{ matrix.image }}:latest
          build-args: |
            INFERENCE_ENGINE_IMAGE=ghcr.io/${{ github.repository_owner }}/foretoken/model-server:0.0.1
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  chart:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Helm chart
        shell: bash
        run: |
          helm package deploy/charts/foretoken
          helm push foretoken-*.tgz oci://ghcr.io/${{ github.repository_owner }}/foretoken/charts
