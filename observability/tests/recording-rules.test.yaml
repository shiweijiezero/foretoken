#
# Exercises Foretoken recording-rule aggregation and source filtering.

rule_files:
  - ../../deploy/charts/foretoken/files/recording-rules.yaml

evaluation_interval: 1m
fuzzy_compare: true
group_eval_order:
  - foretoken.recording

tests:
  - name: aggregate frontend and model-server metrics into stable labels
    interval: 1m
    input_series:
      - series: 'http_requests_total{namespace="foretoken-demo",endpoint="http",inference_foretoken_io_frontend_service="quickstart",method="POST",handler="/v1/chat/completions",status="2xx",pod="frontend-a"}'
        values: '0+54x5'
      - series: 'http_requests_total{namespace="foretoken-demo",endpoint="http",inference_foretoken_io_frontend_service="quickstart",method="POST",handler="/v1/chat/completions",status="5xx",pod="frontend-a"}'
        values: '0+6x5'
      - series: 'http_requests_total{namespace="foretoken-demo",endpoint="http",inference_foretoken_io_frontend_service="healthy",method="POST",handler="/v1/chat/completions",status="2xx",pod="frontend-b"}'
        values: '0+120x5'
      - series: 'http_requests_total{namespace="other",endpoint="http",method="GET",handler="/",status="5xx"}'
        values: '0+600x5'

      - series: 'vllm:prompt_tokens_total{namespace="foretoken-demo",endpoint="model-server",inference_foretoken_io_model_group="quickstart-aggregate",inference_foretoken_io_model_role="aggregate",model_name="Qwen/Qwen3-0.6B",engine="0",pod="model-a"}'
        values: '0+600x5'
      - series: 'vllm:prompt_tokens_total{namespace="foretoken-demo",endpoint="model-server",inference_foretoken_io_model_group="quickstart-aggregate",inference_foretoken_io_model_role="aggregate",model_name="Qwen/Qwen3-0.6B",engine="1",pod="model-b"}'
        values: '0+300x5'
      - series: 'vllm:generation_tokens_total{namespace="foretoken-demo",endpoint="model-server",inference_foretoken_io_model_group="quickstart-aggregate",inference_foretoken_io_model_role="aggregate",model_name="Qwen/Qwen3-0.6B",engine="0",pod="model-a"}'
        values: '0+120x5'
      - series: 'vllm:generation_tokens_total{namespace="foretoken-demo",endpoint="model-server",inference_foretoken_io_model_group="quickstart-aggregate",inference_foretoken_io_model_role="aggregate",model_name="Qwen/Qwen3-0.6B",engine="1",pod="model-b"}'
        values: '0+60x5'
      - series: 'vllm:num_requests_running{namespace="foretoken-demo",endpoint="model-server",inference_foretoken_io_model_group="quickstart-aggregate",inference_foretoken_io_model_role="aggregate",model_name="Qwen/Qwen3-0.6B",engine="0",pod="model-a"}'
        values: '2+0x5'
      - series: 'vllm:num_requests_running{namespace="foretoken-demo",endpoint="model-server",inference_foretoken_io_model_group="quickstart-aggregate",inference_foretoken_io_model_role="aggregate",model_name="Qwen/Qwen3-0.6B",engine="1",pod="model-b"}'
        values: '3+0x5'
      - series: 'vllm:num_requests_waiting{namespace="foretoken-demo",endpoint="model-server",inference_foretoken_io_model_group="quickstart-aggregate",inference_foretoken_io_model_role="aggregate",model_name="Qwen/Qwen3-0.6B",engine="0",pod="model-a"}'
        values: '1+0x5'
      - series: 'vllm:num_requests_waiting{namespace="foretoken-demo",endpoint="model-server",inference_foretoken_io_model_group="quickstart-aggregate",inference_foretoken_io_model_role="aggregate",model_name="Qwen/Qwen3-0.6B",engine="1",pod="model-b"}'
        values: '4+0x5'
      - series: 'vllm:num_requests_waiting{namespace="foretoken-demo",endpoint="model-server",inference_foretoken_io_model_group="quickstart-decode",inference_foretoken_io_model_role="decode",inference_foretoken_io_pd_pipeline_scope="quickstart-pd",model_name="Qwen/Qwen3-0.6B",engine="0",pod="decode-a"}'
        values: '2+0x5'
      - series: 'vllm:kv_cache_usage_perc{namespace="foretoken-demo",endpoint="model-server",inference_foretoken_io_model_group="quickstart-aggregate",inference_foretoken_io_model_role="aggregate",model_name="Qwen/Qwen3-0.6B",engine="0",pod="model-a"}'
        values: '0.7+0x5'
      - series: 'vllm:kv_cache_usage_perc{namespace="foretoken-demo",endpoint="model-server",inference_foretoken_io_model_group="quickstart-aggregate",inference_foretoken_io_model_role="aggregate",model_name="Qwen/Qwen3-0.6B",engine="1",pod="model-b"}'
        values: '0.9+0x5'

    promql_expr_test:
      - expr: foretoken:frontend_http_response_starts:rate5m
        eval_time: 5m
        exp_samples:
          - labels: 'foretoken:frontend_http_response_starts:rate5m{namespace="foretoken-demo",frontend_service="healthy",method="POST",handler="/v1/chat/completions",status="2xx"}'
            value: 2
          - labels: 'foretoken:frontend_http_response_starts:rate5m{namespace="foretoken-demo",frontend_service="quickstart",method="POST",handler="/v1/chat/completions",status="2xx"}'
            value: 0.9
          - labels: 'foretoken:frontend_http_response_starts:rate5m{namespace="foretoken-demo",frontend_service="quickstart",method="POST",handler="/v1/chat/completions",status="5xx"}'
            value: 0.1
      - expr: foretoken:frontend_http_response_start_5xx_ratio:rate5m
        eval_time: 5m
        exp_samples:
          - labels: 'foretoken:frontend_http_response_start_5xx_ratio:rate5m{namespace="foretoken-demo",frontend_service="healthy"}'
            value: 0
          - labels: 'foretoken:frontend_http_response_start_5xx_ratio:rate5m{namespace="foretoken-demo",frontend_service="quickstart"}'
            value: 0.1
      - expr: foretoken:model_server_prompt_tokens:rate5m
        eval_time: 5m
        exp_samples:
          - labels: 'foretoken:model_server_prompt_tokens:rate5m{namespace="foretoken-demo",model_group="quickstart-aggregate",model_role="aggregate",model_name="Qwen/Qwen3-0.6B"}'
            value: 15
      - expr: foretoken:model_server_generation_tokens:rate5m
        eval_time: 5m
        exp_samples:
          - labels: 'foretoken:model_server_generation_tokens:rate5m{namespace="foretoken-demo",model_group="quickstart-aggregate",model_role="aggregate",model_name="Qwen/Qwen3-0.6B"}'
            value: 3
      - expr: foretoken:model_server_requests_running:sum
        eval_time: 5m
        exp_samples:
          - labels: 'foretoken:model_server_requests_running:sum{namespace="foretoken-demo",model_group="quickstart-aggregate",model_role="aggregate",model_name="Qwen/Qwen3-0.6B"}'
            value: 5
      - expr: foretoken:model_server_requests_waiting:sum
        eval_time: 5m
        exp_samples:
          - labels: 'foretoken:model_server_requests_waiting:sum{namespace="foretoken-demo",model_group="quickstart-decode",model_role="decode",pd_pipeline_scope="quickstart-pd",model_name="Qwen/Qwen3-0.6B"}'
            value: 2
          - labels: 'foretoken:model_server_requests_waiting:sum{namespace="foretoken-demo",model_group="quickstart-aggregate",model_role="aggregate",model_name="Qwen/Qwen3-0.6B"}'
            value: 5
      - expr: foretoken:model_server_kv_cache_usage_ratio:max
        eval_time: 5m
        exp_samples:
          - labels: 'foretoken:model_server_kv_cache_usage_ratio:max{namespace="foretoken-demo",model_group="quickstart-aggregate",model_role="aggregate",model_name="Qwen/Qwen3-0.6B"}'
            value: 0.9

  - name: counter resets and scrape gaps remain rate-safe
    interval: 1m
    input_series:
      - series: 'vllm:generation_tokens_total{namespace="foretoken-demo",endpoint="model-server",inference_foretoken_io_model_group="reset-group",inference_foretoken_io_model_role="aggregate",model_name="model",engine="0",pod="model-a"}'
        values: '0 60 120 180 60 120'
      - series: 'vllm:generation_tokens_total{namespace="foretoken-demo",endpoint="model-server",inference_foretoken_io_model_group="reset-group",inference_foretoken_io_model_role="aggregate",model_name="model",engine="1",pod="model-b"}'
        values: '0+120x5'
      - series: 'vllm:prompt_tokens_total{namespace="foretoken-demo",endpoint="model-server",inference_foretoken_io_model_group="reset-group",inference_foretoken_io_model_role="aggregate",model_name="model",engine="0",pod="model-a"}'
        values: '0 60 120 _ 240 300'
    promql_expr_test:
      - expr: foretoken:model_server_generation_tokens:rate5m
        eval_time: 5m
        exp_samples:
          - labels: 'foretoken:model_server_generation_tokens:rate5m{namespace="foretoken-demo",model_group="reset-group",model_role="aggregate",model_name="model"}'
            value: 3
      - expr: foretoken:model_server_prompt_tokens:rate5m
        eval_time: 5m
        exp_samples:
          - labels: 'foretoken:model_server_prompt_tokens:rate5m{namespace="foretoken-demo",model_group="reset-group",model_role="aggregate",model_name="model"}'
            value: 1

  - name: real gauge zero remains zero
    interval: 1m
    input_series:
      - series: 'vllm:num_requests_running{namespace="foretoken-demo",endpoint="model-server",inference_foretoken_io_model_group="zero-group",inference_foretoken_io_model_role="aggregate",model_name="model",engine="0",pod="model-a"}'
        values: '0+0x5'
    promql_expr_test:
      - expr: foretoken:model_server_requests_running:sum
        eval_time: 5m
        exp_samples:
          - labels: 'foretoken:model_server_requests_running:sum{namespace="foretoken-demo",model_group="zero-group",model_role="aggregate",model_name="model"}'
            value: 0

  - name: stale inputs stay absent
    interval: 1m
    input_series:
      - series: 'vllm:num_requests_running{namespace="foretoken-demo",endpoint="model-server",inference_foretoken_io_model_group="stale-group",inference_foretoken_io_model_role="aggregate",model_name="model",engine="0",pod="model-a"}'
        values: '7 stale _x4'
      - series: 'vllm:prompt_tokens_total{namespace="foretoken-demo",endpoint="model-server",inference_foretoken_io_model_group="stale-group",inference_foretoken_io_model_role="aggregate",model_name="model",engine="0",pod="model-a"}'
        values: '0 stale _x4'
    promql_expr_test:
      - expr: foretoken:model_server_requests_running:sum
        eval_time: 5m
        exp_samples: []
      - expr: foretoken:model_server_prompt_tokens:rate5m
        eval_time: 5m
        exp_samples: []
