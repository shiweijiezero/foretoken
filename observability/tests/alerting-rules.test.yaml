#
# Protects the timing, suppression, recovery, and routing-label contracts of the
# operator-facing alerts. The Lark end-to-end experiment validates delivery but
# does not exercise these production PromQL expressions.

rule_files:
  - ../../deploy/charts/foretoken/files/alerting-rules.yaml

evaluation_interval: 1m
group_eval_order:
  - foretoken.alerting

tests:
  # A discovered Foretoken target must remain down for five minutes; unrelated
  # scrape targets must not enter the Foretoken notification route.
  - name: metrics target down waits, fires with service identity, and recovers
    interval: 1m
    input_series:
      - series: 'up{namespace="foretoken-demo",endpoint="model-server",instance="10.0.0.1:9000",inference_foretoken_io_model_group="quickstart-aggregate",pod="model-a"}'
        values: '0+0x5 1'
      - series: 'up{namespace="other",endpoint="http",instance="10.0.0.2:8080",pod="other-a"}'
        values: '0+0x6'
    alert_rule_test:
      - eval_time: 4m
        alertname: ForetokenMetricsTargetDown
        exp_alerts: []
      - eval_time: 5m
        alertname: ForetokenMetricsTargetDown
        exp_alerts:
          - exp_labels:
              endpoint: model-server
              inference_foretoken_io_model_group: quickstart-aggregate
              instance: 10.0.0.1:9000
              namespace: foretoken-demo
              pod: model-a
              service: foretoken
              severity: warning
            exp_annotations:
              summary: Foretoken metrics target model-server cannot be scraped
              description: Prometheus has failed to scrape model-server at 10.0.0.1:9000 in namespace foretoken-demo for 5 minutes. This checks metrics reachability, not request readiness or a confirmed user outage.
              runbook_url: https://github.com/shiweijiezero/foretoken/blob/main/observability/runbooks/alerts.md#foretokenmetricstargetdown
      - eval_time: 6m
        alertname: ForetokenMetricsTargetDown
        exp_alerts: []
    promql_expr_test:
      - expr: 'ALERTS{alertname="ForetokenMetricsTargetDown",alertstate="pending"}'
        eval_time: 4m
        exp_samples:
          - labels: 'ALERTS{alertname="ForetokenMetricsTargetDown",alertstate="pending",namespace="foretoken-demo",endpoint="model-server",instance="10.0.0.1:9000",inference_foretoken_io_model_group="quickstart-aggregate",pod="model-a",service="foretoken",severity="warning"}'
            value: 1
      - expr: 'ALERTS{alertname="ForetokenMetricsTargetDown",alertstate="firing"}'
        eval_time: 5m
        exp_samples:
          - labels: 'ALERTS{alertname="ForetokenMetricsTargetDown",alertstate="firing",namespace="foretoken-demo",endpoint="model-server",instance="10.0.0.1:9000",inference_foretoken_io_model_group="quickstart-aggregate",pod="model-a",service="foretoken",severity="warning"}'
            value: 1

  # The Frontend ratio alert must ignore low traffic and the exact 5% boundary,
  # then resolve when the measured ratio falls below the threshold.
  - name: frontend 5xx ratio requires traffic, exceeds threshold, and recovers
    interval: 1m
    input_series:
      - series: 'foretoken:frontend_http_response_start_5xx_ratio:rate5m{namespace="foretoken-demo",frontend_service="quickstart"}'
        values: '0.10+0x10 0.01'
      - series: 'foretoken:frontend_http_response_starts:rate5m{namespace="foretoken-demo",frontend_service="quickstart",method="POST",handler="/v1/chat/completions",status="2xx"}'
        values: '0.10+0x11'
      - series: 'foretoken:frontend_http_response_start_5xx_ratio:rate5m{namespace="foretoken-demo",frontend_service="low-traffic"}'
        values: '0.50+0x11'
      - series: 'foretoken:frontend_http_response_starts:rate5m{namespace="foretoken-demo",frontend_service="low-traffic",method="POST",handler="/v1/chat/completions",status="2xx"}'
        values: '0.05+0x11'
      - series: 'foretoken:frontend_http_response_start_5xx_ratio:rate5m{namespace="foretoken-demo",frontend_service="ratio-boundary"}'
        values: '0.05+0x11'
      - series: 'foretoken:frontend_http_response_starts:rate5m{namespace="foretoken-demo",frontend_service="ratio-boundary",method="POST",handler="/v1/chat/completions",status="2xx"}'
        values: '0.20+0x11'
    alert_rule_test:
      - eval_time: 9m
        alertname: ForetokenFrontendHTTPResponseStart5xxRatioHigh
        exp_alerts: []
      - eval_time: 10m
        alertname: ForetokenFrontendHTTPResponseStart5xxRatioHigh
        exp_alerts:
          - exp_labels:
              frontend_service: quickstart
              namespace: foretoken-demo
              service: foretoken
              severity: warning
            exp_annotations:
              summary: Frontend quickstart has elevated response-start 5xx errors
              description: More than 5% of HTTP response starts for Frontend quickstart have been 5xx for 10 minutes with at least 0.1 response starts per second. Errors after a stream starts are not counted, so this is not an inference failure SLO.
              runbook_url: https://github.com/shiweijiezero/foretoken/blob/main/observability/runbooks/alerts.md#foretokenfrontendhttpresponsestart5xxratiohigh
      - eval_time: 11m
        alertname: ForetokenFrontendHTTPResponseStart5xxRatioHigh
        exp_alerts: []

  # A transient scheduler queue is normal; only a continuous ten-minute
  # backlog should enter the Foretoken warning route.
  - name: scheduler backlog waits, fires with service identity, and recovers
    interval: 1m
    input_series:
      - series: 'foretoken:model_server_requests_waiting:sum{namespace="foretoken-demo",model_group="quickstart-decode",model_role="decode",pd_pipeline_scope="quickstart-pd",model_name="Qwen/Qwen3-0.6B"}'
        values: '3+0x10 0'
      - series: 'foretoken:model_server_requests_waiting:sum{namespace="foretoken-demo",model_group="idle",model_role="aggregate",model_name="Qwen/Qwen3-0.6B"}'
        values: '0+0x11'
    alert_rule_test:
      - eval_time: 9m
        alertname: ForetokenModelServerSchedulerBacklog
        exp_alerts: []
      - eval_time: 10m
        alertname: ForetokenModelServerSchedulerBacklog
        exp_alerts:
          - exp_labels:
              model_group: quickstart-decode
              model_name: Qwen/Qwen3-0.6B
              model_role: decode
              namespace: foretoken-demo
              pd_pipeline_scope: quickstart-pd
              service: foretoken
              severity: warning
            exp_annotations:
              summary: vLLM scheduler backlog persists for model group quickstart-decode
              description: The vLLM scheduler for quickstart-decode/decode has continuously had waiting stage requests for 10 minutes. This is not a user count or the Frontend admission queue.
              runbook_url: https://github.com/shiweijiezero/foretoken/blob/main/observability/runbooks/alerts.md#foretokenmodelserverschedulerbacklog
      - eval_time: 11m
        alertname: ForetokenModelServerSchedulerBacklog
        exp_alerts: []

  # The maximum KV-cache signal must fire at the inclusive 95% boundary while
  # a value immediately below it remains quiet, then recover when pressure falls.
  - name: kv cache pressure fires at threshold and recovers
    interval: 1m
    input_series:
      - series: 'foretoken:model_server_kv_cache_usage_ratio:max{namespace="foretoken-demo",model_group="quickstart-decode",model_role="decode",pd_pipeline_scope="quickstart-pd",model_name="Qwen/Qwen3-0.6B"}'
        values: '0.95+0x10 0.50'
      - series: 'foretoken:model_server_kv_cache_usage_ratio:max{namespace="foretoken-demo",model_group="below-threshold",model_role="aggregate",model_name="Qwen/Qwen3-0.6B"}'
        values: '0.949+0x11'
    alert_rule_test:
      - eval_time: 9m
        alertname: ForetokenModelServerKVCachePressureHigh
        exp_alerts: []
      - eval_time: 10m
        alertname: ForetokenModelServerKVCachePressureHigh
        exp_alerts:
          - exp_labels:
              model_group: quickstart-decode
              model_name: Qwen/Qwen3-0.6B
              model_role: decode
              namespace: foretoken-demo
              pd_pipeline_scope: quickstart-pd
              service: foretoken
              severity: warning
            exp_annotations:
              summary: KV-cache pressure is high for model group quickstart-decode
              description: The maximum KV-cache usage across vLLM engines in quickstart-decode/decode has stayed at or above 95% for 10 minutes. The engine contributing the maximum can change between evaluations.
              runbook_url: https://github.com/shiweijiezero/foretoken/blob/main/observability/runbooks/alerts.md#foretokenmodelserverkvcachepressurehigh
      - eval_time: 11m
        alertname: ForetokenModelServerKVCachePressureHigh
        exp_alerts: []
