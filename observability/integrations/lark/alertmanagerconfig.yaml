#
# Optional Alertmanager receiver for Foretoken alerts. The referenced Secret
# and the AlertmanagerConfig must exist in the same namespace.

apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: foretoken-lark
spec:
  route:
    groupBy:
      - alertname
    groupWait: 5s
    groupInterval: 30s
    repeatInterval: 1h
    matchers:
      - name: service
        matchType: "="
        value: foretoken
    receiver: lark
  receivers:
    - name: lark
      webhookConfigs:
        - urlSecret:
            name: foretoken-lark-webhook
            key: url
          sendResolved: true
          maxAlerts: 5
          timeout: 10s
          payload: |
            {{- $language := "zh" -}}
            {{- if eq (index .CommonLabels "notification_language") "en" }}{{ $language = "en" }}{{ end -}}
            {{- if eq (index .CommonLabels "notification_language") "bilingual" }}{{ $language = "bilingual" }}{{ end -}}
            {{- $title := "Foretoken 告警通知" -}}
            {{- $firing := "触发" -}}
            {{- $resolved := "解除" -}}
            {{- $levelLabel := "级别" -}}
            {{- $namespaceLabel := "命名空间" -}}
            {{- $podLabel := "Pod" -}}
            {{- $instanceLabel := "实例" -}}
            {{- $endpointLabel := "端点" -}}
            {{- $modelRoleLabel := "模型角色" -}}
            {{- $frontendLabel := "前端" -}}
            {{- $modelGroupLabel := "模型组" -}}
            {{- $pipelineLabel := "流水线范围" -}}
            {{- $timeStartLabel := "告警开始" -}}
            {{- $timeEndLabel := "告警解除" -}}
            {{- $summaryLabel := "摘要" -}}
            {{- $descriptionLabel := "详情" -}}
            {{- $runbookLabel := "排障手册" -}}
            {{- $severityWarning := "警告" -}}
            {{- $severityCritical := "严重" -}}
            {{- $severityInfo := "提示" -}}
            {{- $targetDownNote := "说明：抓取失败告警已解除；可能是抓取恢复，也可能是旧目标被移除，不代表原 Pod 或节点已恢复。" -}}
            {{- if eq $language "en" -}}
            {{- $title = "Foretoken alert notification" -}}
            {{- $firing = "firing" -}}
            {{- $resolved = "resolved" -}}
            {{- $levelLabel = "Severity" -}}
            {{- $namespaceLabel = "Namespace" -}}
            {{- $instanceLabel = "Instance" -}}
            {{- $endpointLabel = "Endpoint" -}}
            {{- $modelRoleLabel = "Model role" -}}
            {{- $frontendLabel = "Frontend" -}}
            {{- $modelGroupLabel = "Model group" -}}
            {{- $pipelineLabel = "Pipeline scope" -}}
            {{- $timeStartLabel = "Started" -}}
            {{- $timeEndLabel = "Resolved" -}}
            {{- $summaryLabel = "Summary" -}}
            {{- $descriptionLabel = "Details" -}}
            {{- $runbookLabel = "Runbook" -}}
            {{- $targetDownNote = "Note: a resolved scrape failure may mean that scraping recovered or that the old target disappeared; it does not prove that the original Pod or node recovered." -}}
            {{- end -}}
            {{- if eq $language "bilingual" -}}
            {{- $title = "Foretoken 告警通知 / Foretoken alert notification" -}}
            {{- $firing = "触发 / firing" -}}
            {{- $resolved = "解除 / resolved" -}}
            {{- $levelLabel = "级别 / Severity" -}}
            {{- $namespaceLabel = "命名空间 / Namespace" -}}
            {{- $podLabel = "Pod" -}}
            {{- $instanceLabel = "实例 / Instance" -}}
            {{- $endpointLabel = "端点 / Endpoint" -}}
            {{- $modelRoleLabel = "模型角色 / Model role" -}}
            {{- $frontendLabel = "前端 / Frontend" -}}
            {{- $modelGroupLabel = "模型组 / Model group" -}}
            {{- $pipelineLabel = "流水线范围 / Pipeline scope" -}}
            {{- $timeStartLabel = "告警开始 / Started" -}}
            {{- $timeEndLabel = "告警解除 / Resolved" -}}
            {{- $summaryLabel = "摘要 / Summary" -}}
            {{- $descriptionLabel = "详情 / Details" -}}
            {{- $runbookLabel = "排障手册 / Runbook" -}}
            {{- $targetDownNote = "说明：抓取失败告警已解除；可能是抓取恢复，也可能是旧目标被移除，不代表原 Pod 或节点已恢复。 / Note: a resolved scrape failure may mean that scraping recovered or that the old target disappeared; it does not prove that the original Pod or node recovered." -}}
            {{- $severityWarning = "警告 / warning" -}}
            {{- $severityCritical = "严重 / critical" -}}
            {{- $severityInfo = "提示 / info" -}}
            {{- end -}}
            {{- $header := printf "%s | %s %d · %s %d\n本条展示 %d 个目标（每条最多 5 个）" $title $firing (len .Alerts.Firing) $resolved (len .Alerts.Resolved) (len .Alerts) -}}
            {{- if eq $language "en" }}{{ $header = printf "%s | %s %d · %s %d\nShowing %d targets (max 5 per message)" $title $firing (len .Alerts.Firing) $resolved (len .Alerts.Resolved) (len .Alerts) }}{{ end -}}
            {{- if eq $language "bilingual" }}{{ $header = printf "%s | 触发 %d · 解除 %d / firing %d · resolved %d\n本条展示 %d 个目标（每条最多 5 个） / Showing %d targets (max 5 per message)" $title (len .Alerts.Firing) (len .Alerts.Resolved) (len .Alerts.Firing) (len .Alerts.Resolved) (len .Alerts) (len .Alerts) }}{{ end -}}
            {{- $text := $header -}}
            {{- range .Alerts -}}
            {{- $state := $firing -}}
            {{- if eq .Status "resolved" }}{{ $state = $resolved }}{{ end -}}
            {{- $originalAlertName := .Labels.alertname -}}
            {{- $alertName := $originalAlertName -}}
            {{- if eq $language "zh" -}}
            {{- with .Annotations.alertname_zh }}{{ $alertName = . }}{{ end -}}
            {{- end -}}
            {{- if eq $language "bilingual" -}}
            {{- with .Annotations.alertname_zh }}{{ $alertName = printf "%s / %s" . $originalAlertName }}{{ end -}}
            {{- end -}}
            {{- $severity := .Labels.severity -}}
            {{- if ne $language "en" -}}
            {{- if eq .Labels.severity "warning" }}{{ $severity = $severityWarning }}{{ end -}}
            {{- if eq .Labels.severity "critical" }}{{ $severity = $severityCritical }}{{ end -}}
            {{- if eq .Labels.severity "info" }}{{ $severity = $severityInfo }}{{ end -}}
            {{- end -}}
            {{- $summary := .Annotations.summary -}}
            {{- $description := .Annotations.description -}}
            {{- if eq $language "zh" }}{{ $summary = .Annotations.summary_zh }}{{ $description = .Annotations.description_zh }}{{ end -}}
            {{- if eq $language "bilingual" }}{{ $summary = printf "%s / %s" .Annotations.summary_zh .Annotations.summary }}{{ $description = printf "%s / %s" .Annotations.description_zh .Annotations.description }}{{ end -}}
            {{- $text = printf "%s\n\n[%s] %s\n%s: %s" $text $state $alertName $levelLabel $severity -}}
            {{- with .Labels.namespace }}{{ $text = printf "%s\n%s：%s" $text $namespaceLabel . }}{{ end -}}
            {{- with .Labels.pod }}{{ $text = printf "%s\n%s：%s" $text $podLabel . }}{{ end -}}
            {{- with .Labels.instance }}{{ $text = printf "%s\n%s：%s" $text $instanceLabel . }}{{ end -}}
            {{- with .Labels.endpoint }}{{ $text = printf "%s\n%s：%s" $text $endpointLabel . }}{{ end -}}
            {{- with .Labels.model_role }}{{ $text = printf "%s\n%s：%s" $text $modelRoleLabel . }}{{ end -}}
            {{- with .Labels.inference_foretoken_io_model_role }}{{ $text = printf "%s\n%s：%s" $text $modelRoleLabel . }}{{ end -}}
            {{- with .Labels.inference_foretoken_io_frontend_service }}{{ $text = printf "%s\n%s：%s" $text $frontendLabel . }}{{ end -}}
            {{- with .Labels.frontend_service }}{{ $text = printf "%s\n%s：%s" $text $frontendLabel . }}{{ end -}}
            {{- with .Labels.model_group }}{{ $text = printf "%s\n%s：%s" $text $modelGroupLabel . }}{{ end -}}
            {{- with .Labels.inference_foretoken_io_model_group }}{{ $text = printf "%s\n%s：%s" $text $modelGroupLabel . }}{{ end -}}
            {{- with .Labels.pd_pipeline_scope }}{{ $text = printf "%s\n%s：%s" $text $pipelineLabel . }}{{ end -}}
            {{- with .Labels.inference_foretoken_io_pd_pipeline_scope }}{{ $text = printf "%s\n%s：%s" $text $pipelineLabel . }}{{ end -}}
            {{- $text = printf "%s\n%s：%s" $text $timeStartLabel (.StartsAt | tz "Asia/Shanghai" | date "2006-01-02 15:04:05 -0700") -}}
            {{- if eq .Status "resolved" -}}
            {{- $text = printf "%s\n%s：%s" $text $timeEndLabel (.EndsAt | tz "Asia/Shanghai" | date "2006-01-02 15:04:05 -0700") -}}
            {{- end -}}
            {{- with $summary }}{{ $text = printf "%s\n%s：%s" $text $summaryLabel . }}{{ end -}}
            {{- with $description }}{{ $text = printf "%s\n%s：%s" $text $descriptionLabel . }}{{ end -}}
            {{- with .Annotations.runbook_url }}{{ $text = printf "%s\n%s：%s" $text $runbookLabel . }}{{ end -}}
            {{- if and (eq .Status "resolved") (eq .Labels.alertname "ForetokenMetricsTargetDown") -}}
            {{- $text = printf "%s\n%s" $text $targetDownNote -}}
            {{- end -}}
            {{- end -}}
            {{- dict "msg_type" "text" "content" (dict "text" $text) | toJson -}}
