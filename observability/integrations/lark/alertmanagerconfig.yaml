#
# Generated from observability/integrations/webhook.yaml.tmpl by make alert-receivers.
# Optional Alertmanager receiver for Foretoken alerts. The referenced Secret
# and the AlertmanagerConfig must exist in the same namespace.

apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: foretoken-lark
spec:
  route:
    groupBy:
      - alertname
    groupWait: 5s
    groupInterval: 30s
    repeatInterval: 1h
    matchers:
      - name: service
        matchType: "="
        value: foretoken
    receiver: lark
  receivers:
    - name: lark
      webhookConfigs:
        - urlSecret:
            name: foretoken-lark-webhook
            key: url
          sendResolved: true
          maxAlerts: 5
          timeout: 10s
          # Choose zh, en, or bilingual. Local follows the Alertmanager process time zone.
          payload: |
            {{- $language := "zh" -}}
            {{- $timezone := "Local" -}}
            {{- $firing := len .Alerts.Firing }}{{ $resolved := len .Alerts.Resolved }}{{ $shown := len .Alerts -}}
            {{- $lines := list -}}
            {{- $lines = append $lines (dict "zh" "Foretoken 告警通知" "en" "Foretoken alert notification") -}}
            {{- $lines = append $lines (dict "zh" (printf "触发 %d · 解除 %d，本条展示 %d 个目标（每条最多 5 个）" $firing $resolved $shown) "en" (printf "firing %d · resolved %d, showing %d targets (max 5 per message)" $firing $resolved $shown)) -}}
            {{- range .Alerts -}}
            {{- $state := dict "zh" "触发" "en" "firing" -}}
            {{- if eq .Status "resolved" }}{{ $state = dict "zh" "解除" "en" "resolved" }}{{ end -}}
            {{- $lines = append $lines (dict "zh" "" "en" "") -}}
            {{- $nameZh := or .Annotations.alertname_zh .Labels.alertname -}}
            {{- $severityZh := or (index (dict "warning" "警告" "critical" "严重" "info" "提示") .Labels.severity) .Labels.severity -}}
            {{- $lines = append $lines (dict "zh" (printf "[%s] %s" $state.zh $nameZh) "en" (printf "[%s] %s" $state.en .Labels.alertname)) -}}
            {{- $lines = append $lines (dict "zh" (printf "级别：%s" $severityZh) "en" (printf "Severity: %s" .Labels.severity)) -}}
            {{- with .Labels.namespace }}{{ $lines = append $lines (dict "zh" (printf "命名空间：%s" .) "en" (printf "Namespace: %s" .)) }}{{ end -}}
            {{- with .Labels.pod }}{{ $lines = append $lines (dict "zh" (printf "Pod: %s" .) "en" (printf "Pod: %s" .)) }}{{ end -}}
            {{- with .Labels.instance }}{{ $lines = append $lines (dict "zh" (printf "实例：%s" .) "en" (printf "Instance: %s" .)) }}{{ end -}}
            {{- with .Labels.endpoint }}{{ $lines = append $lines (dict "zh" (printf "端点：%s" .) "en" (printf "Endpoint: %s" .)) }}{{ end -}}
            {{- with or .Labels.frontend_service .Labels.inference_foretoken_io_frontend_service }}{{ $lines = append $lines (dict "zh" (printf "前端：%s" .) "en" (printf "Frontend: %s" .)) }}{{ end -}}
            {{- with .Labels.model_service }}{{ $lines = append $lines (dict "zh" (printf "模型服务：%s" .) "en" (printf "Model service: %s" .)) }}{{ end -}}
            {{- with or .Labels.model_group .Labels.inference_foretoken_io_model_group }}{{ $lines = append $lines (dict "zh" (printf "模型组：%s" .) "en" (printf "Model group: %s" .)) }}{{ end -}}
            {{- with or .Labels.model_role .Labels.inference_foretoken_io_model_role }}{{ $lines = append $lines (dict "zh" (printf "模型角色：%s" .) "en" (printf "Model role: %s" .)) }}{{ end -}}
            {{- with or .Labels.pd_pipeline_scope .Labels.inference_foretoken_io_pd_pipeline_scope }}{{ $lines = append $lines (dict "zh" (printf "流水线范围：%s" .) "en" (printf "Pipeline scope: %s" .)) }}{{ end -}}
            {{- $startedAt := .StartsAt | tz $timezone | date "2006-01-02 15:04:05 -0700" -}}
            {{- $lines = append $lines (dict "zh" (printf "告警开始：%s" $startedAt) "en" (printf "Started: %s" $startedAt)) -}}
            {{- if eq .Status "resolved" -}}
            {{- $endedAt := .EndsAt | tz $timezone | date "2006-01-02 15:04:05 -0700" -}}
            {{- $lines = append $lines (dict "zh" (printf "告警解除：%s" $endedAt) "en" (printf "Resolved: %s" $endedAt)) -}}
            {{- end -}}
            {{- $lines = append $lines (dict "zh" (printf "摘要：%s" .Annotations.summary_zh) "en" (printf "Summary: %s" .Annotations.summary)) -}}
            {{- $lines = append $lines (dict "zh" (printf "详情：%s" .Annotations.description_zh) "en" (printf "Details: %s" .Annotations.description)) -}}
            {{- with .Annotations.runbook_url }}{{ $lines = append $lines (dict "zh" (printf "排障手册：%s" .) "en" (printf "Runbook: %s" .)) }}{{ end -}}
            {{- end -}}
            {{- $text := "" -}}
            {{- range $index, $line := $lines -}}
            {{- $rendered := $line.zh -}}
            {{- if eq $language "en" }}{{ $rendered = $line.en }}{{ end -}}
            {{- if and (eq $language "bilingual") (ne $line.zh $line.en) }}{{ $rendered = printf "%s / %s" $line.zh $line.en }}{{ end -}}
            {{- if $index }}{{ $text = printf "%s\n%s" $text $rendered }}{{ else }}{{ $text = $rendered }}{{ end -}}
            {{- end -}}
            {{- dict "msg_type" "text" "content" (dict "text" $text) | toJson -}}
