#
# The CLI supplies namespace, ownership and node placement from this manifest.

apiVersion: v1
kind: Namespace
metadata:
  name: metax-monitor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mx-exporter-metrics
data:
  metrics: |
    gpu_usage,Gauge,mx_gpu_usage,GPU usage in percent,deviceId,uuid,exported_pod,exported_namespace,exported_container,Hostname,driver_version,bios_version,modelName
    memory_usage,Gauge,mx_memory_usage,HBM and system memory usage in percent,deviceId,type,uuid,exported_pod,exported_namespace,exported_container,Hostname,driver_version,bios_version,modelName
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mx-exporter
  labels:
    app.kubernetes.io/name: mx-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mx-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mx-exporter
    spec:
      containers:
        - name: mx-exporter
          image: cr.infini-ai.com/infini/mx-exporter:0.8.1
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command: [python3, -u, -m, mx_exporter]
          args: [-c=/etc/config/metrics, -p=8000, -i=5000, -m=0, -lm=0]
          ports:
            - name: metrics
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 4
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
            - name: pod-resources
              mountPath: /var/lib/kubelet/pod-resources
              readOnly: true
            - name: dri
              mountPath: /dev/dri
            - name: sys-devices
              mountPath: /sys/devices
              readOnly: true
            - name: kernel-debug
              mountPath: /sys/kernel/debug
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mx-exporter-metrics
        - name: pod-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
            type: Directory
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: sys-devices
          hostPath:
            path: /sys/devices
            type: Directory
        - name: kernel-debug
          hostPath:
            path: /sys/kernel/debug
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: mx-exporter
  labels:
    app.kubernetes.io/name: mx-exporter
spec:
  selector:
    app.kubernetes.io/name: mx-exporter
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mx-exporter
  labels:
    app.kubernetes.io/name: mx-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mx-exporter
  endpoints:
    - port: metrics
      interval: 5s
      scrapeTimeout: 4s
