[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foretoken-cli"
version = "0.0.1"
description = "Command-line tools for deploying and evaluating Foretoken services"
readme = "cli/README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Foretoken contributors" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
bench = [
    "datasets>=2.14",
    "evalscope>=1.10",
    "httpx>=0.27",
    "huggingface_hub>=0.23",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "openai>=1.40",
    "tqdm>=4.65",
    "transformers>=4.40",
    "wandb>=0.16",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
foretoken = "foretoken_cli.main:main"

[tool.setuptools]
packages = [
    "foretoken_cli",
    "benchmarks",
    "benchmarks.client",
    "benchmarks.deployment",
    "benchmarks.logger",
    "benchmarks.metrics",
    "benchmarks.report",
    "benchmarks.runner",
    "benchmarks.storage",
    "benchmarks.workload",
]
package-dir = { foretoken_cli = "cli/foretoken_cli", benchmarks = "benchmarks" }
