[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foretoken"
version = "0.0.1a1"
description = "Command-line tools for installing and operating Foretoken"
readme = "cli/README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Foretoken contributors" }]
dependencies = [
    "packaging>=24.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
bench = [
    "datasets>=2.14",
    "evalscope[perf]==1.11.1",
    "httpx>=0.27",
    "huggingface_hub>=0.23",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "openai>=1.40",
    "tqdm>=4.65",
    "transformers>=4.40",
    "wandb>=0.19.10",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
foretoken = "foretoken.main:main"

[tool.setuptools]
packages = [
    "foretoken",
    "foretoken.accelerators",
    "foretoken.platform",
    "benchmarks",
    "benchmarks.config",
    "benchmarks.workloads",
    "benchmarks.load",
    "benchmarks.experiments",
    "benchmarks.reporting",
]
package-dir = { foretoken = "cli/foretoken", benchmarks = "benchmarks" }
