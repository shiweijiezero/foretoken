[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foretoken"
version = "0.1.0"
description = "LLM inference orchestration for SLO/SLA and heterogeneous accelerators"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Foretoken contributors" }]
keywords = ["llm", "benchmark", "inference", "vllm", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiohttp>=3.9",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "tqdm>=4.65",
    "transformers>=4.40",
]

[project.optional-dependencies]
evalscope = [
    "evalscope",
]
vllm = [
    "pandas>=2.0",
    "seaborn>=0.13",
    "vllm",
]
wandb = [
    "evalscope",
    "wandb",
]
all = [
    "foretoken[evalscope,vllm,wandb]",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
foretoken = "benchmarks.main:main"

[project.urls]
Homepage = "https://github.com/2GeTi/foretoken"
Repository = "https://github.com/2GeTi/foretoken"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmarks*"]

[tool.setuptools.package-data]
benchmarks = ["examples/*.json"]
