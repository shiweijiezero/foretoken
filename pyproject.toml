[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foretoken"
version = "0.0.3"
description = "Command-line tools for installing and operating Foretoken"
readme = "cli/README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Foretoken contributors" }]
dependencies = [
    "datasets>=2.14",
    "evalscope[perf]==1.11.1",
    "httpx>=0.27",
    "huggingface_hub>=0.23",
    "lm-eval[api]==0.4.13",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "openai>=1.40",
    "packaging>=24.0",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    "transformers>=4.40",
    "wandb>=0.19.10",
]

[project.optional-dependencies]
dev = [
    "grafana-foundation-sdk==1769699379!11.6.0",
    "pytest>=7.0",
]

[project.scripts]
foretoken = "foretoken.main:main"

[tool.setuptools]
packages = [
    "foretoken",
    "foretoken.accelerators",
    "foretoken.platform",
    "foretoken.profiling",
    "benchmarks",
    "benchmarks.config",
    "benchmarks.datasets",
    "benchmarks.runs",
    "benchmarks.sweeps",
    "benchmarks.integrations",
    "benchmarks.scoring",
    "benchmarks.profiling",
    "benchmarks.results",
]
package-dir = { foretoken = "cli/foretoken", benchmarks = "benchmarks" }

[tool.setuptools.package-data]
"foretoken.profiling" = ["viewer.html"]
"foretoken.accelerators" = ["mx-exporter.yaml"]
