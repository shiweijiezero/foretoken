[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foretoken"
version = "0.0.0"
description = "Value-aware KV management, MTP control, and goodput-driven evaluation on top of vLLM (zero-fork, out-of-tree plugins)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
    "vllm>=0.22",      # 推理引擎(bench/engine.py 进程内自起 AsyncLLM);cu wheel 随 GPU driver 选,PyPI 默认 cu13 需 driver 580+
    "ninja>=1.11",     # vLLM inductor 编译 / cudagraph capture 需要
    "datasets>=2.20",  # 读 trace / 对话内容(data_prepare/)
    "pyarrow>=15",     # 打包评测数据集 parquet(data_prepare/build_dataset.py)
    "matplotlib>=3.8", # 实验记录出图(bench/report/)
    "openai>=1.40",    # API 形式回放:打 vllm serve 的 /v1/chat/completions(bench/core/backend.py)
    "pytest>=8",       # 单测 / 正确性子集
    "ruff>=0.6",       # lint + format
    "mypy>=1.11",      # 类型检查
    "pre-commit>=3.5", # 提交前钩子
]

# P1 起,插件经 entry_points / spec_module_path 接入(占位;实现后取消注释并指向真实类,见 docs/08)。
# [project.entry-points."vllm.general_plugins"]
# foretoken = "foretoken.plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["src/foretoken"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src/foretoken"]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["vllm.*", "datasets.*", "matplotlib.*", "torch.*", "pyarrow.*", "mplfonts.*", "cycler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]                  # 不装包也能 import foretoken(本地开发友好)
addopts = "--import-mode=importlib"   # 允许同名 test 文件(无需 __init__.py)
markers = [
    "slow: 起 GPU / 端到端(不进 pre-commit;手动或 CI)",
    "lossless: 无损校验(开优化 == 原生 vLLM)",
    "determinism: 确定性 / batch-invariance",
    "eval: 评测正确性 gate(门槛零 / PFOO)",
]
