[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "foretoken"
version = "0.0.4"
description = "Command-line tools for installing and operating Foretoken"
readme = "cli/README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Foretoken contributors" }]
dependencies = [
    "datasets>=2.14",
    "ddsketch>=3.0",
    "evalscope[perf]==1.11.1",
    "httpx>=0.27",
    "huggingface_hub>=1.30",
    "ijson>=3.2",
    "kubernetes>=36.0",
    # Keep EvalScope on the release recommended after the LiteLLM publishing compromise.
    "litellm==1.106.2",
    "lm-eval[api]==0.4.13",
    "loguru>=0.7.3",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "openai>=1.40",
    "packaging>=24.0",
    "portalocker>=3.2",
    "prometheus-client>=0.26",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "tabulate[widechars]>=0.9",
    "tqdm>=4.65",
    "transformers>=4.40",
    "wandb>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "grafana-foundation-sdk==1769699379!11.6.0",
]

[project.scripts]
foretoken = "foretoken.main:main"

[tool.hatch.build.targets.wheel]
packages = ["cli/foretoken", "benchmarks/src/benchmarks"]

[tool.hatch.build.targets.sdist]
include = ["/cli", "/benchmarks", "/pyproject.toml", "/LICENSE"]
