#
# Defines conservative, actionable Foretoken alerts over scrape and recording-rule signals.

groups:
  - name: foretoken.alerting
    rules:
      - alert: ForetokenMetricsTargetDown
        expr: |
          (
            up{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service!="", inference_foretoken_io_frontend_service="foretoken_alert_frontend"} == 0
          )
          or
          (
            up{endpoint="model-server", namespace="foretoken_alert_namespace", inference_foretoken_io_model_group!="", inference_foretoken_io_model_group=~"foretoken_alert_model_groups"} == 0
          )
        for: 1m
        labels:
          service: foretoken
          severity: warning
        annotations:
          alertname_zh: 'Foretoken 指标目标不可用'
          summary: 'Foretoken metrics target {{ $labels.endpoint }} is unavailable'
          summary_zh: 'Foretoken 指标目标 {{ $labels.endpoint }} 不可用'
          description: 'Prometheus has been unable to scrape {{ $labels.endpoint }} at {{ $labels.instance }} in namespace {{ $labels.namespace }} for 1 minute.'
          description_zh: 'Prometheus 已连续 1 分钟无法抓取命名空间 {{ $labels.namespace }} 中 {{ $labels.instance }} 的 {{ $labels.endpoint }} 指标。'
          runbook_url: 'https://github.com/shiweijiezero/foretoken/blob/main/observability/runbooks/alerts.md#foretokenmetricstargetdown'

      - alert: ForetokenFrontendHTTPResponseStart5xxRatioHigh
        expr: |
          (
            foretoken:frontend_http_response_start_5xx_ratio:rate5m{namespace="foretoken_alert_namespace", frontend_service="foretoken_alert_frontend"} > 0.05
          )
          and on (namespace, frontend_service)
          (
            sum by (namespace, frontend_service) (
              foretoken:frontend_http_response_starts:rate5m{namespace="foretoken_alert_namespace", frontend_service="foretoken_alert_frontend"}
            ) >= 0.1
          )
        for: 2m
        labels:
          service: foretoken
          severity: warning
        annotations:
          alertname_zh: 'Foretoken 前端响应开始阶段 5xx 比例过高'
          summary: 'Frontend {{ $labels.frontend_service }} response-start 5xx ratio is high'
          summary_zh: '前端 {{ $labels.frontend_service }} 响应开始 5xx 比例过高'
          description: 'More than 5% of HTTP response starts for Frontend {{ $labels.frontend_service }} have been 5xx for 2 minutes with at least 0.1 response starts per second.'
          description_zh: '前端 {{ $labels.frontend_service }} 的 HTTP 响应开始事件中，5xx 比例在每秒至少 0.1 个响应开始事件的流量下连续 2 分钟超过 5%。'
          runbook_url: 'https://github.com/shiweijiezero/foretoken/blob/main/observability/runbooks/alerts.md#foretokenfrontendhttpresponsestart5xxratiohigh'

      - alert: ForetokenNVIDIAGPUTemperatureHigh
        expr: foretoken:accelerator_gpu_temperature_celsius{namespace="foretoken_alert_namespace", model_group=~"foretoken_alert_model_groups", vendor="nvidia"} >= foretoken_alert_threshold_nvidia_temperature_celsius
        for: 2m
        labels:
          service: foretoken
          severity: warning
        annotations:
          alertname_zh: 'Foretoken NVIDIA GPU 温度过高'
          summary: 'NVIDIA GPU {{ $labels.device_id }} temperature is high'
          summary_zh: 'NVIDIA GPU {{ $labels.device_id }} 温度过高'
          description: 'NVIDIA GPU {{ $labels.device_id }} temperature is {{ $value | printf "%.1f" }}°C, at or above threshold foretoken_alert_threshold_nvidia_temperature_celsius°C for 2 minutes.'
          description_zh: 'NVIDIA GPU {{ $labels.device_id }} 温度为 {{ $value | printf "%.1f" }}°C，已达到或超过阈值 foretoken_alert_threshold_nvidia_temperature_celsius°C，持续 2 分钟。'
          runbook_url: 'https://github.com/shiweijiezero/foretoken/blob/main/observability/runbooks/alerts.md#foretokennvidiagputemperaturehigh'

      - alert: ForetokenNVIDIAGPUPowerUsageHigh
        expr: foretoken:accelerator_gpu_power_watts{namespace="foretoken_alert_namespace", model_group=~"foretoken_alert_model_groups", vendor="nvidia"} >= foretoken_alert_threshold_nvidia_power_watts
        for: 5m
        labels:
          service: foretoken
          severity: warning
        annotations:
          alertname_zh: 'Foretoken NVIDIA GPU 功耗过高'
          summary: 'NVIDIA GPU {{ $labels.device_id }} power usage is high'
          summary_zh: 'NVIDIA GPU {{ $labels.device_id }} 功耗过高'
          description: 'NVIDIA GPU {{ $labels.device_id }} power usage is {{ $value | printf "%.1f" }} W, at or above threshold foretoken_alert_threshold_nvidia_power_watts W for 5 minutes.'
          description_zh: 'NVIDIA GPU {{ $labels.device_id }} 功耗为 {{ $value | printf "%.1f" }} W，已达到或超过阈值 foretoken_alert_threshold_nvidia_power_watts W，持续 5 分钟。'
          runbook_url: 'https://github.com/shiweijiezero/foretoken/blob/main/observability/runbooks/alerts.md#foretokennvidiagpupowerusagehigh'

      # The 1s ranges keep this catalogue valid PromQL; Render replaces them with the configured window.
      - alert: ForetokenAdmissionCapacityRejectionRatioHigh
        expr: |
          (
            sum by (foretoken_alert_admission_grouping) (
              rate(foretoken_admission_results_total{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend", origin="http", result="capacity_rejected"}[1s])
            )
            /
            sum by (foretoken_alert_admission_grouping) (
              rate(foretoken_admission_results_total{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend", origin="http"}[1s])
            )
          ) > foretoken_alert_threshold_capacity_rejection_ratio
          and on (foretoken_alert_admission_grouping)
          sum by (foretoken_alert_admission_grouping) (
            rate(foretoken_admission_results_total{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend", origin="http"}[1s])
          ) >= foretoken_alert_threshold_min_result_rate
        labels:
          service: foretoken
          severity: warning
        annotations:
          alertname_zh: 'Foretoken 准入容量拒绝比例过高'
          summary: 'Frontend {{ $labels.frontend_service }} model {{ $labels.model_name }} capacity rejection ratio is high'
          summary_zh: '前端 {{ $labels.frontend_service }} 的模型 {{ $labels.model_name }} 准入容量拒绝比例过高'
          description: 'HTTP admission capacity rejection ratio is {{ $value | printf "%.3f" }} in {{ $labels.scope }} scope. Inspect effective model limits and Pod admission results.'
          description_zh: '在 {{ $labels.scope }} 作用域内，HTTP 准入容量拒绝比例为 {{ $value | printf "%.3f" }}。请查看模型生效上限及各 Pod 的准入结果。'
          runbook_url: 'https://github.com/shiweijiezero/foretoken/blob/main/observability/runbooks/alerts.md#foretokenadmissioncapacityrejectionratiohigh'

      - alert: ForetokenAdmissionTimeoutRatioHigh
        expr: |
          (
            sum by (foretoken_alert_admission_grouping) (
              rate(foretoken_admission_results_total{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend", origin="http", result=~"queue_timeout|deadline_exceeded"}[1s])
            )
            /
            sum by (foretoken_alert_admission_grouping) (
              rate(foretoken_admission_results_total{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend", origin="http"}[1s])
            )
          ) > foretoken_alert_threshold_timeout_ratio
          and on (foretoken_alert_admission_grouping)
          sum by (foretoken_alert_admission_grouping) (
            rate(foretoken_admission_results_total{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend", origin="http"}[1s])
          ) >= foretoken_alert_threshold_min_result_rate
        labels:
          service: foretoken
          severity: warning
        annotations:
          alertname_zh: 'Foretoken 工作准入超时比例过高'
          summary: 'Frontend {{ $labels.frontend_service }} model {{ $labels.model_name }} admission timeout ratio is high'
          summary_zh: '前端 {{ $labels.frontend_service }} 的模型 {{ $labels.model_name }} 准入超时比例过高'
          description: 'HTTP work admission timeout ratio is {{ $value | printf "%.3f" }} in {{ $labels.scope }} scope. Compare queue timeouts with request deadlines before admission completes.'
          description_zh: '在 {{ $labels.scope }} 作用域内，HTTP 工作准入超时比例为 {{ $value | printf "%.3f" }}。请区分队列等待超时与获准前请求预算耗尽。'
          runbook_url: 'https://github.com/shiweijiezero/foretoken/blob/main/observability/runbooks/alerts.md#foretokenadmissiontimeoutratiohigh'

      - alert: ForetokenAdmissionAdmittedQueueP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (foretoken_alert_admission_grouping, le) (
              rate(foretoken_admission_queue_wait_seconds_bucket{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend", origin="http", result="admitted"}[1s])
            )
          ) > foretoken_alert_threshold_admitted_queue_p95_seconds
          and on (foretoken_alert_admission_grouping)
          sum by (foretoken_alert_admission_grouping) (
            rate(foretoken_admission_queue_wait_seconds_count{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend", origin="http", result="admitted"}[1s])
          ) >= foretoken_alert_threshold_min_queued_admission_rate
        labels:
          service: foretoken
          severity: warning
        annotations:
          alertname_zh: 'Foretoken 获准排队 p95 过高'
          summary: 'Frontend {{ $labels.frontend_service }} model {{ $labels.model_name }} admitted queue p95 is high'
          summary_zh: '前端 {{ $labels.frontend_service }} 的模型 {{ $labels.model_name }} 获准排队 p95 过高'
          description: 'HTTP requests that queued and were admitted waited {{ $value | printf "%.3f" }} seconds at p95 in {{ $labels.scope }} scope. Inspect queued work and backend capacity.'
          description_zh: '在 {{ $labels.scope }} 作用域内，实际排队后获准的 HTTP 调用等待 p95 为 {{ $value | printf "%.3f" }} 秒。请查看排队工作量和后端容量。'
          runbook_url: 'https://github.com/shiweijiezero/foretoken/blob/main/observability/runbooks/alerts.md#foretokenadmissionadmittedqueuep95high'

      # Inventory comes from publication, not observed rule series. Empty catalogs are valid.
      - alert: ForetokenAdmissionTelemetryMissing
        expr: |
          (
            (
              foretoken_admission_model_info{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend"}
              unless on (namespace, pod, instance, model_name)
              (
                (
                  foretoken_admission_info{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend", algorithm!="concurrency"}
                  or
                  (
                    foretoken_admission_info{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend", algorithm="concurrency"}
                    and on (namespace, pod, instance, model_name)
                    foretoken_admission_active_work_units{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend"}
                    and on (namespace, pod, instance, model_name)
                    foretoken_admission_queued_work_units{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend"}
                    and on (namespace, pod, instance, model_name)
                    foretoken_admission_concurrency_limit_work_units{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend"}
                    and on (namespace, pod, instance, model_name)
                    foretoken_admission_queue_limit_work_units{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend"}
                  )
                )
                and on (namespace, pod, instance, model_name)
                foretoken_admission_draining{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend"}
                and on (namespace, pod, instance, model_name)
                foretoken_admission_attempts_total{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend", origin="http"}
                and on (namespace, pod, instance, model_name)
                foretoken_admission_results_total{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend", origin="http", result="admitted"}
              )
            )
            or
            (
              foretoken_admission_configured_models{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend"}
              != on (namespace, pod, instance)
              (count by (namespace, pod, instance) (foretoken_admission_model_info{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend"}) or on (namespace, pod, instance) (0 * foretoken_admission_configured_models{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend"}))
            )
            or
            (up{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend"} == 1 unless on (namespace, pod, instance) foretoken_admission_configured_models{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend"})
          ) and on (namespace, pod, instance) (up{endpoint="http", namespace="foretoken_alert_namespace", inference_foretoken_io_frontend_service="foretoken_alert_frontend"} == 1)
        for: 5m
        labels:
          service: foretoken
          severity: warning
          scope: pod
        annotations:
          alertname_zh: 'Foretoken 准入指标不完整'
          summary: 'Frontend {{ $labels.frontend_service }} Pod {{ $labels.pod }} {{ $labels.model_name }} admission telemetry is incomplete'
          summary_zh: '前端 {{ $labels.frontend_service }} 的 Pod {{ $labels.pod }} {{ $labels.model_name }} 准入指标不完整'
          description: 'Scraping succeeds, but required admission telemetry has been missing for 5 minutes. Check Pod runtime versions and metric coverage; this does not indicate inference unavailability.'
          description_zh: '指标抓取成功，但必要准入指标已缺失 5 分钟。请核对 Pod 运行版本和指标覆盖情况；此告警不表示推理不可用。'
          runbook_url: 'https://github.com/shiweijiezero/foretoken/blob/main/observability/runbooks/alerts.md#foretokenadmissiontelemetrymissing'
