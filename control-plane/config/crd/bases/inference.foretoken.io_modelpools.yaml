                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              template:
                description: |-
                  NormalizedPoolTemplate is the normalized contract produced from ModelService intent.
                  Platform runtime and accelerator resolution may further constrain it before Groups are created.
                properties:
                  backend:
                    enum:
                    - vllm
                    type: string
                  extraArgs:
                    description: ExtraArgs are backend flags that the concrete adapter
                      must validate before Group creation.
                    items:
                      description: BackendArg is one backend command-line flag.
                      maxLength: 4096
                      minLength: 2
                      pattern: ^--
                      type: string
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: atomic
                  memberCount:
                    format: int32
                    minimum: 1
                    type: integer
                  model:
                    maxLength: 1024
                    minLength: 1
                    type: string
                  network:
                    maxLength: 128
                    minLength: 1
                    pattern: ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
                    type: string
                  nodeCount:
                    format: int32
                    minimum: 1
                    type: integer
                  parallelism:
                    description: |-
                      CompiledParallelism defines an explicit execution topology compiled from user intent.
                      Unlike user input, DP is always present and may coexist with EP as its derived value.
                    properties:
                      dcp:
                        format: int32
                        minimum: 1
                        type: integer
                      dp:
                        format: int32
                        minimum: 1
                        type: integer
                      ep:
                        description: ExpertParallelism defines expert-parallel execution
                          for one ModelGroup.
                        properties:
                          backend:
                            maxLength: 128
                            minLength: 1
                            type: string
                          eplb:
                            default: false
                            type: boolean
                          size:
                            format: int32
                            minimum: 1
                            type: integer
                        required:
                        - size
                        type: object
                      pcp:
                        format: int32
                        minimum: 1
                        type: integer
                      pp:
                        format: int32
                        minimum: 1
                        type: integer
                      tp:
                        format: int32
                        minimum: 1
                        type: integer
                    required:
                    - dcp
                    - dp
                    - pcp
                    - pp
                    - tp
                    type: object
                    x-kubernetes-validations:
                    - message: parallelism.ep.size must be divisible by parallelism.tp
                        * parallelism.pcp
                      rule: '!has(self.ep) || self.ep.size % (self.tp * self.pcp)
                        == 0'
                    - message: parallelism.dp must equal the value derived from parallelism.ep.size
                      rule: '!has(self.ep) || self.dp == self.ep.size / (self.tp *
                        self.pcp)'
                    - message: parallelism.pcp greater than 1 is incompatible with
                        parallelism.dp greater than 1
                      rule: self.pcp == 1 || self.dp == 1
                    - message: parallelism.dcp is incompatible with parallelism.tp
                        and parallelism.pcp
                      rule: 'self.pcp == 1 ? self.tp % self.dcp == 0 : self.dcp ==
                        1 || self.dcp == self.pcp || self.dcp == self.tp * self.pcp'
                  resources:
                    description: ModelResources defines resources for one runtime
                      member Pod.
                    properties:
                      limits:
                        description: ComputeResourceLimits defines optional CPU and
                          memory limits for one Pod.
                        properties:
                          cpu:
                            description: CPU is the maximum Kubernetes CPU quantity.
                            maxLength: 64
                            minLength: 1
                            type: string
                            x-kubernetes-validations:
                            - message: must be a valid non-negative Kubernetes resource
