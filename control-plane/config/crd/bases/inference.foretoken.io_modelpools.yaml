apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: modelpools.inference.foretoken.io
spec:
  group: inference.foretoken.io
  names:
    kind: ModelPool
    listKind: ModelPoolList
    plural: modelpools
    singular: modelpool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.template.role
      name: Role
      type: string
    - jsonPath: .spec.desiredGroups
      name: Desired
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelPool is a read-only execution fleet materialized from ModelService
          intent.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelPoolSpec is the controller-owned desired state compiled
              from ModelService.
            properties:
              desiredGroups:
                description: DesiredGroups is the number of complete ModelGroups requested
                  for this Pool.
                format: int32
                minimum: 0
                type: integer
              modelServiceRef:
                description: LocalObjectReference identifies an object in the same
