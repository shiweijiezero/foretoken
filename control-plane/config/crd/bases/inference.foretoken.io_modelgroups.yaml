                    * parallelism.pcp
                  rule: '!has(self.ep) || self.ep.size % (self.tp * self.pcp) == 0'
                - message: parallelism.dp must equal the value derived from parallelism.ep.size
                  rule: '!has(self.ep) || self.dp == self.ep.size / (self.tp * self.pcp)'
                - message: parallelism.pcp greater than 1 is incompatible with parallelism.dp
