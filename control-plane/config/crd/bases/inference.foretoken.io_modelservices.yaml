                              minLength: 1
                              type: string
                              x-kubernetes-validations:
                              - message: must be a valid non-negative Kubernetes resource
                                  quantity
                                rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                  >= 0
                          type: object
                        requests:
                          description: ModelResourceRequests defines resources requested
                            by one runtime member Pod.
                          properties:
                            cpu:
                              description: CPU is the requested Kubernetes CPU quantity.
                              maxLength: 64
                              minLength: 1
                              type: string
                              x-kubernetes-validations:
                              - message: must be a valid non-negative Kubernetes resource
                                  quantity
                                rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                  >= 0
                            gpu:
                              description: GPURequest defines the logical GPU request
                                for one runtime member Pod.
                              properties:
                                count:
                                  default: 1
                                  description: Count is the number of GPUs requested
                                    by one runtime member Pod.
                                  format: int32
                                  minimum: 1
                                  type: integer
                                type:
                                  default: auto
                                  description: Type is a platform-registered GPU type
