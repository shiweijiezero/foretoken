#
# Defines a generated Kubernetes API manifest for Foretoken custom resources.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: modelservices.inference.foretoken.io
spec:
  group: inference.foretoken.io
  names:
    kind: ModelService
    listKind: ModelServiceList
    plural: modelservices
    singular: modelservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.backend
      name: Backend
      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelService is the user-owned model serving API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelServiceSpec defines the desired state of a model service.
            properties:
              autoscaling:
                description: |-
                  Autoscaling is evaluated by the ModelService controller. Algorithms remain
                  side-effect-free; lifecycle, bounds, rollout, and drain stay core-owned.
                properties:
                  adjustment:
                    description: ModelAutoscalingAdjustmentConfig configures how desired
                      replica capacity is applied.
                    properties:
                      algorithm:
                        default: step
                        description: AutoscalingAdjustmentAlgorithm selects how a
                          desired replica count is stabilized before lifecycle resolution.
                        enum:
                        - direct
                        - step
                        type: string
                      scaleDown:
                        description: ModelAutoscalingScaleDownConfig controls downward
                          stabilization.
                        properties:
                          stabilizationWindow:
                            default: 300s
                            description: NonNegativeDuration is a Go-style duration
                              that may be zero.
                            minLength: 2
                            pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                            type: string
                            x-kubernetes-validations:
                            - message: must be a non-negative duration
                              rule: duration(self) >= duration('0s')
                        type: object
                      scaleUp:
                        description: ModelAutoscalingScaleUpConfig controls upward
                          stabilization.
                        properties:
                          stabilizationWindow:
                            default: 0s
                            description: NonNegativeDuration is a Go-style duration
                              that may be zero.
                            minLength: 2
                            pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                            type: string
                            x-kubernetes-validations:
                            - message: must be a non-negative duration
                              rule: duration(self) >= duration('0s')
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: direct adjustment does not accept scaleUp or scaleDown
                        configuration
                      rule: self.algorithm != 'direct' || (!has(self.scaleUp) && !has(self.scaleDown))
                  decision:
                    description: ModelAutoscalingDecisionConfig configures desired-capacity
                      calculation.
                    properties:
                      algorithm:
                        description: AutoscalingDecisionAlgorithm selects how observed
                          demand is converted into desired replica capacity.
                        enum:
                        - queue
                        - queue_threshold
                        type: string
                      queue:
                        description: ModelAutoscalingQueueDecisionConfig configures
                          HPA-style average queue capacity.
                        properties:
                          targetAverageQueuedRequests:
                            default: 1
                            description: TargetAverageQueuedRequests is the desired
                              average waiting requests per replica.
                            format: int64
                            minimum: 1
                            type: integer
                        type: object
                      queueThreshold:
                        description: ModelAutoscalingQueueThresholdDecisionConfig
                          configures absolute backlog boundaries.
                        properties:
                          scaleDownQueuedRequests:
                            default: 0
                            description: ScaleDownQueuedRequests is the queue depth
                              at or below which one fewer idle replica is recommended.
                            format: int64
                            minimum: 0
                            type: integer
                          scaleUpQueuedRequests:
                            default: 1
                            description: ScaleUpQueuedRequests is the queue depth
                              above which one additional replica is recommended.
                            format: int64
                            minimum: 0
                            type: integer
                        type: object
                        x-kubernetes-validations:
                        - message: scaleDownQueuedRequests must not exceed scaleUpQueuedRequests
                          rule: self.scaleDownQueuedRequests <= self.scaleUpQueuedRequests
                    required:
                    - algorithm
                    type: object
                    x-kubernetes-validations:
                    - message: autoscaling decision must configure exactly the selected
                        algorithm
                      rule: 'self.algorithm == ''queue'' ? has(self.queue) && !has(self.queueThreshold)
                        : has(self.queueThreshold) && !has(self.queue)'
                  maxReplicas:
                    format: int32
                    minimum: 1
                    type: integer
                  minReplicas:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                  trigger:
                    default: {}
                    description: Trigger may be omitted to use periodic evaluation
                      every five seconds.
                    properties:
                      algorithm:
                        default: periodic
                        description: AutoscalingTriggerAlgorithm selects how observations
                          enter automatic capacity evaluation.
                        enum:
                        - periodic
                        type: string
                      interval:
                        default: 5s
                        description: Interval controls how often the controller runs
                          the Trigger stage.
                        minLength: 2
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                        type: string
                        x-kubernetes-validations:
                        - message: must be a positive duration
                          rule: duration(self) > duration('0s')
                    type: object
                required:
                - decision
                - maxReplicas
                type: object
                x-kubernetes-validations:
                - message: autoscaling minReplicas must not exceed maxReplicas
                  rule: self.minReplicas <= self.maxReplicas
              backend:
                enum:
                - vllm
                type: string
              ecProfile:
                description: ECProfile selects the platform-maintained EC runtime
                  for a complete E/P/D topology.
                properties:
                  profile:
                    maxLength: 256
                    minLength: 1
                    type: string
                required:
                - profile
                type: object
              extraArgs:
                description: ExtraArgs are inference-engine CLI flags shared by every
                  compiled Pool.
                items:
                  description: |-
                    BackendArg is one long-form CLI argument passed to the inference engine.
                    The vLLM adapter accepts max-model-len, dtype, quantization, gpu-memory-utilization,
                    max-num-seqs, max-num-batched-tokens, limit-mm-per-prompt, enforce-eager, and
                    disable-log-stats. This schema rejects spaces, aliases, and positional arguments.
                  maxLength: 4096
                  minLength: 3
                  pattern: ^--[a-z][a-z0-9-]*(=[^[:space:]]+)?$
                  type: string
                maxItems: 256
                type: array
                x-kubernetes-list-type: atomic
              features:
                description: Features declares explicit opt-in capabilities for the
                  default Pool.
                properties:
                  multimodal:
                    items:
                      description: MultimodalModality identifies one non-text input
                        modality supported by a model.
                      enum:
                      - image
                      type: string
                    maxItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  reasoning:
                    type: boolean
                  structuredOutputs:
                    items:
                      description: StructuredOutputFormat identifies a structured
                        response format supported by a model.
                      enum:
                      - jsonObject
                      - jsonSchema
                      type: string
                    maxItems: 2
                    type: array
                    x-kubernetes-list-type: set
                  tools:
                    type: boolean
                type: object
              internalGenerateRequestBodyLimitBytes:
                default: 67108864
                description: |-
                  InternalGenerateRequestBodyLimitBytes is the maximum body size accepted by
                  a group-local generate endpoint. It defaults to 64 MiB.
                format: int64
                maximum: 268435456
                minimum: 1048576
                type: integer
              kvCache:
                description: KVCache is the typed cache-placement intent for the Quick
                  Start shorthand.
                properties:
                  mooncakeStore:
                    description: MooncakeStore selects either an external platform
                      profile or a Foretoken-owned KVService.
                    properties:
                      kvServiceRef:
                        description: KVServiceReference identifies a same-namespace
                          KVService by user-facing name only.
                        properties:
                          name:
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      profile:
                        maxLength: 256
                        minLength: 1
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of profile or kvServiceRef is required
                      rule: has(self.profile) != has(self.kvServiceRef)
                  offload:
                    description: KVOffload defines local CPU and optionally filesystem-backed
                      KV offload.
                    properties:
                      cpuCacheSize:
                        allOf:
                        - minLength: 1
                        - minLength: 1
                        description: CPUCacheSize is the CPU tier capacity available
                          to vLLM.
                        maxLength: 64
                        type: string
                        x-kubernetes-validations:
                        - message: must be a valid non-negative Kubernetes resource
                            quantity
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                            >= 0
                      filesystem:
                        type: boolean
                    required:
                    - cpuCacheSize
                    type: object
                type: object
                x-kubernetes-validations:
                - message: kvCache.offload and kvCache.mooncakeStore are mutually
                    exclusive
                  rule: '!(has(self.offload) && has(self.mooncakeStore))'
              maxInputTokens:
                description: MaxInputTokens is the prompt admission limit for requests
                  routed to the default Pool.
                format: int32
                minimum: 1
                type: integer
              model:
                maxLength: 1024
                minLength: 1
                type: string
              modelPools:
                description: ModelPools defines up to 32 advanced execution Pools
                  instead of the top-level shorthand.
                items:
                  description: |-
                    ModelPoolTemplate defines one user-owned execution Pool: a homogeneous set
                    of ModelGroups sharing the same role, network, resources, and parallelism.
                    The controller instantiates it as a ModelPool owned by the ModelService.
                  properties:
                    features:
                      description: Features declares explicit opt-in capabilities
                        for this Pool.
                      properties:
                        multimodal:
                          items:
                            description: MultimodalModality identifies one non-text
                              input modality supported by a model.
                            enum:
                            - image
                            type: string
                          maxItems: 1
                          type: array
                          x-kubernetes-list-type: set
                        reasoning:
                          type: boolean
                        structuredOutputs:
                          items:
                            description: StructuredOutputFormat identifies a structured
                              response format supported by a model.
                            enum:
                            - jsonObject
                            - jsonSchema
                            type: string
                          maxItems: 2
                          type: array
                          x-kubernetes-list-type: set
                        tools:
                          type: boolean
                      type: object
                    kvCache:
                      description: KVCache defines typed KV-cache placement intent
                        for one execution Pool.
                      properties:
                        mooncakeStore:
                          description: MooncakeStore selects either an external platform
                            profile or a Foretoken-owned KVService.
                          properties:
                            kvServiceRef:
                              description: KVServiceReference identifies a same-namespace
                                KVService by user-facing name only.
                              properties:
                                name:
                                  minLength: 1
                                  type: string
                              required:
                              - name
                              type: object
                            profile:
                              maxLength: 256
                              minLength: 1
                              type: string
                          type: object
                          x-kubernetes-validations:
                          - message: exactly one of profile or kvServiceRef is required
                            rule: has(self.profile) != has(self.kvServiceRef)
                        offload:
                          description: KVOffload defines local CPU and optionally
                            filesystem-backed KV offload.
                          properties:
                            cpuCacheSize:
                              allOf:
                              - minLength: 1
                              - minLength: 1
                              description: CPUCacheSize is the CPU tier capacity available
                                to vLLM.
                              maxLength: 64
                              type: string
                              x-kubernetes-validations:
                              - message: must be a valid non-negative Kubernetes resource
                                  quantity
                                rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                  >= 0
                            filesystem:
                              type: boolean
                          required:
                          - cpuCacheSize
                          type: object
                      type: object
                      x-kubernetes-validations:
                      - message: kvCache.offload and kvCache.mooncakeStore are mutually
                          exclusive
                        rule: '!(has(self.offload) && has(self.mooncakeStore))'
                    maxInputTokens:
                      description: MaxInputTokens is the prompt admission limit for
                        requests routed to this Pool.
                      format: int32
                      minimum: 1
                      type: integer
                    name:
                      description: Name is the stable identity of this Pool within
                        one ModelService.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    network:
                      maxLength: 128
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
                      type: string
                    nodes:
                      default: 1
                      description: Nodes is the number of physical Kubernetes Nodes
                        used by each ModelGroup.
                      format: int32
                      maximum: 1
                      minimum: 1
                      type: integer
                    parallelism:
                      description: Parallelism defines the execution topology of one
                        ModelGroup.
                      properties:
                        dcp:
                          default: 1
                          format: int32
                          minimum: 1
                          type: integer
                        dp:
                          format: int32
                          minimum: 1
                          type: integer
                        ep:
                          description: ExpertParallelism defines expert-parallel execution
                            for one ModelGroup.
                          properties:
                            backend:
                              maxLength: 128
                              minLength: 1
                              type: string
                            eplb:
                              default: false
                              type: boolean
                            size:
                              format: int32
                              minimum: 1
                              type: integer
                          required:
                          - size
                          type: object
                        pcp:
                          default: 1
                          format: int32
                          minimum: 1
                          type: integer
                        pp:
                          default: 1
                          format: int32
                          minimum: 1
                          type: integer
                        tp:
                          default: 1
                          format: int32
                          minimum: 1
                          type: integer
                      type: object
                      x-kubernetes-validations:
                      - message: parallelism.dp and parallelism.ep are mutually exclusive
                        rule: '!has(self.dp) || !has(self.ep)'
                      - message: parallelism.ep.size must be divisible by parallelism.tp
                          * parallelism.pcp
                        rule: '!has(self.ep) || self.ep.size % (self.tp * self.pcp)
                          == 0'
                      - message: parallelism.pcp greater than 1 is incompatible with
                          parallelism.dp greater than 1
                        rule: self.pcp == 1 || !has(self.dp) || self.dp == 1
                      - message: parallelism.ep.size must equal parallelism.tp * parallelism.pcp
                          when parallelism.pcp is greater than 1
                        rule: self.pcp == 1 || !has(self.ep) || self.ep.size == self.tp
                          * self.pcp
                      - message: parallelism.dcp is incompatible with parallelism.tp
                          and parallelism.pcp
                        rule: 'self.pcp == 1 ? self.tp % self.dcp == 0 : self.dcp
                          == 1 || self.dcp == self.pcp || self.dcp == self.tp * self.pcp'
                    replicas:
                      default: 1
                      description: Replicas is the number of complete ModelGroups
                        in this Pool.
                      format: int32
                      minimum: 0
                      type: integer
                    resources:
                      description: ModelResources defines resources for one runtime
                        member Pod.
                      properties:
                        limits:
                          description: ComputeResourceLimits defines optional CPU
                            and memory limits for one Pod.
                          properties:
                            cpu:
                              description: CPU is the maximum Kubernetes CPU quantity.
                              maxLength: 64
                              minLength: 1
                              type: string
                              x-kubernetes-validations:
                              - message: must be a valid non-negative Kubernetes resource
                                  quantity
                                rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                  >= 0
                            memory:
                              description: Memory is the maximum Kubernetes memory
                                quantity.
                              maxLength: 64
                              minLength: 1
                              type: string
                              x-kubernetes-validations:
                              - message: must be a valid non-negative Kubernetes resource
                                  quantity
                                rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                  >= 0
                          type: object
                        requests:
                          description: ModelResourceRequests defines resources requested
                            by one runtime member Pod.
                          properties:
                            cpu:
                              description: CPU is the requested Kubernetes CPU quantity.
                              maxLength: 64
                              minLength: 1
                              type: string
                              x-kubernetes-validations:
                              - message: must be a valid non-negative Kubernetes resource
                                  quantity
                                rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                  >= 0
                            gpu:
                              description: GPURequest defines the accelerator request
                                for one runtime member Pod.
                              properties:
                                count:
                                  default: 1
                                  description: Count is the number of accelerator
                                    devices requested by one runtime member Pod.
                                  format: int32
                                  minimum: 1
                                  type: integer
                              type: object
                            memory:
                              description: Memory is the requested Kubernetes memory
                                quantity.
                              maxLength: 64
                              minLength: 1
                              type: string
                              x-kubernetes-validations:
                              - message: must be a valid non-negative Kubernetes resource
                                  quantity
                                rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                  >= 0
                          required:
                          - cpu
                          - gpu
                          - memory
                          type: object
                      required:
                      - requests
                      type: object
                      x-kubernetes-validations:
                      - message: resources.requests.cpu must not exceed resources.limits.cpu
                        rule: '!has(self.limits) || !has(self.limits.cpu) || quantity(self.requests.cpu).compareTo(quantity(self.limits.cpu))
                          <= 0'
                      - message: resources.requests.memory must not exceed resources.limits.memory
                        rule: '!has(self.limits) || !has(self.limits.memory) || quantity(self.requests.memory).compareTo(quantity(self.limits.memory))
                          <= 0'
                    role:
                      default: aggregate
                      description: ModelRole identifies a ModelPool's role in the
                        serving path.
                      enum:
                      - aggregate
                      - encoder
                      - prefill
                      - decode
                      type: string
                  required:
                  - name
                  - parallelism
                  - resources
                  type: object
                  x-kubernetes-validations:
                  - message: nodes * resources.requests.gpu.count must equal the compiled
                      worker rank count
                    rule: '(has(self.nodes) ? self.nodes : 1) * self.resources.requests.gpu.count
                      == (has(self.parallelism.ep) ? self.parallelism.pp * self.parallelism.ep.size
                      : self.parallelism.pp * self.parallelism.tp * self.parallelism.pcp
                      * (has(self.parallelism.dp) ? self.parallelism.dp : 1))'
                maxItems: 32
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              nodes:
                description: Nodes is the number of physical Kubernetes Nodes used
                  by each ModelGroup; the compiler defaults it to 1.
                format: int32
                maximum: 1
                minimum: 1
                type: integer
              parallelism:
                description: Parallelism defines the execution topology of one ModelGroup.
                properties:
                  dcp:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                  dp:
                    format: int32
                    minimum: 1
                    type: integer
                  ep:
                    description: ExpertParallelism defines expert-parallel execution
                      for one ModelGroup.
                    properties:
                      backend:
                        maxLength: 128
                        minLength: 1
                        type: string
                      eplb:
                        default: false
                        type: boolean
                      size:
                        format: int32
                        minimum: 1
                        type: integer
                    required:
                    - size
                    type: object
                  pcp:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                  pp:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                  tp:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: parallelism.dp and parallelism.ep are mutually exclusive
                  rule: '!has(self.dp) || !has(self.ep)'
                - message: parallelism.ep.size must be divisible by parallelism.tp
                    * parallelism.pcp
                  rule: '!has(self.ep) || self.ep.size % (self.tp * self.pcp) == 0'
                - message: parallelism.pcp greater than 1 is incompatible with parallelism.dp
                    greater than 1
                  rule: self.pcp == 1 || !has(self.dp) || self.dp == 1
                - message: parallelism.ep.size must equal parallelism.tp * parallelism.pcp
                    when parallelism.pcp is greater than 1
                  rule: self.pcp == 1 || !has(self.ep) || self.ep.size == self.tp
                    * self.pcp
                - message: parallelism.dcp is incompatible with parallelism.tp and
                    parallelism.pcp
                  rule: 'self.pcp == 1 ? self.tp % self.dcp == 0 : self.dcp == 1 ||
                    self.dcp == self.pcp || self.dcp == self.tp * self.pcp'
              replicas:
                description: |-
                  Replicas is the initial service replica count; the compiler defaults it to 1.
                  When autoscaling is configured, its minReplicas and maxReplicas bound subsequent decisions.
                format: int32
                minimum: 0
                type: integer
              resources:
                description: ModelResources defines resources for one runtime member
                  Pod.
                properties:
                  limits:
                    description: ComputeResourceLimits defines optional CPU and memory
                      limits for one Pod.
                    properties:
                      cpu:
                        description: CPU is the maximum Kubernetes CPU quantity.
                        maxLength: 64
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: must be a valid non-negative Kubernetes resource
                            quantity
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                            >= 0
                      memory:
                        description: Memory is the maximum Kubernetes memory quantity.
                        maxLength: 64
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: must be a valid non-negative Kubernetes resource
                            quantity
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                            >= 0
                    type: object
                  requests:
                    description: ModelResourceRequests defines resources requested
                      by one runtime member Pod.
                    properties:
                      cpu:
                        description: CPU is the requested Kubernetes CPU quantity.
                        maxLength: 64
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: must be a valid non-negative Kubernetes resource
                            quantity
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                            >= 0
                      gpu:
                        description: GPURequest defines the accelerator request for
                          one runtime member Pod.
                        properties:
                          count:
                            default: 1
                            description: Count is the number of accelerator devices
                              requested by one runtime member Pod.
                            format: int32
                            minimum: 1
                            type: integer
                        type: object
                      memory:
                        description: Memory is the requested Kubernetes memory quantity.
                        maxLength: 64
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: must be a valid non-negative Kubernetes resource
                            quantity
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                            >= 0
                    required:
                    - cpu
                    - gpu
                    - memory
                    type: object
                required:
                - requests
                type: object
                x-kubernetes-validations:
                - message: resources.requests.cpu must not exceed resources.limits.cpu
                  rule: '!has(self.limits) || !has(self.limits.cpu) || quantity(self.requests.cpu).compareTo(quantity(self.limits.cpu))
                    <= 0'
                - message: resources.requests.memory must not exceed resources.limits.memory
                  rule: '!has(self.limits) || !has(self.limits.memory) || quantity(self.requests.memory).compareTo(quantity(self.limits.memory))
                    <= 0'
              timeouts:
                description: ModelTimeouts defines ModelService lifecycle budgets.
                properties:
                  drain:
                    description: Duration is a positive Go-style duration.
                    minLength: 2
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: must be a positive duration
                      rule: duration(self) > duration('0s')
                  startup:
                    description: Duration is a positive Go-style duration.
                    minLength: 2
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: must be a positive duration
                      rule: duration(self) > duration('0s')
                required:
                - drain
                - startup
                type: object
              tokenizer:
                description: Tokenizer defaults to model when omitted.
                maxLength: 1024
                minLength: 1
                type: string
            required:
            - backend
            - model
            - timeouts
            type: object
            x-kubernetes-validations:
            - message: spec.modelPools is mutually exclusive with top-level replicas,
                nodes, resources, parallelism, maxInputTokens, kvCache, and features
              rule: '!has(self.modelPools) || !(has(self.replicas) || has(self.nodes)
                || has(self.resources) || has(self.parallelism) || has(self.maxInputTokens)
                || has(self.kvCache) || has(self.features))'
            - message: top-level resources and parallelism are required when spec.modelPools
                is omitted
              rule: has(self.modelPools) || (has(self.resources) && has(self.parallelism))
            - message: modelPools name default is reserved for the Quick Start shorthand
              rule: '!has(self.modelPools) || self.modelPools.all(pool, pool.name
                != ''default'')'
            - message: nodes * resources.requests.gpu.count must equal the compiled
                worker rank count
              rule: 'has(self.modelPools) || (has(self.resources) && has(self.parallelism)
                && (has(self.nodes) ? self.nodes : 1) * self.resources.requests.gpu.count
                == (has(self.parallelism.ep) ? self.parallelism.pp * self.parallelism.ep.size
                : self.parallelism.pp * self.parallelism.tp * self.parallelism.pcp
                * (has(self.parallelism.dp) ? self.parallelism.dp : 1)))'
            - message: modelPools must be aggregate-only, complete P/D, or complete
                E/P/D without aggregate pools
              rule: '!has(self.modelPools) || self.modelPools.all(pool, !has(pool.role)
                || pool.role == ''aggregate'') || (self.modelPools.exists(pool, has(pool.role)
                && pool.role == ''prefill'') && self.modelPools.exists(pool, has(pool.role)
                && pool.role == ''decode'') && self.modelPools.all(pool, has(pool.role)
                && (pool.role == ''prefill'' || pool.role == ''decode''))) || (has(self.ecProfile)
                && self.modelPools.exists(pool, has(pool.role) && pool.role == ''encoder'')
                && self.modelPools.exists(pool, has(pool.role) && pool.role == ''prefill'')
                && self.modelPools.exists(pool, has(pool.role) && pool.role == ''decode'')
                && self.modelPools.all(pool, has(pool.role) && (pool.role == ''encoder''
                || pool.role == ''prefill'' || pool.role == ''decode'')))'
            - message: ecProfile requires complete E/P/D modelPools
              rule: '!has(self.ecProfile) || (has(self.modelPools) && self.modelPools.exists(pool,
                has(pool.role) && pool.role == ''encoder'') && self.modelPools.exists(pool,
                has(pool.role) && pool.role == ''prefill'') && self.modelPools.exists(pool,
                has(pool.role) && pool.role == ''decode'') && self.modelPools.all(pool,
                has(pool.role) && (pool.role == ''encoder'' || pool.role == ''prefill''
                || pool.role == ''decode'')))'
            - message: E/P/D modelPools must contain exactly one encoder, prefill,
                and decode Pool
              rule: '!has(self.modelPools) || !self.modelPools.exists(pool, has(pool.role)
                && pool.role == ''encoder'') || (size(self.modelPools.filter(pool,
                has(pool.role) && pool.role == ''encoder'')) == 1 && size(self.modelPools.filter(pool,
                has(pool.role) && pool.role == ''prefill'')) == 1 && size(self.modelPools.filter(pool,
                has(pool.role) && pool.role == ''decode'')) == 1)'
            - message: E/P/D modelPools must have equal encoder, prefill, and decode
                replica counts
              rule: '!has(self.modelPools) || !self.modelPools.exists(pool, has(pool.role)
                && pool.role == ''encoder'') || self.modelPools.filter(pool, has(pool.role)
                && pool.role == ''encoder'').all(e, self.modelPools.filter(pool, has(pool.role)
                && pool.role == ''prefill'').all(p, (has(e.replicas) ? e.replicas
                : 1) == (has(p.replicas) ? p.replicas : 1)) && self.modelPools.filter(pool,
                has(pool.role) && pool.role == ''decode'').all(d, (has(e.replicas)
                ? e.replicas : 1) == (has(d.replicas) ? d.replicas : 1)))'
