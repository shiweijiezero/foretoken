                  rule: 'self.pcp == 1 ? self.tp % self.dcp == 0 : self.dcp == 1 ||
                    self.dcp == self.pcp || self.dcp == self.tp * self.pcp'
              replicas:
                description: Replicas is the number of complete ModelGroups in the
                  default Pool; the compiler defaults it to 1.
                format: int32
                minimum: 0
                type: integer
              resources:
                description: ModelResources defines resources for one runtime member
                  Pod.
                properties:
                  limits:
                    description: ComputeResourceLimits defines optional CPU and memory
                      limits for one Pod.
                    properties:
                      cpu:
                        description: CPU is the maximum Kubernetes CPU quantity.
                        maxLength: 64
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: must be a valid non-negative Kubernetes resource
                            quantity
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                            >= 0
                      memory:
                        description: Memory is the maximum Kubernetes memory quantity.
                        maxLength: 64
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: must be a valid non-negative Kubernetes resource
                            quantity
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                            >= 0
                    type: object
                  requests:
                    description: ModelResourceRequests defines resources requested
                      by one runtime member Pod.
                    properties:
                      cpu:
                        description: CPU is the requested Kubernetes CPU quantity.
                        maxLength: 64
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: must be a valid non-negative Kubernetes resource
                            quantity
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                            >= 0
                      gpu:
                        description: GPURequest defines the logical GPU request for
                          one runtime member Pod.
                        properties:
                          count:
                            default: 1
                            description: Count is the number of GPUs requested by
                              one runtime member Pod.
                            format: int32
                            minimum: 1
                            type: integer
                          type:
                            default: auto
                            description: Type is a platform-registered GPU type or
                              auto.
                            maxLength: 128
                            minLength: 1
                            pattern: ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
                            type: string
                        type: object
                      memory:
                        description: Memory is the requested Kubernetes memory quantity.
                        maxLength: 64
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: must be a valid non-negative Kubernetes resource
                            quantity
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                            >= 0
