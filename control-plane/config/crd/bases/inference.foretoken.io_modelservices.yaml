#
# Defines a generated Kubernetes API manifest for Foretoken custom resources.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: modelservices.inference.foretoken.io
spec:
  group: inference.foretoken.io
  names:
    kind: ModelService
    listKind: ModelServiceList
    plural: modelservices
    singular: modelservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.backend
      name: Backend
      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelService is the user-owned model serving API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelServiceSpec defines the desired state of a model service.
            properties:
              autoscaling:
                description: |-
                  Autoscaling is evaluated by the ModelService controller. Algorithms remain
                  side-effect-free; lifecycle, bounds, rollout, and drain stay core-owned.
                properties:
                  adjustment:
                    description: |-
                      Adjustment modifies a scaling desired capacity before platform decision resolution.
                      Manual intent always uses direct adjustment.
                    properties:
                      algorithm:
                        default: step
                        description: AutoscalingAdjustmentAlgorithm selects how a
                          desired capacity is adjusted before resolution.
                        enum:
                        - direct
                        - step
                        type: string
                      maxScaleDownGroups:
                        default: 1
                        description: Zero disables the downward per-evaluation step
                          limit.
                        format: int32
                        minimum: 0
                        type: integer
                      maxScaleUpGroups:
                        default: 1
                        description: Zero disables the upward per-evaluation step
                          limit.
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                  algorithm:
                    default: manual
                    description: AutoscalingAlgorithm selects a statically linked
                      autoscaling decision algorithm.
                    enum:
                    - manual
                    - queue
                    - threshold
                    type: string
                  maxGroups:
                    description: MaxGroups is required for automatic autoscaling.
                      When omitted, manual intent is unbounded.
                    format: int32
                    minimum: 0
                    type: integer
                  metricsMaxAge:
                    default: 15s
                    description: Duration is a positive Go-style duration.
                    minLength: 2
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: must be a positive duration
                      rule: duration(self) > duration('0s')
                  minGroups:
                    default: 0
                    format: int32
                    minimum: 0
                    type: integer
                  scaleUpQueue:
                    default: 1
                    description: ScaleUpQueue is the queue-depth threshold above which
                      threshold adds one Group.
                    format: int64
                    minimum: 0
                    type: integer
                  targetQueuePerRoutableGroup:
                    default: 1
                    format: int64
                    minimum: 0
                    type: integer
                  trigger:
                    description: |-
                      Trigger controls when an automatic algorithm receives a fresh observation.
                      It is ignored by manual autoscaling.
                    properties:
                      algorithm:
                        default: periodic
                        description: AutoscalingTriggerAlgorithm selects when an automatic
                          scaling algorithm is evaluated.
                        enum:
                        - periodic
                        - watermark
                        type: string
                      highQueuePerRoutableGroup:
                        default: 1
                        description: |-
                          HighQueuePerRoutableGroup fires a watermark evaluation only when queue
                          strictly exceeds this per-routable-Group level.
                        format: int64
                        minimum: 0
                        type: integer
                      interval:
                        default: 5s
                        description: Duration is a positive Go-style duration.
                        minLength: 2
                        pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                        type: string
                        x-kubernetes-validations:
                        - message: must be a positive duration
                          rule: duration(self) > duration('0s')
                      lowQueuePerRoutableGroup:
                        default: 0
                        description: |-
                          LowQueuePerRoutableGroup fires a watermark evaluation for idle capacity when
                          queue is at or below this per-routable-Group level and no requests are active.
                        format: int64
                        minimum: 0
                        type: integer
                    type: object
                    x-kubernetes-validations:
                    - message: autoscaling trigger lowQueuePerRoutableGroup must not
                        exceed highQueuePerRoutableGroup
                      rule: '!has(self.lowQueuePerRoutableGroup) || !has(self.highQueuePerRoutableGroup)
                        || self.lowQueuePerRoutableGroup <= self.highQueuePerRoutableGroup'
                required:
                - algorithm
                type: object
                x-kubernetes-validations:
                - message: autoscaling minGroups must not exceed maxGroups
                  rule: '!has(self.minGroups) || !has(self.maxGroups) || self.minGroups
                    <= self.maxGroups'
                - message: autoscaling maxGroups is required unless algorithm is manual
                  rule: self.algorithm == 'manual' || has(self.maxGroups)
              backend:
                enum:
                - vllm
                type: string
              ecProfile:
                description: ECProfile selects the platform-maintained EC runtime
                  for a complete E/P/D topology.
                properties:
                  profile:
                    maxLength: 256
                    minLength: 1
                    type: string
                required:
                - profile
                type: object
              extraArgs:
                description: ExtraArgs are inference-engine CLI flags shared by every
                  compiled Pool.
                items:
                  description: |-
                    BackendArg is one long-form CLI argument passed to the inference engine.
                    The vLLM adapter accepts max-model-len, dtype, quantization, gpu-memory-utilization,
                    max-num-seqs, max-num-batched-tokens, limit-mm-per-prompt, enforce-eager, and
                    disable-log-stats. This schema rejects spaces, aliases, and positional arguments.
                  maxLength: 4096
                  minLength: 3
                  pattern: ^--[a-z][a-z0-9-]*(=[^[:space:]]+)?$
                  type: string
                maxItems: 256
                type: array
                x-kubernetes-list-type: atomic
              features:
                description: Features declares explicit opt-in capabilities for the
                  default Pool.
                properties:
                  multimodal:
                    items:
                      description: MultimodalModality identifies one non-text input
                        modality supported by a model.
                      enum:
                      - image
                      type: string
                    maxItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  reasoning:
                    type: boolean
                  structuredOutputs:
                    items:
                      description: StructuredOutputFormat identifies a structured
                        response format supported by a model.
                      enum:
                      - jsonObject
                      - jsonSchema
                      type: string
                    maxItems: 2
                    type: array
                    x-kubernetes-list-type: set
                  tools:
                    type: boolean
                type: object
              internalGenerateRequestBodyLimitBytes:
                default: 67108864
                description: |-
                  InternalGenerateRequestBodyLimitBytes is the maximum body size accepted by
                  a group-local generate endpoint. It defaults to 64 MiB.
                format: int64
                maximum: 268435456
                minimum: 1048576
                type: integer
              kvCache:
                description: KVCache is the typed cache-placement intent for the Quick
                  Start shorthand.
                properties:
                  mooncakeStore:
                    description: MooncakeStore selects either an external platform
                      profile or a Foretoken-owned KVService.
                    properties:
                      kvServiceRef:
                        description: KVServiceReference identifies a same-namespace
                          KVService by user-facing name only.
                        properties:
                          name:
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      profile:
                        maxLength: 256
                        minLength: 1
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of profile or kvServiceRef is required
                      rule: has(self.profile) != has(self.kvServiceRef)
                  offload:
                    description: KVOffload defines local CPU and optionally filesystem-backed
                      KV offload.
                    properties:
                      cpuCacheSize:
                        allOf:
                        - minLength: 1
                        - minLength: 1
                        description: CPUCacheSize is the CPU tier capacity available
                          to vLLM.
                        maxLength: 64
                        type: string
                        x-kubernetes-validations:
                        - message: must be a valid non-negative Kubernetes resource
                            quantity
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                            >= 0
                      filesystem:
                        type: boolean
                    required:
                    - cpuCacheSize
                    type: object
                type: object
                x-kubernetes-validations:
                - message: kvCache.offload and kvCache.mooncakeStore are mutually
                    exclusive
                  rule: '!(has(self.offload) && has(self.mooncakeStore))'
              maxInputTokens:
                description: MaxInputTokens is the prompt admission limit for requests
                  routed to the default Pool.
                format: int32
                minimum: 1
                type: integer
              model:
                maxLength: 1024
                minLength: 1
                type: string
              modelPools:
                description: ModelPools defines up to 32 advanced execution Pools
                  instead of the top-level shorthand.
                items:
                  description: |-
                    ModelPoolTemplate defines one user-owned execution Pool: a homogeneous set
                    of ModelGroups sharing the same role, network, resources, and parallelism.
                    The controller instantiates it as a ModelPool owned by the ModelService.
                  properties:
                    features:
                      description: Features declares explicit opt-in capabilities
                        for this Pool.
                      properties:
                        multimodal:
                          items:
                            description: MultimodalModality identifies one non-text
                              input modality supported by a model.
                            enum:
                            - image
                            type: string
                          maxItems: 1
                          type: array
                          x-kubernetes-list-type: set
                        reasoning:
                          type: boolean
                        structuredOutputs:
                          items:
                            description: StructuredOutputFormat identifies a structured
                              response format supported by a model.
                            enum:
                            - jsonObject
                            - jsonSchema
                            type: string
                          maxItems: 2
                          type: array
                          x-kubernetes-list-type: set
                        tools:
                          type: boolean
                      type: object
                    kvCache:
                      description: KVCache defines typed KV-cache placement intent
                        for one execution Pool.
                      properties:
                        mooncakeStore:
                          description: MooncakeStore selects either an external platform
                            profile or a Foretoken-owned KVService.
                          properties:
                            kvServiceRef:
                              description: KVServiceReference identifies a same-namespace
                                KVService by user-facing name only.
                              properties:
                                name:
                                  minLength: 1
                                  type: string
                              required:
                              - name
                              type: object
                            profile:
                              maxLength: 256
                              minLength: 1
                              type: string
                          type: object
                          x-kubernetes-validations:
                          - message: exactly one of profile or kvServiceRef is required
                            rule: has(self.profile) != has(self.kvServiceRef)
                        offload:
                          description: KVOffload defines local CPU and optionally
                            filesystem-backed KV offload.
                          properties:
                            cpuCacheSize:
                              allOf:
                              - minLength: 1
                              - minLength: 1
                              description: CPUCacheSize is the CPU tier capacity available
                                to vLLM.
                              maxLength: 64
                              type: string
                              x-kubernetes-validations:
                              - message: must be a valid non-negative Kubernetes resource
                                  quantity
                                rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                  >= 0
                            filesystem:
                              type: boolean
                          required:
                          - cpuCacheSize
                          type: object
                      type: object
                      x-kubernetes-validations:
                      - message: kvCache.offload and kvCache.mooncakeStore are mutually
                          exclusive
                        rule: '!(has(self.offload) && has(self.mooncakeStore))'
                    maxInputTokens:
                      description: MaxInputTokens is the prompt admission limit for
                        requests routed to this Pool.
                      format: int32
                      minimum: 1
                      type: integer
                    name:
                      description: Name is the stable identity of this Pool within
                        one ModelService.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    network:
                      maxLength: 128
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$
                      type: string
                    nodes:
                      default: 1
                      description: Nodes is the number of physical Kubernetes Nodes
                        used by each ModelGroup.
                      format: int32
                      maximum: 1
                      minimum: 1
                      type: integer
                    parallelism:
                      description: Parallelism defines the execution topology of one
                        ModelGroup.
                      properties:
                        dcp:
                          default: 1
                          format: int32
                          minimum: 1
                          type: integer
                        dp:
                          format: int32
                          minimum: 1
                          type: integer
                        ep:
                          description: ExpertParallelism defines expert-parallel execution
                            for one ModelGroup.
                          properties:
                            backend:
                              maxLength: 128
                              minLength: 1
                              type: string
                            eplb:
                              default: false
                              type: boolean
                            size:
                              format: int32
                              minimum: 1
                              type: integer
                          required:
                          - size
                          type: object
                        pcp:
                          default: 1
                          format: int32
                          minimum: 1
                          type: integer
                        pp:
                          default: 1
                          format: int32
                          minimum: 1
                          type: integer
                        tp:
                          default: 1
                          format: int32
                          minimum: 1
                          type: integer
                      type: object
                      x-kubernetes-validations:
                      - message: parallelism.dp and parallelism.ep are mutually exclusive
                        rule: '!has(self.dp) || !has(self.ep)'
                      - message: parallelism.ep.size must be divisible by parallelism.tp
                          * parallelism.pcp
                        rule: '!has(self.ep) || self.ep.size % (self.tp * self.pcp)
                          == 0'
                      - message: parallelism.pcp greater than 1 is incompatible with
                          parallelism.dp greater than 1
                        rule: self.pcp == 1 || !has(self.dp) || self.dp == 1
                      - message: parallelism.ep.size must equal parallelism.tp * parallelism.pcp
                          when parallelism.pcp is greater than 1
                        rule: self.pcp == 1 || !has(self.ep) || self.ep.size == self.tp
                          * self.pcp
                      - message: parallelism.dcp is incompatible with parallelism.tp
                          and parallelism.pcp
                        rule: 'self.pcp == 1 ? self.tp % self.dcp == 0 : self.dcp
                          == 1 || self.dcp == self.pcp || self.dcp == self.tp * self.pcp'
                    replicas:
                      default: 1
                      description: Replicas is the number of complete ModelGroups
                        in this Pool.
                      format: int32
                      minimum: 0
                      type: integer
                    resources:
                      description: ModelResources defines resources for one runtime
                        member Pod.
                      properties:
                        limits:
                          description: ComputeResourceLimits defines optional CPU
                            and memory limits for one Pod.
                          properties:
                            cpu:
                              description: CPU is the maximum Kubernetes CPU quantity.
                              maxLength: 64
                              minLength: 1
                              type: string
                              x-kubernetes-validations:
                              - message: must be a valid non-negative Kubernetes resource
                                  quantity
                                rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                  >= 0
                            memory:
                              description: Memory is the maximum Kubernetes memory
                                quantity.
                              maxLength: 64
                              minLength: 1
                              type: string
                              x-kubernetes-validations:
                              - message: must be a valid non-negative Kubernetes resource
                                  quantity
                                rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                  >= 0
                          type: object
                        requests:
                          description: ModelResourceRequests defines resources requested
                            by one runtime member Pod.
                          properties:
                            cpu:
                              description: CPU is the requested Kubernetes CPU quantity.
                              maxLength: 64
                              minLength: 1
                              type: string
                              x-kubernetes-validations:
                              - message: must be a valid non-negative Kubernetes resource
                                  quantity
                                rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                  >= 0
                            gpu:
                              description: GPURequest defines the accelerator request
                                for one runtime member Pod.
                              properties:
                                count:
                                  default: 1
                                  description: Count is the number of accelerator
                                    devices requested by one runtime member Pod.
                                  format: int32
                                  minimum: 1
                                  type: integer
                              type: object
                            memory:
                              description: Memory is the requested Kubernetes memory
                                quantity.
                              maxLength: 64
                              minLength: 1
                              type: string
                              x-kubernetes-validations:
                              - message: must be a valid non-negative Kubernetes resource
                                  quantity
                                rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                  >= 0
                          required:
                          - cpu
                          - gpu
                          - memory
                          type: object
                      required:
                      - requests
                      type: object
                      x-kubernetes-validations:
                      - message: resources.requests.cpu must not exceed resources.limits.cpu
                        rule: '!has(self.limits) || !has(self.limits.cpu) || quantity(self.requests.cpu).compareTo(quantity(self.limits.cpu))
                          <= 0'
                      - message: resources.requests.memory must not exceed resources.limits.memory
                        rule: '!has(self.limits) || !has(self.limits.memory) || quantity(self.requests.memory).compareTo(quantity(self.limits.memory))
                          <= 0'
                    role:
                      default: aggregate
                      description: ModelRole identifies a ModelPool's role in the
                        serving path.
                      enum:
                      - aggregate
                      - encoder
                      - prefill
                      - decode
                      type: string
                  required:
                  - name
                  - parallelism
                  - resources
                  type: object
                  x-kubernetes-validations:
                  - message: nodes * resources.requests.gpu.count must equal the compiled
                      worker rank count
                    rule: '(has(self.nodes) ? self.nodes : 1) * self.resources.requests.gpu.count
                      == (has(self.parallelism.ep) ? self.parallelism.pp * self.parallelism.ep.size
                      : self.parallelism.pp * self.parallelism.tp * self.parallelism.pcp
                      * (has(self.parallelism.dp) ? self.parallelism.dp : 1))'
                maxItems: 32
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              nodes:
                description: Nodes is the number of physical Kubernetes Nodes used
                  by each ModelGroup; the compiler defaults it to 1.
                format: int32
                maximum: 1
                minimum: 1
                type: integer
              parallelism:
                description: Parallelism defines the execution topology of one ModelGroup.
                properties:
                  dcp:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                  dp:
                    format: int32
                    minimum: 1
                    type: integer
                  ep:
                    description: ExpertParallelism defines expert-parallel execution
                      for one ModelGroup.
                    properties:
                      backend:
                        maxLength: 128
                        minLength: 1
                        type: string
                      eplb:
                        default: false
                        type: boolean
                      size:
                        format: int32
                        minimum: 1
                        type: integer
                    required:
                    - size
                    type: object
                  pcp:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                  pp:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                  tp:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: parallelism.dp and parallelism.ep are mutually exclusive
                  rule: '!has(self.dp) || !has(self.ep)'
                - message: parallelism.ep.size must be divisible by parallelism.tp
                    * parallelism.pcp
                  rule: '!has(self.ep) || self.ep.size % (self.tp * self.pcp) == 0'
                - message: parallelism.pcp greater than 1 is incompatible with parallelism.dp
                    greater than 1
                  rule: self.pcp == 1 || !has(self.dp) || self.dp == 1
                - message: parallelism.ep.size must equal parallelism.tp * parallelism.pcp
                    when parallelism.pcp is greater than 1
                  rule: self.pcp == 1 || !has(self.ep) || self.ep.size == self.tp
                    * self.pcp
                - message: parallelism.dcp is incompatible with parallelism.tp and
                    parallelism.pcp
                  rule: 'self.pcp == 1 ? self.tp % self.dcp == 0 : self.dcp == 1 ||
                    self.dcp == self.pcp || self.dcp == self.tp * self.pcp'
              replicas:
                description: Replicas is the number of complete ModelGroups in the
                  default Pool; the compiler defaults it to 1.
                format: int32
                minimum: 0
                type: integer
              resources:
                description: ModelResources defines resources for one runtime member
                  Pod.
                properties:
                  limits:
                    description: ComputeResourceLimits defines optional CPU and memory
                      limits for one Pod.
                    properties:
                      cpu:
                        description: CPU is the maximum Kubernetes CPU quantity.
                        maxLength: 64
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: must be a valid non-negative Kubernetes resource
                            quantity
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                            >= 0
                      memory:
                        description: Memory is the maximum Kubernetes memory quantity.
                        maxLength: 64
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: must be a valid non-negative Kubernetes resource
                            quantity
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                            >= 0
                    type: object
                  requests:
                    description: ModelResourceRequests defines resources requested
                      by one runtime member Pod.
                    properties:
                      cpu:
                        description: CPU is the requested Kubernetes CPU quantity.
                        maxLength: 64
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: must be a valid non-negative Kubernetes resource
                            quantity
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                            >= 0
                      gpu:
                        description: GPURequest defines the accelerator request for
                          one runtime member Pod.
                        properties:
                          count:
                            default: 1
                            description: Count is the number of accelerator devices
                              requested by one runtime member Pod.
                            format: int32
                            minimum: 1
                            type: integer
                        type: object
                      memory:
                        description: Memory is the requested Kubernetes memory quantity.
                        maxLength: 64
                        minLength: 1
                        type: string
                        x-kubernetes-validations:
                        - message: must be a valid non-negative Kubernetes resource
                            quantity
                          rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                            >= 0
                    required:
                    - cpu
                    - gpu
                    - memory
                    type: object
                required:
                - requests
                type: object
                x-kubernetes-validations:
                - message: resources.requests.cpu must not exceed resources.limits.cpu
                  rule: '!has(self.limits) || !has(self.limits.cpu) || quantity(self.requests.cpu).compareTo(quantity(self.limits.cpu))
                    <= 0'
                - message: resources.requests.memory must not exceed resources.limits.memory
                  rule: '!has(self.limits) || !has(self.limits.memory) || quantity(self.requests.memory).compareTo(quantity(self.limits.memory))
                    <= 0'
              timeouts:
                description: ModelTimeouts defines ModelService lifecycle budgets.
                properties:
                  drain:
                    description: Duration is a positive Go-style duration.
                    minLength: 2
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: must be a positive duration
                      rule: duration(self) > duration('0s')
                  startup:
                    description: Duration is a positive Go-style duration.
                    minLength: 2
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: must be a positive duration
                      rule: duration(self) > duration('0s')
                required:
                - drain
                - startup
                type: object
              tokenizer:
                description: Tokenizer defaults to model when omitted.
                maxLength: 1024
                minLength: 1
                type: string
            required:
            - backend
            - model
            - timeouts
            type: object
            x-kubernetes-validations:
            - message: spec.modelPools is mutually exclusive with top-level replicas,
                nodes, resources, parallelism, maxInputTokens, kvCache, and features
              rule: '!has(self.modelPools) || !(has(self.replicas) || has(self.nodes)
                || has(self.resources) || has(self.parallelism) || has(self.maxInputTokens)
                || has(self.kvCache) || has(self.features))'
            - message: top-level resources and parallelism are required when spec.modelPools
                is omitted
              rule: has(self.modelPools) || (has(self.resources) && has(self.parallelism))
            - message: modelPools name default is reserved for the Quick Start shorthand
              rule: '!has(self.modelPools) || self.modelPools.all(pool, pool.name
                != ''default'')'
            - message: nodes * resources.requests.gpu.count must equal the compiled
                worker rank count
              rule: 'has(self.modelPools) || (has(self.resources) && has(self.parallelism)
                && (has(self.nodes) ? self.nodes : 1) * self.resources.requests.gpu.count
                == (has(self.parallelism.ep) ? self.parallelism.pp * self.parallelism.ep.size
                : self.parallelism.pp * self.parallelism.tp * self.parallelism.pcp
                * (has(self.parallelism.dp) ? self.parallelism.dp : 1)))'
