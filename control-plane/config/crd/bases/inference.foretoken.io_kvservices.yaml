#
# Defines a generated Kubernetes API manifest for Foretoken custom resources.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: kvservices.inference.foretoken.io
spec:
  group: inference.foretoken.io
  names:
    kind: KVService
    listKind: KVServiceList
    plural: kvservices
    singular: kvservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.backend
      name: Backend
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KVServiceSpec declares a Foretoken-owned Mooncake standalone
              Store.
            properties:
              backend:
                enum:
                - mooncakeStandaloneStore
                type: string
              master:
                description: KVMasterSpec configures the KVService-level Mooncake
                  Master singleton.
                properties:
                  image:
                    minLength: 1
                    type: string
                  metadataPort:
                    default: 8080
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  metricsPort:
                    default: 9003
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  resources:
                    description: KVResources defines CPU and memory for a Mooncake
                      component.
                    properties:
                      limits:
                        description: ComputeResourceLimits defines optional CPU and
                          memory limits for one Pod.
                        properties:
                          cpu:
                            description: CPU is the maximum Kubernetes CPU quantity.
                            maxLength: 64
                            minLength: 1
                            type: string
                            x-kubernetes-validations:
                            - message: must be a valid non-negative Kubernetes resource
                                quantity
                              rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                >= 0
                          memory:
                            description: Memory is the maximum Kubernetes memory quantity.
                            maxLength: 64
                            minLength: 1
                            type: string
                            x-kubernetes-validations:
                            - message: must be a valid non-negative Kubernetes resource
                                quantity
                              rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                >= 0
                        type: object
                      requests:
                        description: ComputeResourceRequests defines the required
                          CPU and memory for one Pod.
                        properties:
                          cpu:
                            description: CPU is the requested Kubernetes CPU quantity.
                            maxLength: 64
                            minLength: 1
                            type: string
                            x-kubernetes-validations:
                            - message: must be a valid non-negative Kubernetes resource
                                quantity
                              rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                >= 0
                          memory:
                            description: Memory is the requested Kubernetes memory
                              quantity.
                            maxLength: 64
                            minLength: 1
                            type: string
                            x-kubernetes-validations:
                            - message: must be a valid non-negative Kubernetes resource
                                quantity
                              rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                >= 0
                        required:
                        - cpu
                        - memory
                        type: object
                    required:
                    - requests
                    type: object
                    x-kubernetes-validations:
                    - message: resources.requests.cpu must not exceed resources.limits.cpu
                      rule: '!has(self.limits) || !has(self.limits.cpu) || quantity(self.requests.cpu).compareTo(quantity(self.limits.cpu))
                        <= 0'
                    - message: resources.requests.memory must not exceed resources.limits.memory
                      rule: '!has(self.limits) || !has(self.limits.memory) || quantity(self.requests.memory).compareTo(quantity(self.limits.memory))
                        <= 0'
                  rpcPort:
                    default: 50051
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  snapshot:
                    description: |-
                      SnapshotStorage configures the Master singleton snapshot volume. The provider's
                      snapshot retention is not a Foretoken cache TTL or eviction policy.
                    properties:
                      retentionPolicy:
                        default: Delete
                        description: |-
                          RetentionPolicy controls controller behavior when an owned PVC is removed.
                          Retain releases the PVC from its KVService owner; a later KVService does not
                          adopt it, even when it has the same namespace and name.
                        enum:
                        - Delete
                        - Retain
                        type: string
                      size:
                        description: |-
                          ByteQuantity is a positive, exact integer number of bytes. It deliberately
                          does not accept Kubernetes unit suffixes so cache capacities are unambiguous.
                        maxLength: 19
                        pattern: ^[1-9][0-9]*$
                        type: string
                      storageClassName:
                        type: string
                    required:
                    - size
                    type: object
                  snapshotInterval:
                    allOf:
                    - pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    - pattern: ^([0-9]+(s|m|h))+$
                    default: 60s
                    description: SnapshotInterval controls the provider snapshot cadence
                      for both persistent and ephemeral snapshot storage.
                    minLength: 2
                    type: string
                    x-kubernetes-validations:
                    - message: must be a positive duration
                      rule: duration(self) > duration('0s')
                  snapshotRetentionCount:
                    default: 3
                    description: SnapshotRetentionCount is the number of provider
                      snapshots retained.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - image
                - resources
                type: object
              requester:
                description: KVRequesterSpec configures ModelGroup Store requester
                  configuration.
                properties:
                  localBufferSize:
                    description: LocalBufferSize is an exact positive integer number
                      of bytes.
                    maxLength: 19
                    pattern: ^[1-9][0-9]*$
                    type: string
                required:
                - localBufferSize
                type: object
              storagePools:
                items:
                  description: KVStoragePoolTemplate names one homogeneous future
                    client capacity Pool.
                  properties:
                    client:
                      description: |-
                        KVClientTemplate is immutable normalized intent for homogeneous future clients.
                        This standalone Store profile enables SSD offload, so disk is required. The
                        user-provided gap between capacity and memory resources reserves runtime overhead;
                        Foretoken deliberately does not guess a fixed overhead amount.
                      properties:
                        disk:
                          description: |-
                            KVDisk configures storage requested by each future client Group. Its size is a
                            PVC request, not a claim about usable filesystem capacity.
                          properties:
                            retentionPolicy:
                              default: Delete
                              description: |-
                                RetentionPolicy controls controller behavior when an owned PVC is removed.
                                Retain releases the PVC from its KVService owner; a later KVService does not
                                adopt it, even when it has the same namespace and name.
                              enum:
                              - Delete
                              - Retain
                              type: string
                            size:
                              description: |-
                                ByteQuantity is a positive, exact integer number of bytes. It deliberately
                                does not accept Kubernetes unit suffixes so cache capacities are unambiguous.
                              maxLength: 19
                              pattern: ^[1-9][0-9]*$
                              type: string
                            storageClassName:
                              type: string
                          required:
                          - size
                          type: object
                        image:
                          minLength: 1
                          type: string
                        memoryCapacity:
                          description: |-
                            ByteQuantity is a positive, exact integer number of bytes. It deliberately
                            does not accept Kubernetes unit suffixes so cache capacities are unambiguous.
                          maxLength: 19
                          pattern: ^[1-9][0-9]*$
                          type: string
                        port:
                          default: 50052
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        protocol:
                          enum:
                          - rdma
                          type: string
                        rdmaResourceCount:
                          default: 1
                          format: int32
                          minimum: 1
                          type: integer
                        rdmaResourceName:
                          minLength: 1
                          type: string
                        resources:
                          description: KVResources defines CPU and memory for a Mooncake
                            component.
                          properties:
                            limits:
                              description: ComputeResourceLimits defines optional
                                CPU and memory limits for one Pod.
                              properties:
                                cpu:
                                  description: CPU is the maximum Kubernetes CPU quantity.
                                  maxLength: 64
                                  minLength: 1
                                  type: string
                                  x-kubernetes-validations:
                                  - message: must be a valid non-negative Kubernetes
                                      resource quantity
                                    rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                      >= 0
                                memory:
                                  description: Memory is the maximum Kubernetes memory
                                    quantity.
                                  maxLength: 64
                                  minLength: 1
                                  type: string
                                  x-kubernetes-validations:
                                  - message: must be a valid non-negative Kubernetes
                                      resource quantity
                                    rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                      >= 0
                              type: object
                            requests:
                              description: ComputeResourceRequests defines the required
                                CPU and memory for one Pod.
                              properties:
                                cpu:
                                  description: CPU is the requested Kubernetes CPU
                                    quantity.
                                  maxLength: 64
                                  minLength: 1
                                  type: string
                                  x-kubernetes-validations:
                                  - message: must be a valid non-negative Kubernetes
                                      resource quantity
                                    rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                      >= 0
                                memory:
                                  description: Memory is the requested Kubernetes
                                    memory quantity.
                                  maxLength: 64
                                  minLength: 1
                                  type: string
                                  x-kubernetes-validations:
                                  - message: must be a valid non-negative Kubernetes
                                      resource quantity
                                    rule: isQuantity(self) && quantity(self).compareTo(quantity('0'))
                                      >= 0
                              required:
                              - cpu
                              - memory
                              type: object
                          required:
                          - requests
                          type: object
                          x-kubernetes-validations:
                          - message: resources.requests.cpu must not exceed resources.limits.cpu
                            rule: '!has(self.limits) || !has(self.limits.cpu) || quantity(self.requests.cpu).compareTo(quantity(self.limits.cpu))
                              <= 0'
                          - message: resources.requests.memory must not exceed resources.limits.memory
                            rule: '!has(self.limits) || !has(self.limits.memory) ||
                              quantity(self.requests.memory).compareTo(quantity(self.limits.memory))
                              <= 0'
                      required:
                      - image
                      - memoryCapacity
                      - protocol
                      - rdmaResourceName
                      - resources
                      type: object
                      x-kubernetes-validations:
                      - message: client.disk is required when standalone Store offload
                          is enabled
                        rule: has(self.disk)
                      - message: client.memoryCapacity must be less than client.resources.requests.memory
                          to reserve runtime overhead
                        rule: quantity(self.memoryCapacity).compareTo(quantity(self.resources.requests.memory))
                          < 0
                      - message: client.memoryCapacity must be less than client.resources.limits.memory
                          to reserve runtime overhead
                        rule: '!has(self.resources.limits) || !has(self.resources.limits.memory)
                          || quantity(self.memoryCapacity).compareTo(quantity(self.resources.limits.memory))
                          < 0'
                    name:
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    nodeSelector:
                      additionalProperties:
                        type: string
                      type: object
                    replicas:
                      default: 1
                      format: int32
                      minimum: 0
                      type: integer
                  required:
                  - client
                  - name
                  type: object
                maxItems: 32
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              timeouts:
                description: KVTimeouts defines lifecycle budgets for future Store
                  clients.
                properties:
                  drain:
                    description: Duration is a positive Go-style duration.
                    minLength: 2
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: must be a positive duration
                      rule: duration(self) > duration('0s')
                  startup:
                    description: Duration is a positive Go-style duration.
                    minLength: 2
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                    x-kubernetes-validations:
                    - message: must be a positive duration
                      rule: duration(self) > duration('0s')
                required:
                - drain
                - startup
                type: object
            required:
            - backend
            - master
            - requester
            - storagePools
            - timeouts
            type: object
            x-kubernetes-validations:
            - message: storagePools names must be unique
              rule: 'self.storagePools.all(pool, self.storagePools.exists(other, other.name
                == pool.name) ? self.storagePools.filter(other, other.name == pool.name).size()
                == 1 : true)'
          status:
            description: |-
              KVServiceStatus reports infrastructure and Pool materialization only; it does
              not claim provider registration, usable Store state, or available capacity.
            properties:
              binding:
                description: KVServiceBinding is the immutable current requester configuration
                  consumed by ModelPools.
                properties:
                  configMapKey:
                    type: string
                  configMapName:
                    type: string
                  masterEndpoint:
                    type: string
                  pythonHashSeed:
                    type: string
                  revision:
                    type: string
                required:
                - configMapKey
                - configMapName
                - masterEndpoint
                - pythonHashSeed
                - revision
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Pending
                - Progressing
                - Ready
                - Degraded
                - Terminating
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
