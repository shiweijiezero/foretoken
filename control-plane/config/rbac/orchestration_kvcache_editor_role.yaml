# This rule is not used by the project control-plane itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the orchestration.foretoken.ai.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
  name: orchestration-kvcache-editor-role
rules:
- apiGroups:
  - orchestration.foretoken.ai
  resources:
  - kvcaches
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - orchestration.foretoken.ai
  resources:
  - kvcaches/status
  verbs:
  - get
