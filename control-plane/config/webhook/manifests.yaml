---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-autoscaling-foretoken-ai-v1alpha1-inferenceautoscaler
  failurePolicy: Fail
  name: minferenceautoscaler-v1alpha1.kb.io
  rules:
  - apiGroups:
    - autoscaling.foretoken.ai
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - inferenceautoscalers
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-orchestration-foretoken-ai-v1alpha1-inferencegroup
