    service:
      name: webhook-service
      namespace: system
      path: /mutate-gateway-foretoken-ai-v1alpha1-routingprofile
  failurePolicy: Fail
  name: mroutingprofile-v1alpha1.kb.io
  rules:
  - apiGroups:
    - gateway.foretoken.ai
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - routingprofiles
  sideEffects: None
