    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - inferencegroups
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-orchestration-foretoken-ai-v1alpha1-inferencepool
