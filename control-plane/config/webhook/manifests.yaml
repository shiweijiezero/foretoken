    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - inferencepools
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-orchestration-foretoken-ai-v1alpha1-kvcache
  failurePolicy: Fail
  name: mkvcache-v1alpha1.kb.io
  rules:
  - apiGroups:
    - orchestration.foretoken.ai
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - kvcaches
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-model-foretoken-ai-v1alpha1-modelservice
  failurePolicy: Fail
  name: mmodelservice-v1alpha1.kb.io
  rules:
  - apiGroups:
    - model.foretoken.ai
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - modelservices
  sideEffects: None
- admissionReviewVersions:
  - v1
