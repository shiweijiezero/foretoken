# MVP default install entrypoint.
# It installs the ModelService CRD, controller RBAC, and controller manager.
# Optional operational integrations such as metrics, Prometheus,
# NetworkPolicy, and webhooks should live in dedicated overlays.

# Adds namespace to all resources.
namespace: control-plane-system

# Value of this field is prepended to the names of all resources.
namePrefix: control-plane-

resources:
- ../crd
- ../rbac
- ../manager
