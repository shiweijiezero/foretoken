# Select only this trusted receiver and accept alerts from workload namespaces.
# Apply to the existing Alertmanager with kubectl patch --type merge --patch-file.
spec:
  alertmanagerConfigSelector:
    matchLabels:
      inference.foretoken.io/alert-receiver: lark
  alertmanagerConfigNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: foretoken-platform
  alertmanagerConfigMatcherStrategy:
    type: None
