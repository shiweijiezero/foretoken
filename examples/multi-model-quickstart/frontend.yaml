# Frontend shared by both model services.

apiVersion: inference.foretoken.io/v1alpha1
kind: FrontendService
metadata:
  name: multi-model-frontend
spec:
  replicas: 2
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 2Gi
  timeouts:
    request: 10m
    streamIdle: 5m
  routerPipeline:
    filter:
      algorithm: allow_all
    scorer:
      algorithm: least_loaded
    picker:
      algorithm: gamble_sampling
