# Fixed-capacity Llama model service.

apiVersion: inference.foretoken.io/v1alpha1
kind: ModelService
metadata:
  name: multi-model-llama3.2-1b
spec:
  model: unsloth/Llama-3.2-1B-Instruct
  source: hf # Supported sources: local, hf, modelscope. Defaults to hf.
  backend: vllm
  replicas: 1
  nodes: 1
  resources:
    requests:
      cpu: "4"
      memory: 48Gi
      gpu:
        count: 1
    limits:
      cpu: "8"
      memory: 64Gi
  timeouts:
    startup: 5m
    drain: 2m
  engineArgs:
    max-model-len: 32768
    tensor-parallel-size: 1
