# Fixed-capacity Llama model service.

apiVersion: inference.foretoken.io/v1alpha1
kind: ModelService
metadata:
  name: multi-model-llama3.2-1b
spec:
  model: unsloth/Llama-3.2-1B-Instruct
  backend: vllm
  replicas: 1
  nodes: 1
  resources:
    requests:
      cpu: "4"
      memory: 48Gi
      gpu:
        count: 1
    limits:
      cpu: "8"
      memory: 64Gi
  timeouts:
    startup: 10m
    drain: 2m
  parallelism:
    tp: 1
    pp: 1
    pcp: 1
    dcp: 1
  extraArgs:
    - --max-model-len=8192
