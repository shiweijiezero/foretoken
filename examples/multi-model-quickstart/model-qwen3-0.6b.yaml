# Queue-autoscaled Qwen model service.

apiVersion: inference.foretoken.io/v1alpha1
kind: ModelService
metadata:
  name: multi-model-qwen3-0.6b
spec:
  model: Qwen/Qwen3-0.6B
  backend: vllm
  replicas: 1
  autoscaling:
    minReplicas: 1
    maxReplicas: 3
    trigger:
      algorithm: periodic
      interval: 5s
    decision:
      algorithm: queue
      queue:
        targetAverageQueuedRequests: 1
    adjustment:
      algorithm: step
      scaleUp:
        stabilizationWindow: 0s
      scaleDown:
        stabilizationWindow: 300s
  nodes: 1
  resources:
    requests:
      cpu: "4"
      memory: 48Gi
      gpu:
        count: 1
    limits:
      cpu: "8"
      memory: 64Gi
  timeouts:
    startup: 5m
    drain: 2m
  parallelism:
    tp: 1
    pp: 1
    pcp: 1
    dcp: 1
  extraArgs:
    - --max-model-len=32768
