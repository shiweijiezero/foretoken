apiVersion: inference.foretoken.io/v1alpha1
kind: ModelService
metadata:
  name: quantized-model
spec:
  model: Qwen/Qwen2.5-0.5B-Instruct
  source: hf
  backend: vllm
  replicas: 1
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
      gpu:
        count: 1
    limits:
      cpu: "4"
      memory: 16Gi
  timeouts:
    startup: 5m
    drain: 2m
  engineArgs:
    tensor-parallel-size: 1
    quantization: torchao
    dtype: float16
    enforce-eager: true
    hf-overrides:
      quantization_config_dict_json: '{"_type":"Int8WeightOnlyConfig","_version":2,"_data":{"set_inductor_config":false}}'
