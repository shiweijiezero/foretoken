# Foretoken Draft/Target deployment entrypoint, which deploys both the model and frontend services.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: foretoken-dt
resources:
  - namespace.yaml
  - cache.yaml
  - frontend.yaml
  - model.yaml
