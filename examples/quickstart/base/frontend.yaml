# Foretoken frontend service configuration.

apiVersion: inference.foretoken.io/v1alpha1
kind: FrontendService
metadata:
  name: quickstart-frontend # Kubernetes name of this frontend service.
spec:
  replicas: 2 # Increase or decrease to scale frontend capacity.
  resources: # Resources allocated to each frontend replica.
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 2Gi
  timeouts:
    request: 10m # Maximum duration of a client request.
    streamIdle: 5m # Maximum time a stream may produce no response chunks.
  routerPipeline:
    filter: allow_all
    scorer: least_loaded
    picker: round_robin
