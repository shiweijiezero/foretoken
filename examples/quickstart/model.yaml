# Foretoken Quick Start model service configuration.

apiVersion: inference.foretoken.io/v1alpha1
kind: ModelService
metadata:
  name: quickstart-qwen3-0.6b # Kubernetes name of this model service.
spec:
  model: Qwen/Qwen3-0.6B # Public model identifier or local path.
  source: hf # Supported sources: local, hf, modelscope. Defaults to hf.
  backend: vllm # Inference backend selected for this model service.
  replicas: 1 # Number of complete model replicas.
  nodes: 1 # Each replica currently runs on a single Kubernetes node.
  resources: # Resources allocated to each model replica.
    requests:
      cpu: "4"
      memory: 48Gi
      gpu:
        count: 1 # GPUs requested by each model replica.
    limits:
      cpu: "8"
      memory: 64Gi
  timeouts:
    startup: 5m # Maximum time allowed for model loading and backend initialization.
    drain: 2m # Maximum time allowed for accepted requests to finish during shutdown.
  engineArgs:
    max-model-len: 32768
    tensor-parallel-size: 1
