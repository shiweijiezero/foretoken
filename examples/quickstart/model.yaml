# Foretoken Quick Start model service configuration.

apiVersion: inference.foretoken.io/v1alpha1
kind: ModelService
metadata:
  name: quickstart-qwen3-0.6b # Kubernetes name and default API model alias.
spec:
  model: Qwen/Qwen3-0.6B # Model artifact to serve, such as a Hugging Face repository or supported URI.
  backend: vllm # Inference backend selected for this model service.
  # Every ModelGroup uses the same parallelism and per-Pod resource settings below.
  # ModelPool
  # ├── ModelGroup 1
  # └── ModelGroup N (N = replicas)
  replicas: 1 # Number of complete model replicas (ModelGroups).
  nodes: 1 # Number of Kubernetes nodes used by each ModelGroup.
  # Each ModelGroup uses nodes × resources.requests.gpu.count GPUs in total.
  resources: # Resources allocated to each ModelGroup runtime member Pod.
    requests:
      cpu: "4"
      memory: 48Gi
      gpu:
        type: auto # Operator selects a compatible GPU type.
        count: 1 # GPUs requested by each runtime member Pod.
    limits:
      cpu: "8"
      memory: 64Gi
  timeouts:
    startup: 10m # Maximum time allowed for model loading and backend initialization.
    drain: 2m # Maximum time allowed for accepted requests to finish during shutdown.
  parallelism:
    tp: 1 # Number of tensor-parallel ranks in each ModelGroup.
    pp: 1 # Number of pipeline-parallel stages in each ModelGroup.
    pcp: 1 # Prefill-context-parallel size in each ModelGroup.
    dcp: 1 # Decode-context-parallel size in each ModelGroup.
    # Qwen3-0.6B is a dense model, so EP is disabled. A MoE model can use:
    # ep:
    #   size: 16 # Requires nodes × resources.requests.gpu.count = 16.
    #   backend: allgather_reducescatter
    #   eplb: false
  # Backend arguments are listed last and override equivalent fields above.
  extraArgs:
    - --max-model-len=32768 # Maximum number of input and generated tokens in one request.
