apiVersion: inference.foretoken.io/v1alpha1
kind: FrontendService
metadata:
  name: glm-api
spec:
  replicas: 1
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  timeouts:
    request: 60m
    streamIdle: 30m
  routerPipeline:
    filter: allow_all
    scorer: kv_least_loaded
    picker: weighted_random
