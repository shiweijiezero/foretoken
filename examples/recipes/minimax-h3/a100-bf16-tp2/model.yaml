apiVersion: inference.foretoken.io/v1alpha1
kind: ModelService
metadata:
  name: h3-fl2va
spec:
  model: MiniMax-H3/FL2VA
  source: local
  backend: vllm-omni
  replicas: 1
  nodes: 1
  resources:
    requests:
      cpu: "32"
      memory: 256Gi
      gpu:
        count: 2
    limits:
      cpu: "64"
      memory: 384Gi
  timeouts:
    startup: 1h
    drain: 4000s
  engineArgs:
    init-timeout: 3600
    stage-init-timeout: 3600
    trust-remote-code: true
    text-encoder-tp-size: 2
    vae-patch-parallel-size: 2
    vae-parallel-mode: tile
    vae-use-tiling: true
    enable-cpu-offload: true
    diffusion-attention-backend: FLASH_ATTN
