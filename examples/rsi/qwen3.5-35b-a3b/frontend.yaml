apiVersion: inference.foretoken.io/v1alpha1
kind: FrontendService
metadata:
  name: qwen3-5-35b-a3b
spec:
  replicas: 1
  resources:
    requests:
      cpu: "1"
      memory: 4G
    limits:
      cpu: "2"
      memory: 4G
  timeouts:
    request: 10m
    streamIdle: 5m
  routerPipeline:
    filter:
      algorithm: allow_all
    scorer:
      algorithm: least_loaded
