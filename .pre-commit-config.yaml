minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files   # 防误传模型 / trace / 权重
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-json
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # 禁止内网路径 / 私有 IP 进入 tracked 文件
  - repo: local
    hooks:
      - id: forbid-intranet-paths
        name: forbid intranet NFS paths (/export, /ssddata)
        description: 阻止把集群本地 NFS 路径写进会提交的文件
        entry: '(/export/|/ssddata\b)'
        language: pygrep
        types: [text]
        exclude: '^\.pre-commit-config\.yaml$'
      - id: forbid-private-ip
        name: forbid RFC1918 private IPs
        description: 阻止内网私有 IP 直接出现在 tracked 文件
        entry: '\b(10\.\d{1,3}|192\.168|172\.(1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}\b'
        language: pygrep
        types: [text]
        exclude: '^\.pre-commit-config\.yaml$'

      # 重测放 pre-push(慢的端到端走 -m slow,不进此快子集),别拖慢每次 commit
      - id: pytest-fast
        name: pytest (fast subset)
        entry: pytest -q -m "not slow"
        language: system
        pass_filenames: false
        stages: [pre-push]
