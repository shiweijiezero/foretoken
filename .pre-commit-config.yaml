# Foretoken pre-commit
# 研究阶段以「防泄密 + 基础卫生」为主;P0 起代码后再开启 ruff / pytest(见文末 TODO)。
#
# 启用一次(任选其一):
#   uvx pre-commit install
#   pip install pre-commit && pre-commit install
# 全量自查:
#   uvx pre-commit run --all-files
#
# 注:infra/ 已在 .gitignore(第一道防线);下面的 forbid-* 是第二道防线,
#     防止内网路径 / 私网 IP 被「粘贴」进其它会提交的文件里。
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files   # 防误传模型 / trace / 权重
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-json
      - id: detect-private-key

  # 第二道防线:内网信息不得进入会提交的文件(模式本身是通用词,不含任何真实秘密)
  - repo: local
    hooks:
      - id: forbid-intranet-paths
        name: forbid intranet NFS paths (/export, /ssddata)
        description: 阻止把集群本地 NFS 路径写进会提交的文件
        entry: '(/export/|/ssddata\b)'
        language: pygrep
        types: [text]
        exclude: '^\.pre-commit-config\.yaml$'
      - id: forbid-private-ip
        name: forbid RFC1918 private IPs
        description: 阻止内网私有 IP 直接出现在 tracked 文件
        entry: '\b(10\.\d{1,3}|192\.168|172\.(1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}\b'
        language: pygrep
        types: [text]
        exclude: '^\.pre-commit-config\.yaml$'

