<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proposal 树</title>
<style>
:root{
  --bg:#f3f6fb;--surface:#fff;--surface-2:#f8fafc;
  --ink:#0f172a;--ink-2:#334155;--muted:#64748b;--faint:#94a3b8;
  --line:#e5eaf2;--soft:#f0f4f9;
  --accent:#3b6fd4;--accent-soft:#eaf1fd;
  --green:#15803d;--green-bg:#e9f6ee;
  --blue:#2f6fdb;--purple:#7c3aed;--amber:#b7791f;--gray:#8b939e;--red:#c0392b;--slate:#334155;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.05)
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;
  font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
select,input,button{font:inherit;color:inherit}
select{border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--surface-2);cursor:pointer;transition:border-color .15s,background .15s}
select:hover{border-color:#c3d2e8;background:#fff}
button{border:1px solid var(--line);border-radius:8px;padding:5px 12px;background:#fff;cursor:pointer;transition:.15s}
button:hover{background:var(--surface-2);border-color:#c3d2e8}
:focus-visible{outline:2px solid #bcd2f5;outline-offset:1px}
label.ctl{display:inline-flex;align-items:center;gap:7px;color:var(--muted);white-space:nowrap;font-size:12px}
main{flex:1;display:flex;min-height:0}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{height:58px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.95)}
.brand{display:flex;align-items:center;gap:10px;padding-right:16px;border-right:1px solid var(--line)}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#4b7ee0,#2f5cc0);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;box-shadow:0 3px 9px rgba(59,111,212,.28);letter-spacing:-.02em}
.brand b{font-size:14px;line-height:1.2;display:block}
.brand small{display:block;font-size:10.5px;color:var(--faint);line-height:1.35}
.bar .grow{flex:1}
.bar .tip{font-size:11.5px;color:var(--faint);white-space:nowrap;border-left:1px solid var(--line);padding-left:14px}
.canvas{flex:1;overflow:auto;background-color:var(--bg);background-image:radial-gradient(#d9e2f0 1px,transparent 1px);background-size:20px 20px}
svg text{font-family:inherit}
.card{fill:#fff;stroke:var(--line);stroke-width:1.2;filter:drop-shadow(0 2px 3px rgba(15,23,42,.06))}
.halo{fill:rgba(59,111,212,.06);stroke:rgba(59,111,212,.28);stroke-width:1}
.node{cursor:pointer}
.node:hover .card{stroke:#a9bdd8;filter:drop-shadow(0 4px 10px rgba(15,23,42,.10))}
.node.sel .card{stroke:var(--accent);stroke-width:2;filter:drop-shadow(0 4px 12px rgba(59,111,212,.18))}
.node.base .card{fill:#fbfcfe;stroke:var(--slate);stroke-width:1.8}
.node.merge .card{fill:#f4fbf7;stroke:var(--green);stroke-width:1.8}
.node.exp .card{fill:#fff}
.node.pending .card{stroke-dasharray:5 3}
.node.pruned text,.node.pruned circle,.node.pruned line,.node.pruned .pill,.node.pruned .halo{opacity:.5}
.lbl{font-size:12.5px;font-weight:650;fill:var(--ink)}
.kind{font-size:9.5px;font-weight:700;fill:var(--faint);letter-spacing:.04em}
.sub{font-size:10.5px;fill:var(--muted)}
.chip{font-size:10.5px;font-weight:700}
.val{font-size:11px;font-weight:700;fill:var(--slate)}
.tag{font-size:10.5px;fill:var(--muted)}
.edge{fill:none;stroke:#c7d3e4;stroke-width:1.5}
.edge.pruned{stroke-dasharray:2 4}
.edge.trunk{stroke:#34a06a;stroke-width:3;opacity:.9}
.edge.refines{stroke:var(--slate);stroke-width:1.2;stroke-dasharray:5 4;opacity:.5}
.toggle{cursor:pointer}
.toggle circle{fill:#fff;stroke:#b6c5da;stroke-width:1.2;filter:drop-shadow(0 1px 2px rgba(15,23,42,.08))}
.toggle:hover circle{stroke:var(--accent)}
.toggle text{font-size:12px;font-weight:700;fill:var(--slate);pointer-events:none}

/* 详情面板：粘性标题头 + 分区卡片，保证每个节点打开后信息自解释 */
aside{width:506px;flex:none;background:var(--bg);border-left:1px solid var(--line);overflow:auto;overscroll-behavior:contain}
.d-head{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.d-head::before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:var(--head-c,var(--accent))}
.d-crumb{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--faint);margin-bottom:8px;flex-wrap:wrap}
.d-crumb b{color:var(--muted);font-weight:700}
.d-crumb s{text-decoration:none;color:#cbd5e1}
.d-head h2{font-size:19px;margin:0 0 9px;line-height:1.3;letter-spacing:-.01em;word-break:break-word}
.d-badges{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tagbox{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:700}
.badge-ghost{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--muted);font-weight:600}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;flex:none}
.d-sub{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.55}
.d-body{padding:14px 16px 32px}
section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
section h3{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);margin:0 0 12px;font-weight:700;letter-spacing:.01em}
section h3::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--accent);flex:none}
section h3 i{font-style:normal;font-weight:500;color:var(--faint);margin-left:auto;font-size:10.5px;letter-spacing:0;background:var(--surface-2);padding:2px 8px;border-radius:20px}
.kv{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kv>div{display:grid;grid-template-columns:82px minmax(0,1fr);gap:12px;padding:9px 12px;border-bottom:1px solid var(--soft);font-size:12.5px;align-items:start;background:#fff}
.kv>div:last-child{border-bottom:0}
.kv>div:nth-child(even){background:#fcfdff}
.kv>div>span:first-child{color:var(--muted);font-size:11.5px;padding-top:1px}
.kv>div>span:last-child{color:var(--ink);font-weight:500;word-break:break-word;line-height:1.55}
.kv a{color:var(--accent);text-decoration:none;border-bottom:1px dashed #a9c2ee}
.kv a:hover{border-bottom-style:solid}
.gap{height:12px}
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:14px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px 8px}
.mcard-top{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.mcard-metric{font-size:18px;font-weight:750;letter-spacing:-.01em;color:var(--ink);line-height:1.15}
.mcard-scope{font-size:10.5px;color:var(--muted);flex:none;font-weight:600}
.mcard-v{font-size:27px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:-.02em;line-height:1.08}
.mcard-v small{font-size:10px;font-weight:600;color:var(--faint);margin-left:3px}
.mcard-d{font-size:11px;margin-top:3px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.mcard-d em{font-style:normal;font-weight:400;color:var(--faint);margin-left:3px}
.mcard-n{font-size:10px;color:var(--faint);margin-top:4px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{background:var(--surface-2);color:var(--muted);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);font-size:11px;white-space:nowrap}
td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--soft);color:var(--ink-2);white-space:nowrap}
tbody tr:hover td{background:#fbfdff}
th:first-child,td:first-child{text-align:left}
td:first-child{font-weight:600;color:var(--ink);white-space:normal}
tr:last-child td{border-bottom:0}
.unit{color:var(--faint);font-size:10px}
.up{color:var(--green)}.down{color:var(--red)}
.delta{display:inline-block;padding:1px 6px;border-radius:6px;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.delta.up{background:var(--green-bg);color:var(--green)}
.delta.down{background:#fdeceb;color:var(--red)}
.empty{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:12px 14px}
.empty::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.refline{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);background:var(--surface-2);border-radius:20px;padding:3px 10px;margin-top:10px}
.refline b{color:var(--ink-2);font-weight:600}
.warn{display:flex;gap:8px;align-items:center;font-size:11.5px;color:#92610e;background:#fff8e8;border:1px solid #f3e2ba;border-radius:8px;padding:7px 10px;margin-top:9px}
.warn::before{content:'!';width:15px;height:15px;border-radius:50%;background:#f0d191;color:#7a5208;font-size:10px;font-weight:800;display:grid;place-items:center;flex:none}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a,.goChip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2);text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer;transition:.15s;max-width:100%}
.links a:hover,.goChip:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.goChip .dot{width:7px;height:7px}
.goChip small{color:var(--faint);font-size:10.5px;white-space:nowrap}
.callout{border-radius:10px;padding:11px 13px;background:var(--accent-soft);border:1px solid #d5e3fa;font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.callout b{display:block;font-size:10.5px;color:var(--accent);letter-spacing:.06em;margin-bottom:4px}
.neg-list{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.neg-list li{background:#fdf6f4;border:1px solid #f6e2dd;border-left:3px solid var(--red);border-radius:8px;padding:9px 11px;margin:0;font-size:12px;line-height:1.55}
.neg-list b{color:var(--ink)}
footer{min-height:34px;padding:6px 18px;background:#fff;border-top:1px solid var(--line);color:var(--muted);font-size:10.5px;display:flex;align-items:center;gap:0;flex-wrap:wrap}
footer .grp{display:flex;align-items:center;gap:12px;padding-right:14px;margin-right:14px;border-right:1px solid var(--line)}
footer .grp:last-child{border-right:0}
footer .grp>span:first-child{color:var(--faint);font-weight:700;letter-spacing:.04em}
footer i{display:inline-block;width:9px;height:9px;border-radius:3px;vertical-align:-1px;margin-right:4px}
footer .ln{font-weight:700}
@media (max-width:1080px){aside{width:420px}}
@media (max-width:900px){main{flex-direction:column}aside{width:100%;height:48%;border-left:0;border-top:1px solid var(--line)}.bar{height:auto;min-height:56px;flex-wrap:wrap;padding:8px 14px;gap:10px}.brand{border-right:0}.bar .tip{display:none}}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="bar">
      <div class="brand"><span class="mark">P</span><span><b>Proposal 树</b><small>研究方案与实验追踪</small></span></div>
      <label class="ctl">比较条件 <select id="scope"></select></label>
      <label class="ctl">指标 <select id="metric"></select></label>
      <button id="expand">全部展开</button>
      <button id="collapse">全部收起</button>
      <span class="grow"></span>
      <span class="tip">点击任意节点查看完整信息</span>
    </div>
    <div class="canvas"><svg id="tree" role="img" aria-label="Proposal 树"></svg></div>
  </div>
  <aside id="detail"></aside>
</main>
<footer>
  <span class="grp"><span>探索方向</span>
    <span><i style="background:var(--amber)"></i>待实现</span>
    <span><i style="background:#0e7490"></i>实现中</span>
    <span><i style="background:var(--blue)"></i>已完成</span>
    <span><i style="background:var(--gray)"></i>已放弃</span></span>
  <span class="grp"><span>实验</span>
    <span><i style="background:var(--amber)"></i>等待执行</span>
    <span><i style="background:var(--purple)"></i>执行中</span>
    <span><i style="background:var(--blue)"></i>已完成</span>
    <span><i style="background:var(--red)"></i>失败</span>
    <span><i style="background:var(--green)"></i>★ 候选池</span></span>
  <span class="grp"><span>连线</span>
    <span class="ln" style="color:var(--green)">━ 合入下一轮 baseline</span>
    <span class="ln" style="color:var(--slate)">┄ 跨轮细化</span></span>
</footer>
<script id="data" type="application/json">__FORETOKEN_TREE_DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
// 按视觉宽度截断：中日韩字符约占 1.6 个单位，拉丁字符约 0.9 个，避免中文标题溢出卡片。
const trunc = (s, n) => { s = String(s || ''); let w = 0, out = ''; for (const ch of s) { const u = ch.charCodeAt(0) > 255 ? 1.6 : 0.9; if (w + u > n) return out + '…'; out += ch; w += u; } return out; };

// 输入是方案池和实验池的当前视图（字段见 research-tree_zh.md），这里转换成树节点。
// 每一轮：baseline（原始 baseline 或上一轮合版）→ 方案池中的 Proposal → 实验（叶子）；
// 合版是 mergeOf 非空的 Proposal，它成为下一轮的 baseline，树随轮次向右扩张。
const pid = name => 'p:' + name, eid = name => 'e:' + name;
const ROOT = {id: 'root', kind: 'root', label: D.baseline.name, code: D.baseline.code, m: D.baseline.m};
// 树上只放进入方案池的 Proposal：draft 尚未通过检查，rejected 不实施，两者不上树。
const IN_POOL = new Set(['ready', 'implementing', 'completed', 'abandoned']);
const byId = {root: ROOT};
D.proposals.filter(p => IN_POOL.has(p.state)).forEach(p => {
  byId[pid(p.name)] = {...p, id: pid(p.name), kind: p.mergeOf && p.mergeOf.length ? 'merge' : 'proposal', label: p.name};
});
const baseIdOf = p => p.baseName && byId[pid(p.baseName)] ? pid(p.baseName) : 'root';
Object.values(byId).forEach(n => {
  if (n.kind === 'merge') n.base = baseIdOf(n);
  if (n.kind !== 'proposal') return;
  // 细化关系：同一轮内挂在被细化的 Proposal 下；跨轮的细化挂在本轮 baseline 下，另画虚线指向原 Proposal。
  const ref = n.parentName && byId[pid(n.parentName)], base = baseIdOf(n);
  if (ref && baseIdOf(ref) === base && ref.kind === 'proposal') n.parent = ref.id;
  else { n.parent = base; if (ref && ref.id !== base) n.refines = ref.id; }
});
D.experiments.filter(e => byId[pid(e.proposalName)]).forEach(e => {
  byId[eid(e.name)] = {...e, id: eid(e.name), kind: 'exp', parent: pid(e.proposalName)};
});
const NODES = Object.values(byId);
const PROPS = NODES.filter(n => n.kind === 'proposal' || n.kind === 'merge');
const kids = {};
NODES.forEach(n => { if (n.parent) (kids[n.parent] ||= []).push(n); });
Object.values(kids).forEach(l => l.sort((a, b) => (a.kind !== 'exp') - (b.kind !== 'exp')));
const exps = p => (kids[p.id] || []).filter(c => c.kind === 'exp');
// 实验显示名由探索方向名称和实验次数生成：实验-<名称>-<第几次>。
PROPS.forEach(p => exps(p).forEach((e, i) => { e.label = `实验-${p.label}-${i + 1}`; }));
// 合版的测量取其最近一次完成的实验；它合入的实验和下一轮的 Proposal 以它为 baseline。
NODES.filter(n => n.kind === 'merge').forEach(m => {
  const done = exps(m).filter(e => e.state === 'completed');
  m.m = done.length ? done[done.length - 1].m : {};
  m.includes = m.mergeOf.map(eid);
  m.measured = m.base;
});
const nextMerge = Object.fromEntries(NODES.filter(n => n.kind === 'merge').map(m => [m.base, m]));
const LANES = [];
for (let b = ROOT; b; b = nextMerge[b.id]) LANES.push(b);
const isBase = n => n.kind === 'root' || n.kind === 'merge';
const baseOf = n => { let x = byId[n.parent]; while (!isBase(x)) x = byId[x.parent]; return x; };
// 实验未写实测 parent 时，以所在一轮的 baseline 为参照；合版自己的实验以上一轮 baseline 为参照。
NODES.filter(n => n.kind === 'exp').forEach(e => {
  const p = byId[e.parent];
  e.measured = e.measured ? eid(e.measured) : p.kind === 'merge' ? p.base : baseOf(e).id;
});
const descendants = n => (kids[n.id] || []).flatMap(c => [c, ...descendants(c)]);
// 状态直接取自方案池和实验池的记录。Proposal 与实验各有一套状态，键加前缀区分。
// 只有 Proposal 已放弃才剪枝；实验失败表示执行出错或撤销，不代表 idea 不成立。
const STATUS = {
  'p:ready': {nm: '待实现', c: '#b7791f', bg: '#fff8e8'},
  'p:implementing': {nm: '实现中', c: '#0e7490', bg: '#e9f7fa'},
  'p:completed': {nm: '已完成', c: '#2f6fdb', bg: '#eef4ff'},
  'p:abandoned': {nm: '已放弃', c: '#8b939e', bg: '#f3f5f7'},
  'e:pending': {nm: '等待执行', c: '#b7791f', bg: '#fff8e8'},
  'e:running': {nm: '执行中', c: '#7c3aed', bg: '#f5f0ff'},
  'e:completed': {nm: '已完成', c: '#2f6fdb', bg: '#eef4ff'},
  'e:failed': {nm: '失败', c: '#c0392b', bg: '#fdf2f0'}
};
NODES.forEach(n => { if (n.kind !== 'root') n.view = `${n.kind === 'exp' ? 'e' : 'p'}:${n.state}`; });
const isPruned = n => (n.kind === 'exp' ? byId[n.parent] : n).view === 'p:abandoned';
const PENDING = new Set(['p:ready', 'p:implementing', 'e:pending', 'e:running']);
// 候选池（帕雷托前沿）由实验者记录；★ 只标在尚未合版的一轮里。
const inPool = n => n.view === 'e:completed' && n.retained === true;
const showStar = n => inPool(n) && !nextMerge[baseOf(n).id];
const round = b => LANES.indexOf(b);
const GREEN = {c: '#1a7f4b', bg: '#eaf6ef'}, SLATE = {c: '#334155', bg: '#f8fafc'};
// 合版完成后作为下一轮 baseline；之前显示它自己作为 Proposal 的状态。
const style = n => n.kind === 'root' ? SLATE : n.kind === 'merge' && n.state === 'completed' ? GREEN : showStar(n) ? GREEN : STATUS[n.view];
const statusText = n => n.kind === 'root' ? '第 1 轮 baseline' : n.kind === 'merge' && n.state === 'completed' ? `第 ${round(n) + 1} 轮 baseline` : STATUS[n.view].nm;
// 探索方向 = 方案池里的 Proposal；命名与「实验-<名称>-<次数>」保持一致。
const title = n => n.kind === 'proposal' ? `探索方向-${n.label}` : n.label;
const CONFIG_KEYS = ['模型', '推理框架', '硬件信息'];

const OBJ = D.scopes.flatMap(s => D.metrics.map(m => ({s: s.id, m: m.key, slabel: s.label, mlabel: m.label, label: `${s.label} ${m.label}`, dir: m.dir})));
const val = (n, s, m) => n && n.m && n.m[s] ? n.m[s][m] ?? null : null;

    ['版本', `第 ${esc(n.revision)} 版`],
    ['提案', proposalDoc(n)],
    ['状态', `${esc(STATUS[n.view].nm)} <span class="unit">（${esc(n.state)}）</span>`]
  ];
  // 普通探索方向总是显示「基于」和「细化自」，保证所有探索方向的栏目一致。
  if (n.kind === 'proposal') {
    rows.push(['基于', esc(n.baseName ?? D.baseline.name)]);
    rows.push(['细化自', esc(n.parentName ?? '—')]);
  }
  if (n.mergeOf && n.mergeOf.length) rows.push(['合入实验数', String(n.mergeOf.length)]);
  const concl = n.conclusion ? `<div class="callout"><b>结论</b>${esc(n.conclusion)}</div>`
    : '<div class="empty">该方案尚未形成结论。</div>';
  return kvRows(rows) + '<div class="gap"></div>' + concl;
}
let lastSel = null;
function renderDetail() {
  const n = byId[state.sel] || ROOT, st = style(n);
  const lane = `第 ${Math.max(0, isBase(n) ? round(n) : round(baseOf(n))) + 1} 轮`;
  const crumb = [`<b>${esc(KIND[n.kind])}</b>`, esc(lane)];
  if (!isBase(n) && byId[n.parent]) crumb.push(esc(byId[n.parent].label));
  // 节点类型与轮次已在面包屑里，这里只放状态和有增量信息的标记，避免重复。
  const badges = [`<span class="tagbox" style="background:${st.bg};color:${st.c};border:1px solid ${st.c}">${dot(st.c)}${esc(showStar(n) ? '★ 候选池' : statusText(n))}</span>`];
  if (n.kind === 'exp' && n.retained) badges.push('<span class="badge-ghost">帕雷托前沿</span>');
  if (n.kind === 'merge') badges.push(`<span class="badge-ghost">合入 ${(n.mergeOf || []).length} 个实验</span>`);
  if (isPruned(n)) badges.push('<span class="badge-ghost">已剪枝</span>');
  let sub = '';
  if (n.kind === 'root') sub = `全树测量的原始参照`;
  else if (n.kind === 'merge') sub = esc(n.conclusion || `合入 ${(n.mergeOf || []).length} 个实验，作为下一轮 baseline`);
  else if (n.kind === 'proposal') sub = '';
  else sub = esc(n.description || '');
  let h = `<header class="d-head" style="--head-c:${st.c}">` +
    `<div class="d-crumb">${crumb.join('<s>›</s>')}</div><h2>${esc(title(n))}</h2>` +
    `<div class="d-badges">${badges.join('')}</div>` +
    (sub ? `<div class="d-sub">${sub}</div>` : '') + `</header><div class="d-body">`;
  if (n.kind === 'root') {
    // 配置表：固定三行「模型 / 推理框架 / 硬件信息」，数据优先来自 config，兼容写在 task 里的同名键，额外键追加在后。
    const src = {...(D.task || {}), ...(D.config || {})};
    const extra = Object.keys(D.config || {}).filter(k => !CONFIG_KEYS.includes(k));
    const keys = [...CONFIG_KEYS, ...extra];
    h += sec('配置', '运行环境', kvRows(keys.map(k =>
      [esc(k), src[k] != null && src[k] !== '' ? esc(src[k]) : '<span class="unit">未填写</span>'])));
    h += sec('profiling 结果', '原始基准', measure(n));
    h += sec('代码', '', kv({'git': n.code}));
  } else if (n.kind === 'exp') {
    h += sec('实验', '', kv({'名称': n.name, '目的': n.description}));
    h += sec('所属方案', '', goLinks([byId[n.parent]].filter(Boolean)));
    h += sec('profiling 结果', '测量结果', measure(n));
    h += sec('记录', '', kvRows([['实验记录', link('report.md', n.recordDirectory + '/report.md')]]));
  } else {
    if (n.kind === 'proposal' && n.refines) h += sec('细化自', '', goLinks([byId[n.refines]].filter(Boolean)));
    h += sec('方案', '方案池', proposalInfo(n));
    // 合版的代码是合并后的 git 版本，下一轮的探索方向都基于它。
    if (n.kind === 'merge') h += mergePanel(n) + sec('代码', '', kvRows([['git', n.code ? esc(n.code) : '<span class="unit">未填写</span>']]));
    else {
      const l = exps(n);
      h += sec('关联实验', `${l.length} 次`, l.length ? goLinks(l) : '<div class="empty">该方案尚无实验记录。</div>');
      const done = l.filter(e => e.state === 'completed');
      if (done.length) h += sec('最近一次实验', '测量结果', measure(done[done.length - 1]));
    }
  }
  h += '</div>';
  $('detail').innerHTML = h;
  // 切换节点时回到顶部，避免沿用上一个节点的滚动位置。
  if (lastSel !== n.id) { $('detail').scrollTop = 0; lastSel = n.id; }
  $('detail').querySelectorAll('a[data-go]').forEach(a => a.onclick = () => { state.sel = a.dataset.go; render(); });
}

function render() { renderTree(); renderDetail(); }
D.scopes.forEach(s => $('scope').add(new Option(s.label, s.id)));
D.metrics.forEach(m => $('metric').add(new Option(`${m.label} ${m.unit} ${m.dir === 'up' ? '↑' : '↓'}`, m.key)));
$('scope').onchange = e => { state.scope = e.target.value; render(); };
$('metric').onchange = e => { state.metric = e.target.value; render(); };
$('expand').onclick = () => { state.collapsed.clear(); renderTree(); };
$('collapse').onclick = () => { state.collapsed = new Set(PROPS.filter(p => p.kind === 'proposal' && isBase(byId[p.parent])).map(p => p.id)); renderTree(); };
render();
</script>
</body>
</html>
