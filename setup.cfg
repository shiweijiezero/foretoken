[metadata]
name = foretoken-cli
version = 0.0.1
description = Command-line tools for deploying and evaluating Foretoken services
long_description = file: cli/README.md
long_description_content_type = text/markdown
license = Apache-2.0
author = Foretoken contributors

[options]
python_requires = >=3.10
install_requires =
    PyYAML>=6.0
packages =
    foretoken_cli
    benchmarks
    benchmarks.client
    benchmarks.deployment
    benchmarks.logger
    benchmarks.metrics
    benchmarks.report
    benchmarks.runner
    benchmarks.storage
    benchmarks.workload
package_dir =
    foretoken_cli = cli/foretoken_cli
    benchmarks = benchmarks

[options.extras_require]
bench =
    datasets>=2.14
    evalscope>=1.10
    httpx>=0.27
    huggingface_hub>=0.23
    matplotlib>=3.7
    numpy>=1.24
    openai>=1.40
    tqdm>=4.65
    transformers>=4.40
    wandb>=0.16
dev =
    pytest>=7.0

[options.entry_points]
console_scripts =
    foretoken = foretoken_cli.main:main
